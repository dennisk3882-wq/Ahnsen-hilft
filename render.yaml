services:
  - type: web
    name: ahnsen-hilft
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pwa_main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PWA_SESSION_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:gemeinde@ahnsen.de
