services:
  - type: web
    name: ahnsen-live-quiz
    runtime: node
    region: frankfurt
    plan: free
    branch: ahnsen-live-quiz-online
    buildCommand: cd quiz-app && npm ci && npm run test:all
    startCommand: cd quiz-app && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: QUIZ_TITLE
        value: QuizTime
      - key: QUESTION_SECONDS
        value: "20"
      - key: EVENT_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PROFILE_SESSION_SECRET
        generateValue: true
      - key: PLATFORM_SECURITY_SECRET
        generateValue: true
      - key: MAIL_FROM_NAME
        value: QuizTime
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
