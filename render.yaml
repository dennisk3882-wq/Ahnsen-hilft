services:
  - type: web
    name: pantrypilot
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cat _deploy/PantryPilot-Production.zip.part* > /tmp/pantrypilot.zip && unzip -q -o /tmp/pantrypilot.zip -d . && node _patch/apply.js && cd pantrypilot-production && npm install --omit=dev
    startCommand: cd pantrypilot-production && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:pantrypilot@example.com
      - key: ALLOW_NEW_HOUSEHOLDS
        value: "false"
    disk:
      name: pantrypilot-data
      mountPath: /var/data
      sizeGB: 1
