services:
  - type: web
    name: ahnsen-live-quiz
    runtime: node
    region: frankfurt
    plan: free
    branch: ahnsen-live-quiz-online
    buildCommand: cat quiz-v6.b64.part00 quiz-v6.b64.part01 quiz-v6.b64.part02 quiz-v6.b64.part03.0 quiz-v6.b64.part03.1 quiz-v6.b64.part03.2 quiz-v6.b64.part04.0 quiz-v6.b64.part04.1 quiz-v6.b64.part04.2 quiz-v6.b64.part05.0 quiz-v6.b64.part05.1 quiz-v6.b64.part05.2 quiz-v6.b64.part06.0 quiz-v6.b64.part06.1 quiz-v6.b64.part06.2 quiz-v6.b64.part07.0 quiz-v6.b64.part07.1 quiz-v6.b64.part07.2 quiz-v6.b64.part08.0 quiz-v6.b64.part08.1 quiz-v6.b64.part08.2 quiz-v6.b64.part09.0 quiz-v6.b64.part09.1 quiz-v6.b64.part09.2 quiz-v6.b64.part10.0 quiz-v6.b64.part10.1 quiz-v6.b64.part10.2 quiz-v6.b64.part11 | tr -d '\r\n ' | base64 -d > quiz-v6.tar.gz && test "$(sha256sum quiz-v6.tar.gz | cut -d' ' -f1)" = "83984616269a7a898b112c9ca4cb61d606ab8b82ef1babfee3da4f15d0a18279" && gzip -t quiz-v6.tar.gz && rm -rf quiz-app && mkdir quiz-app && tar -xzf quiz-v6.tar.gz -C quiz-app && cat quiz-v6.1-patch.part00 quiz-v6.1-patch.part01 quiz-v6.1-patch.part02_03 quiz-v6.1-patch.part04_05 quiz-v6.1-patch.part06_07 quiz-v6.1-patch.part08_09 quiz-v6.1-patch.part10_11 quiz-v6.1-patch.part12_13 quiz-v6.1-patch.part14 quiz-v6.1-patch.part15 | tr -d '\r\n ' | base64 -d > quiz-v6.1-ui-patch.tar.gz && test "$(sha256sum quiz-v6.1-ui-patch.tar.gz | cut -d' ' -f1)" = "baa0485bd22861a6d9a7609db5b4c52c30c595eb4b776c879ec818568a073c4d" && gzip -t quiz-v6.1-ui-patch.tar.gz && tar -xzf quiz-v6.1-ui-patch.tar.gz -C quiz-app && cd quiz-app && npm install && npm run check && npm run test:core
    startCommand: cd quiz-app && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: QUIZ_TITLE
        value: Ahnsen Quizabend
      - key: QUESTION_SECONDS
        value: "20"
      - key: EVENT_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
