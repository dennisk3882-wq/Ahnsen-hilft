services:
  - type: web
    name: ahnsen-hilft
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pwa_main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PWA_SESSION_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:gemeinde@ahnsen.de

  - type: cron
    name: ahnsen-pwa-erinnerungen
    runtime: python
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python pwa_push_job.py
    envVars:
      - key: DATABASE_URL
        fromService:
          name: ahnsen-hilft
          type: web
          envVarKey: DATABASE_URL
      - key: VAPID_PUBLIC_KEY
        fromService:
          name: ahnsen-hilft
          type: web
          envVarKey: VAPID_PUBLIC_KEY
      - key: VAPID_PRIVATE_KEY
        fromService:
          name: ahnsen-hilft
          type: web
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_SUBJECT
        fromService:
          name: ahnsen-hilft
          type: web
          envVarKey: VAPID_SUBJECT
