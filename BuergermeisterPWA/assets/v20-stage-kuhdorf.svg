<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#68c8ee"/><stop offset=".58" stop-color="#b9e4f2"/><stop offset="1" stop-color="#e7f2e3"/></linearGradient>
  <linearGradient id="mount1" x2="0" y2="1"><stop stop-color="#4a8369"/><stop offset="1" stop-color="#2b5848"/></linearGradient>
  <linearGradient id="mount2" x2="0" y2="1"><stop stop-color="#6ca76a"/><stop offset="1" stop-color="#3d774f"/></linearGradient>
  <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#78b85e"/><stop offset="1" stop-color="#376f43"/></linearGradient>
  <linearGradient id="road" x2="0" y2="1"><stop stop-color="#4e5961"/><stop offset="1" stop-color="#242e34"/></linearGradient>
  <linearGradient id="walk" x2="0" y2="1"><stop stop-color="#cfd1c6"/><stop offset="1" stop-color="#8e948d"/></linearGradient>
  <linearGradient id="villaWall" x2="1" y2="1"><stop stop-color="#f4e9cf"/><stop offset=".5" stop-color="#d6c2a1"/><stop offset="1" stop-color="#b69a72"/></linearGradient>
  <linearGradient id="villaRoof" x2="1" y2="1"><stop stop-color="#ba5b39"/><stop offset="1" stop-color="#713321"/></linearGradient>
  <linearGradient id="shopWall" x2="1" y2="1"><stop stop-color="#857766"/><stop offset="1" stop-color="#413e3d"/></linearGradient>
