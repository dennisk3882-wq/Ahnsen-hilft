<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1e47" />
  <meta name="description" content="Finanzplan – private Haushalts- und Finanzplanung als moderne PWA." />
  <title>Finanzplan</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./styles-v2.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><span>⌁</span></div><div><strong>Finanzplan</strong><small>Deine Finanzen im Griff</small></div></div>
      <nav id="sideNav" class="side-nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span>Übersicht</button>
        <button class="nav-item" data-view="transactions"><span>⇄</span>Transaktionen</button>
        <button class="nav-item" data-view="planning"><span>▣</span>Planung</button>
        <button class="nav-item" data-view="budgets"><span>◫</span>Budgets</button>
        <button class="nav-item" data-view="wealth"><span>◇</span>Vermögen</button>
        <button class="nav-item" data-view="contracts"><span>▤</span>Verträge & Abos</button>
        <button class="nav-item" data-view="goals"><span>◎</span>Sparziele</button>
        <button class="nav-item" data-view="calendar"><span>□</span>Kalender</button>
        <button class="nav-item" data-view="stats"><span>⌁</span>Statistiken</button>
        <button class="nav-item" data-view="assistant"><span>✦</span>Finanzassistent</button>
        <button class="nav-item" data-view="more"><span>•••</span>Mehr</button>
      </nav>
      <div class="sidebar-accounts"><div class="section-label">KONTEN</div><div id="sidebarAccounts"></div></div>
      <div class="sidebar-bottom">
        <button id="privacyToggle" class="ghost-dark"><span>◉</span><span>Privatmodus</span></button>
        <button id="themeToggle" class="ghost-dark"><span>☾</span><span>Dark Mode</span></button>
        <button class="profile-card" data-view="settings"><span class="avatar">FP</span><span><b>Mein Haushalt</b><small>Lokales Profil</small></span><span>⌄</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div><h1 id="pageTitle">Übersicht</h1><p id="pageSubtitle">Deine Finanzen im Überblick</p></div><div class="top-actions"><button id="monthPrev" class="icon-button" aria-label="Vorheriger Monat">‹</button><button id="monthPicker" class="date-button"><span>▣</span><span id="monthLabel"></span></button><button id="monthNext" class="icon-button" aria-label="Nächster Monat">›</button><button id="quickAddTop" class="primary-button"><span>＋</span> Buchung</button></div></header>
      <section id="view-dashboard" class="view active"></section><section id="view-transactions" class="view"></section><section id="view-planning" class="view"></section><section id="view-budgets" class="view"></section><section id="view-wealth" class="view"></section><section id="view-contracts" class="view"></section><section id="view-goals" class="view"></section><section id="view-calendar" class="view"></section><section id="view-stats" class="view"></section><section id="view-assistant" class="view"></section><section id="view-more" class="view"></section><section id="view-settings" class="view"></section>
    </main>
    <nav class="mobile-nav" aria-label="Mobile Navigation"><button class="active" data-view="dashboard"><span>⌂</span><small>Übersicht</small></button><button data-view="transactions"><span>⇄</span><small>Buchungen</small></button><button id="quickAddMobile" class="mobile-plus" aria-label="Neue Buchung">＋</button><button data-view="budgets"><span>◫</span><small>Budgets</small></button><button data-view="more"><span>•••</span><small>Mehr</small></button></nav>
  </div>
  <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">Dialog</h2><p id="modalHint"></p></div><button id="modalClose" class="icon-button">×</button></div><div id="modalBody"></div></div></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <input id="fileImport" class="hidden" type="file" accept=".csv,.json,.fplan,.xls,.xlsx,.xml" />
  <input id="receiptImport" class="hidden" type="file" accept="image/*,.pdf" />
  <template id="metricTemplate"><article class="metric-card"><div class="metric-head"><span class="metric-label"></span><span class="metric-icon"></span></div><strong class="metric-value money"></strong><div class="spark"></div><small class="metric-note"></small></article></template>

  <script src="./app-preload.js"></script>
  <script src="./finance-lib.js"></script>
  <script src="./app-core.js"></script>
  <script src="./app-dashboard.js"></script>
  <script src="./app-transactions.js"></script>
  <script src="./app-recurring.js"></script>
  <script src="./app-budgetwealth.js"></script>
  <script src="./app-contractsgoals.js"></script>
  <script src="./app-analytics.js"></script>
  <script src="./app-moreui.js"></script>
  <script src="./app-modal.js"></script>
  <script src="./app-forms-a.js"></script>
  <script src="./app-forms-b1.js"></script>
  <script src="./app-forms-b2.js"></script>
  <script src="./app-tools-small.js"></script>
  <script src="./app-files-a.js"></script>
  <script src="./app-files-b.js"></script>
  <script src="./app-export.js"></script>
  <script src="./app-v2-engine.js"></script>
  <script src="./app-v2-ui.js"></script>
  <script src="./app-v2-dataio.js"></script>
  <script src="./app-security.js"></script>
  <script src="./app-v2-security.js"></script>
  <script src="./app-projectreset.js"></script>
  <script src="./app-v2-history.js"></script>
  <script src="./app-v2-post.js"></script>
</body>
</html>
