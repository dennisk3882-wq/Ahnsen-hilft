plugins {
    id 'com.android.application'
}

android {
    namespace 'com.denko.eufymonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.denko.eufymonitor'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin']
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['tflite']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
