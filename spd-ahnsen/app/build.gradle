plugins { id 'com.android.application' }
android {
  namespace 'de.ahnsen.spd'
  compileSdk 35
  defaultConfig {
    applicationId 'de.ahnsen.spd.pro'
    minSdk 26
    targetSdk 34
    versionCode 230
    versionName '2.3.0'
  }
  packaging {
    resources {
      excludes += ['META-INF/LICENSE.md','META-INF/NOTICE.md','META-INF/LICENSE','META-INF/NOTICE']
    }
  }
}
dependencies {
  implementation 'com.sun.mail:android-mail:1.6.7'
  implementation 'com.sun.mail:android-activation:1.6.7'
}
