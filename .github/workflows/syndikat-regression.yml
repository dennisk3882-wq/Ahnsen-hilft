name: Syndikat regression

on:
  push:
    paths:
      - 'Syndikat/**'
      - '.github/workflows/syndikat-regression.yml'
  pull_request:
    paths:
      - 'Syndikat/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated core bundle
        run: node Syndikat/tools/build-core.cjs --check
      - name: Run Syndikat regression suite
        run: node Syndikat/tests/regression.cjs
