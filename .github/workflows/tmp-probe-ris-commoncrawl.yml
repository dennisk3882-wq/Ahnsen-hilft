name: Temporary RIS archive discovery
on:
  push:
    branches: [agent/import-latest-ris-protokoll]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-latest-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Query public URL indexes for official RIS paths
        run: |
          python - <<'PY'
          import json, requests
          domain='samtgemeinde-eilsen.ratsinfomanagement.net'
          s=requests.Session(); s.headers['User-Agent']='Ahnsen-hilft research/1.0'

          print('=== COMMON CRAWL ===')
          coll=s.get('https://index.commoncrawl.org/collinfo.json',timeout=30).json()
          for meta in [x for x in coll if x.get('id','').startswith('CC-MAIN-2026')][:7]:
              idx=meta['id']
              try:
                  r=s.get(f'https://index.commoncrawl.org/{idx}-index',params={'url':domain,'matchType':'domain','output':'json','filter':'status:200','collapse':'urlkey'},timeout=60)
                  print('CC',idx,r.status_code,len(r.text))
                  if r.status_code==200:
                      for line in r.text.splitlines()[:500]:
                          try: row=json.loads(line)
                          except: continue
                          u=row.get('url','')
                          if any(k in u.lower() for k in ['pdf','download','sitz','tops','termin','dokument','file','doc']):
                              print('CCURL',row.get('timestamp'),row.get('mime'),u)
              except Exception as e: print('CCERR',idx,repr(e))

          print('=== WAYBACK ===')
          try:
              r=s.get('https://web.archive.org/cdx/search/cdx',params={'url':domain+'/*','output':'json','fl':'timestamp,original,statuscode,mimetype,digest','filter':'statuscode:200','from':'2026','to':'2026','collapse':'urlkey'},timeout=90)
              print('WB',r.status_code,len(r.text))
              if r.status_code==200:
                  rows=r.json()
                  print('WBROWS',len(rows)-1 if rows else 0)
                  for row in rows[1:1000]:
                      u=row[1]
                      if any(k in u.lower() for k in ['pdf','download','sitz','tops','termin','dokument','file','doc']): print('WBURL',*row[:4])
              else: print(r.text[:1000])
          except Exception as e: print('WBERR',repr(e))

          print('=== URLSCAN ===')
          try:
              r=s.get('https://urlscan.io/api/v1/search/',params={'q':'domain:'+domain,'size':100},timeout=60)
              print('US',r.status_code,len(r.text))
              if r.status_code==200:
                  data=r.json(); print('USRESULTS',len(data.get('results',[])))
                  for item in data.get('results',[]):
                      page=item.get('page') or {}; task=item.get('task') or {}
                      print('USURL',task.get('time'),page.get('url') or task.get('url'))
              else: print(r.text[:1000])
          except Exception as e: print('USERR',repr(e))
          PY
