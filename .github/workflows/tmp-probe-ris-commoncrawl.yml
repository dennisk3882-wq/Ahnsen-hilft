name: Temporary RIS archive discovery
on:
  push:
    branches: [agent/import-latest-ris-protokoll]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-latest-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Search official public RIS through reader
        run: |
          python - <<'PY'
          import requests, urllib.parse
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Ahnsen-hilft research'
          base='https://r.jina.ai/http://samtgemeinde-eilsen.ratsinfomanagement.net'
          paths=[
            '/gremien',
            '/recherche',
            '/recherche?terms='+urllib.parse.quote('Gemeinderat Ahnsen'),
            '/recherche?terms='+urllib.parse.quote('Niederschrift Gemeinderat Ahnsen'),
            '/recherche?terms='+urllib.parse.quote('Ahnsen 2026'),
            '/recherche?terms='+urllib.parse.quote('Niederschrift Ahnsen 2026'),
          ]
          for path in paths:
            u=base+path
            try:
              r=s.get(u,timeout=90)
              print('\n===',path,'=== STATUS',r.status_code,'LEN',len(r.content))
              text=r.text.replace('\x00','')
              print(text[:25000])
            except Exception as e: print('ERR',path,repr(e))
          PY
