name: Temporary RIS archive discovery
on:
  push:
    branches: [agent/import-latest-ris-protokoll]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-latest-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe public readers for the public RIS
        run: |
          python - <<'PY'
          import requests
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Ahnsen-hilft research'
          urls=[
            'https://r.jina.ai/http://samtgemeinde-eilsen.ratsinfomanagement.net/',
            'https://r.jina.ai/https://samtgemeinde-eilsen.ratsinfomanagement.net/',
            'https://r.jina.ai/http://samtgemeinde-eilsen.ratsinfomanagement.net/termine',
            'https://r.jina.ai/https://samtgemeinde-eilsen.ratsinfomanagement.net/termine',
            'https://samtgemeinde--eilsen-ratsinfomanagement-net.translate.goog/?_x_tr_sl=de&_x_tr_tl=en&_x_tr_hl=en',
          ]
          for u in urls:
            try:
              r=s.get(u,timeout=90,allow_redirects=True)
              print('\n===',u,'===')
              print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
              txt=r.text[:20000]
              print(txt.replace('\x00','')[:8000])
            except Exception as e: print('ERR',u,repr(e))
          PY
