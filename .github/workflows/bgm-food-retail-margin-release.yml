name: Bürgermeister Food Retail Margin Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-food-retail-margin-release.yml'

permissions:
  contents: write

concurrency:
  group: buergermeister-food-retail-margin-release
  cancel-in-progress: false

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply retail food margin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BuergermeisterPWA/app.js')
          s = p.read_text()
          old = 'const unitPrice = this.market.food * .65;'
          new = 'const unitPrice = this.market.food * 1.65;'
          if old not in s:
              raise SystemExit('old 65% export formula missing')
          s = s.replace(old, new, 1)
          s = s.replace("['Exportpreis', '65% des aktuellen Nahrungspreises']", "['Verkaufspreis', '165% des aktuellen Nahrungspreises (+65% Handelsaufschlag)']")
          s = s.replace('Dafür werden 65% des aktuellen Nahrungspreises erzielt.', 'Verkauft wird zum Endkundenpreis von 165% des aktuellen Nahrungspreises, also mit 65% Handelsaufschlag.')
          s = s.replace('zu 65% des aktuellen Nahrungspreises.', 'zu 165% des aktuellen Nahrungspreises (65% Handelsaufschlag).')
          p.write_text(s)

          sw = Path('BuergermeisterPWA/sw.js')
          t = sw.read_text()
          if 'buergermeister-1992-plus-v10' not in t:
              raise SystemExit('expected cache v10 missing')
          sw.write_text(t.replace('buergermeister-1992-plus-v10', 'buergermeister-1992-plus-v11', 1))
          PY

      - name: Verify retail margin implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          grep -Fq 'this.market.food * 1.65' BuergermeisterPWA/app.js
          grep -Fq '165% des aktuellen Nahrungspreises' BuergermeisterPWA/app.js
          grep -Fq 'buergermeister-1992-plus-v11' BuergermeisterPWA/sw.js

      - name: Behavioral retail-margin tests
        working-directory: BuergermeisterPWA
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('app.js','utf8').replace(/\n\s*renderHome\(\);\n\}\)\(\);\s*$/, '\n  globalThis.__BGM_TEST__={Game};\n})();');
          const store = new Map();
          const context = {
            console, Math, Date, Intl,
            document:{getElementById:()=>({}),createElement:()=>({})},
            navigator:{},
            localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)},
            globalThis:null
          };
          context.globalThis=context;
          vm.createContext(context); vm.runInContext(src, context);
          const Game=context.__BGM_TEST__.Game;
          let g=new Game();
          g.inventory.food=500; g.inventory.supermarkets=1; g.market.food=4;
          let q=g.foodExportPreview(400);
          if(q.sold!==150) throw new Error('Supermarket capacity changed '+JSON.stringify(q));
          if(q.revenue!==990) throw new Error('165 percent retail price failed '+JSON.stringify(q));
          if(q.unitPrice!==6.6) throw new Error('Expected 65 percent markup '+JSON.stringify(q));
          g.inventory.supermarkets=0;
          q=g.foodExportPreview(400);
          if(q.sold!==0 || q.revenue!==0) throw new Error('No-supermarket protection failed '+JSON.stringify(q));
          console.log('FOOD_RETAIL_MARGIN_OK');
          NODE

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested retail margin and promote production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/app.js BuergermeisterPWA/sw.js
          git commit -m 'Use supermarket retail markup for food surplus'
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$RELEASE_SHA"; then
            echo 'Production branch is not an ancestor; refusing promotion.'
            exit 1
          fi
          git push origin "$RELEASE_SHA":refs/heads/buergermeister-production
          echo "Promoted $RELEASE_SHA"
