name: Temporary home contact fire tiles

on:
  push:
    branches:
      - agent/home-contact-fire-tiles

permissions:
  contents: write

jobs:
  update-ui:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-contact-fire-tiles
      - name: Move links
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('pwa_ui.py')
          text = ui.read_text(encoding='utf-8')

          replacements = [
              ('    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎",\n',
               '    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎", "fire": "🚒",\n'),
              ('        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),\n        ("shield", "Warnungen", "Amtliche Warnlage für Ahnsen.", "/warnungen"),\n',
               '        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),\n        ("phone", "Ansprechpartner", "Wichtige Kontakte auf einen Blick.", "/ansprechpartner"), ("fire", "Feuerwehr", "Feuerwehr Ahnsen & Sicherheit.", "/feuerwehr"),\n        ("shield", "Warnungen", "Amtliche Warnlage für Ahnsen.", "/warnungen"),\n'),
              ('    items = [("Ansprechpartner", "/ansprechpartner", "phone", "Wichtige Kontakte"), ("Feuerwehr", "/feuerwehr", "shield", "Sicherheit und Ehrenamt"), ("Warnlage", "/warnungen", "bell", "Amtliche Wetter- und Gefahrenwarnungen"),',
               '    items = [("Warnlage", "/warnungen", "bell", "Amtliche Wetter- und Gefahrenwarnungen"),'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Erwarteter UI-Baustein nicht gefunden')
              text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8')

          js = Path('static/pwa.js')
          script = js.read_text(encoding='utf-8')
          start = script.find("    const menu = document.querySelector('.menu-list');\n")
          end_marker = "\n    let installPrompt = null;"
          end = script.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Profil-Eintrag im Mehr-Menü nicht gefunden')
          script = script[:start] + "    let installPrompt = null;" + script[end + len(end_marker):]
          js.write_text(script, encoding='utf-8')
          PY
      - name: Validate files
        run: |
          python -m py_compile pwa_ui.py
          node --check static/pwa.js
      - name: Commit changes
        run: |
          rm .github/workflows/temp-home-contact-fire-tiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py static/pwa.js .github/workflows/temp-home-contact-fire-tiles.yml
          git commit -m "Kontakt und Feuerwehr auf die Startseite verschieben"
          git push origin HEAD:agent/home-contact-fire-tiles
