name: Temporary home contact fire tiles

on:
  push:
    branches:
      - agent/home-contact-fire-tiles

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-contact-fire-tiles
      - name: Move profile, contacts and fire brigade links
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('pwa_ui.py')
          text = ui.read_text(encoding='utf-8')

          old_icons = '    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎",\n'
          new_icons = '    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎", "fire": "🚒",\n'
          if old_icons not in text:
              raise SystemExit('Icon-Zeile nicht gefunden')
          text = text.replace(old_icons, new_icons, 1)

          old_services = '''        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),
        ("shield", "Warnungen", "Amtliche Warnlage für Ahnsen.", "/warnungen"),
'''
          new_services = '''        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),
        ("phone", "Ansprechpartner", "Wichtige Kontakte auf einen Blick.", "/ansprechpartner"), ("fire", "Feuerwehr", "Feuerwehr Ahnsen & Sicherheit.", "/feuerwehr"),
        ("shield", "Warnungen", "Amtliche Warnlage für Ahnsen.", "/warnungen"),
'''
          if old_services not in text:
              raise SystemExit('Service-Liste nicht gefunden')
          text = text.replace(old_services, new_services, 1)

          old_more = '    items = [("Ansprechpartner", "/ansprechpartner", "phone", "Wichtige Kontakte"), ("Feuerwehr", "/feuerwehr", "shield", "Sicherheit und Ehrenamt"), ("Warnlage", "/warnungen", "bell", "Amtliche Wetter- und Gefahrenwarnungen"), ("Bürgerinformationen", "/buergerinformationen", "news", "Hinweise der Gemeinde"), ("Über Ahnsen", "/ueber-ahnsen", "home", "Unser Dorf"), ("Meldestatus", "/meldestatus", "search", "Bearbeitungsstand prüfen"), ("Verwaltung", "/verwaltung", "building", "Geschützter Bereich"), ("Datenschutz", "/datenschutz", "shield", "Datenverarbeitung"), ("Impressum", "/impressum", "news", "Anbieterkennzeichnung")]\n'
          new_more = '    items = [("Warnlage", "/warnungen", "bell", "Amtliche Wetter- und Gefahrenwarnungen"), ("Bürgerinformationen", "/buergerinformationen", "news", "Hinweise der Gemeinde"), ("Über Ahnsen", "/ueber-ahnsen", "home", "Unser Dorf"), ("Meldestatus", "/meldestatus", "search", "Bearbeitungsstand prüfen"), ("Verwaltung", "/verwaltung", "building", "Geschützter Bereich"), ("Datenschutz", "/datenschutz", "shield", "Datenverarbeitung"), ("Impressum", "/impressum", "news", "Anbieterkennzeichnung")]\n'
          if old_more not in text:
              raise SystemExit('Mehr-Menü nicht gefunden')
          text = text.replace(old_more, new_more, 1)
          ui.write_text(text, encoding='utf-8')

          js = Path('static/pwa.js')
          script = js.read_text(encoding='utf-8')
          old_profile_menu = '''    const menu = document.querySelector('.menu-list');
    if (menu && !menu.querySelector('a[href="/profil"]')) {
      const row = document.createElement('a');
      row.className = 'menu-row profile-menu-link';
      row.href = '/profil';
      row.innerHTML = '<span><span class="glyph" aria-hidden="true">●</span></span><div><strong>Mein Profil</strong><small>Eigene Meldungen, DGH-Anfragen und Push</small></div><span class="glyph" aria-hidden="true">›</span>';
      menu.prepend(row);
    }

'''
          if old_profile_menu not in script:
              raise SystemExit('Profil-Eintrag im Mehr-Menü nicht gefunden')
          script = script.replace(old_profile_menu, '', 1)
          js.write_text(script, encoding='utf-8')
          PY
      - name: Validate files
        run: |
          python -m py_compile pwa_ui.py
          node --check static/pwa.js
      - name: Commit changes
        run: |
          rm .github/workflows/temp-home-contact-fire-tiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py static/pwa.js .github/workflows/temp-home-contact-fire-tiles.yml
          git commit -m "Kontakt und Feuerwehr auf die Startseite verschieben"
          git push origin HEAD:agent/home-contact-fire-tiles
