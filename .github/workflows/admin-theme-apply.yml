name: Apply administration PWA design

on:
  push:
    branches:
      - agent/dashboard-im-pwa-design
    paths:
      - .github/workflows/admin-theme-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-im-pwa-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply shared administration layout
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  if required:
                      raise SystemExit(f'Expected block not found in {path}')
                  return
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Veranstaltungen: add the same branded hero and constrained page shell.
          replace(
              'veranstaltungen_dashboard.py',
              '''    <body>
                  {intern_nav("veranstaltungen")}
          
                  <h1>📅 Veranstaltungen</h1>
                  <p class="subtitle">
                      Hier können Veranstaltungen erstellt, bearbeitet, aktiviert und gelöscht werden.
                      Vergangene Termine werden automatisch ausgeblendet.
                  </p>
          ''',
              '''    <body>
                  <main class="admin-page">
                  {intern_nav("veranstaltungen")}
          
                  <section class="admin-hero">
                      <span class="admin-eyebrow">Dorfleben organisieren</span>
                      <h1>Veranstaltungen</h1>
                      <p>Termine für die Bürger-PWA erstellen, bearbeiten, veröffentlichen und übersichtlich verwalten.</p>
                      <div class="admin-hero-actions">
                          <a href="/veranstaltungen" target="_blank" rel="noopener">Öffentliche Termine ansehen</a>
                      </div>
                  </section>
          ''',
          )
          replace(
              'veranstaltungen_dashboard.py',
              '''    </body>
              </html>''',
              '''        </main>
              </body>
              </html>''',
          )

          # DGH: same page shell, modern heading and PWA language.
          replace(
              'dgh_dashboard.py',
              '''    <body>
                  {intern_nav("dgh")}
          
                  <h1>🏠 DGH buchen</h1>
                  <p class="subtitle">Termine verwalten, Belegung ansehen und interne Kommentare speichern.</p>
          ''',
              '''    <body>
                  <main class="admin-page">
                  {intern_nav("dgh")}
          
                  <section class="admin-hero">
                      <span class="admin-eyebrow">Dorfgemeinschaftshaus</span>
                      <h1>DGH-Verwaltung</h1>
                      <p>Anfragen prüfen, Belegungen bestätigen und freie Termine für die Bürger-PWA aktuell halten.</p>
                      <div class="admin-hero-actions">
                          <a href="/dgh-mieten" target="_blank" rel="noopener">Öffentliche DGH-Seite ansehen</a>
                      </div>
                  </section>
          ''',
          )
          replace(
              'dgh_dashboard.py',
              'Interner Kommentar (wird nicht per WhatsApp gesendet)',
              'Interner Kommentar (nur im Verwaltungsbereich sichtbar)',
          )
          replace(
              'dgh_dashboard.py',
              '''    </body>
              </html>''',
              '''        </main>
              </body>
              </html>''',
          )

          # Waste calendar: keep existing layout but use the PWA hero and terminology.
          replace(
              'muelltermine_dashboard.py',
              '<main class="container">',
              '<main class="container admin-page">',
          )
          replace(
              'muelltermine_dashboard.py',
              '''            <h1>🗑️ Müllabfuhr Termine</h1>
                          <p class="subtitle">
                              Lade einmal jährlich den persönlichen AWS-Abfuhrkalender für
                              Ahnsen hoch. Datum, Wochentag und Abfuhrarten werden automatisch
                              erkannt und für WhatsApp bereitgestellt.
                          </p>
          ''',
              '''            <section class="admin-hero">
                              <span class="admin-eyebrow">Abfallkalender verwalten</span>
                              <h1>Müllabfuhr</h1>
                              <p>Lade den AWS-Abfuhrkalender hoch. Die erkannten Termine erscheinen automatisch in der Bürger-PWA und bilden die Grundlage für Push-Erinnerungen.</p>
                              <div class="admin-hero-actions">
                                  <a href="/muelltermine-info" target="_blank" rel="noopener">Öffentliche Termine ansehen</a>
                                  <a href="/muelltermine.ics" target="_blank" rel="noopener">Kalenderexport prüfen</a>
                              </div>
                          </section>
          ''',
          )

          # Public-content editor: align wording and page shell with the PWA.
          replace(
              'gemeinde_dashboard.py',
              '<main class="wrap">',
              '<main class="wrap admin-page">',
          )
          replace(
              'gemeinde_dashboard.py',
              '''                <h1>Gemeindeseite bearbeiten</h1>
                              <p>
                                  Pflege hier Texte, Farben, Kontaktangaben, Links und die
                                  öffentlichen Inhalte der neuen Homepage.
                              </p>''',
              '''                <span class="admin-eyebrow">Bürger-App gestalten</span>
                              <h1>Inhalte & Erscheinungsbild</h1>
                              <p>Pflege Texte, Farben, Kontaktangaben, Bilder und alle öffentlichen Inhalte der Ahnsen-PWA an einer zentralen Stelle.</p>''',
          )

          # Remove the one-shot workflow after applying the source changes.
          Path('.github/workflows/admin-theme-apply.yml').unlink()
          PY
      - name: Validate Python modules
        run: |
          python -m py_compile \
            intern_ui.py \
            dashboard.py \
            veranstaltungen_dashboard.py \
            dgh_dashboard.py \
            muelltermine_dashboard.py \
            gemeinde_dashboard.py
      - name: Commit themed administration pages
        run: |
          git config user.name "Ahnsen PWA automation"
          git config user.email "actions@users.noreply.github.com"
          git add intern_ui.py dashboard.py veranstaltungen_dashboard.py dgh_dashboard.py muelltermine_dashboard.py gemeinde_dashboard.py .github/workflows/admin-theme-apply.yml
          git commit -m "Apply the PWA design to every administration module"
          git push origin agent/dashboard-im-pwa-design
