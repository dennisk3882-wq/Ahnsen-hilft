name: Refresh path-to-regexp Lockfile

on:
  push:
    branches:
      - stabilitaet-phase10-v101
    paths:
      - '.github/workflows/refresh-path-to-regexp-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: stabilitaet-phase10-v101
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json

      - name: Sicheren Express-Unterbaustein auflösen
        working-directory: quiz-app
        run: npm update path-to-regexp --package-lock-only --ignore-scripts

      - name: Aktualisierung committen
        run: |
          git config user.name "quiztime-ci"
          git config user.email "quiztime-ci@users.noreply.github.com"
          git add quiz-app/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "path-to-regexp auf sichere Lockfile-Version aktualisieren"
          git push origin HEAD:stabilitaet-phase10-v101
