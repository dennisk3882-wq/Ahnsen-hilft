name: Temporary test seeded Ahnsen protocols
on:
  push:
    branches: [agent/seed-two-ratsprotokolle]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/ahnsen-ratsarchive-seed.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seed-two-ratsprotokolle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test bundled protocol import
        run: |
          python - <<'PY'
          from ratsarchive_service import get_admin_archive, get_archive_snapshot, init_ratsarchive_db
          from ratsarchive_seed import seed_official_ratsarchive

          init_ratsarchive_db()
          first = seed_official_ratsarchive()
          assert first['errors'] == [], first
          assert first['missing_files'] == [], first
          assert first['meetings_created'] == 2, first
          assert first['documents_created'] == 2, first

          second = seed_official_ratsarchive()
          assert second['errors'] == [], second
          assert second['meetings_created'] == 0, second
          assert second['documents_created'] == 0, second

          admin = get_admin_archive()
          assert len(admin) == 2, admin
          assert all(len(item['documents']) == 1 for item in admin), admin
          assert all(item['documents'][0]['text_indexed'] for item in admin), admin

          snapshot = get_archive_snapshot(lookback_years=5)
          assert snapshot['meeting_count_all'] == 2, snapshot
          assert {item['date_label'] for item in snapshot['meetings']} == {'02.03.2023', '23.11.2022'}
          assert all(item['documents'][0]['download_url'].startswith('/politik-rat/dokument/') for item in snapshot['meetings'])
          print(first)
          print([(m['date_label'], m['documents'][0]['name']) for m in snapshot['meetings']])
          PY
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-test-seeded-ratsprotokolle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Temporären Protokoll-Importtest entfernen'
          git push origin HEAD:agent/seed-two-ratsprotokolle
