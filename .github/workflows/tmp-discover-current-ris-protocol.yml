name: Temporary discover current Ahnsen RIS protocol
on:
  push:
    branches: [agent/import-current-2026-ris-protokoll]
permissions:
  contents: write
jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-current-2026-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: pip install requests pypdf
      - name: Search archived official RIS copies
        run: |
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          DOMAIN = 'samtgemeinde-eilsen.ratsinfomanagement.net'
          out = Path('static/ratsarchive-seed')
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Ahnsen-hilft archive discovery/1.0'})

          def pdf_text(data: bytes) -> str:
              try:
                  reader = PdfReader(io.BytesIO(data))
                  return '\n'.join((p.extract_text() or '') for p in reader.pages[:40])[:500000]
              except Exception:
                  return ''

          records = []
          errors = []
          cdx_urls = [
              f'https://web.archive.org/cdx/search/cdx?url={DOMAIN}/*&from=2026&to=2026&output=json&fl=timestamp,original,mimetype,statuscode,digest&filter=statuscode:200&filter=mimetype:application/pdf&collapse=urlkey&limit=5000',
              f'https://web.archive.org/cdx/search/cdx?url={DOMAIN}/*.pdf&from=2026&to=2026&output=json&fl=timestamp,original,mimetype,statuscode,digest&filter=statuscode:200&collapse=urlkey&limit=5000',
          ]
          for url in cdx_urls:
              try:
                  r = session.get(url, timeout=45)
                  print('WAYBACK CDX', r.status_code, len(r.content), url)
                  if r.ok:
                      payload = r.json()
                      if payload and len(payload) > 1:
                          header = payload[0]
                          for row in payload[1:]:
                              item = dict(zip(header, row))
                              if item not in records:
                                  records.append(item)
              except Exception as e:
                  errors.append(f'wayback index: {e}')

          print('WAYBACK RECORDS', len(records))
          matches = []
          seen_digest = set()
          for idx, rec in enumerate(records[:1000], 1):
              original = rec.get('original','')
              timestamp = rec.get('timestamp','')
              digest = rec.get('digest','')
              if digest and digest in seen_digest:
                  continue
              seen_digest.add(digest)
              archived = f'https://web.archive.org/web/{timestamp}id_/{original}'
              try:
                  r = session.get(archived, timeout=40)
                  if not r.ok or not r.content.startswith(b'%PDF-'):
                      continue
                  text = pdf_text(r.content)
                  folded = text.casefold()
                  if 'ahnsen' not in folded:
                      continue
                  looks_protocol = any(k in folded for k in ('niederschrift', 'protokoll', 'sitzung des gemeinderates', 'gemeinderat ahnsen'))
                  if not looks_protocol:
                      continue
                  dates = re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.2026\b', text)
                  matches.append({'timestamp': timestamp, 'original': original, 'archive_url': archived, 'bytes': len(r.content), 'dates': sorted(set(dates)), 'text': text[:12000], 'data': r.content})
                  print('MATCH', original, len(r.content), sorted(set(dates))[:20])
              except Exception as e:
                  errors.append(f'wayback fetch {original}: {e}')
              if idx % 50 == 0:
                  time.sleep(0.2)

          # Common Crawl URL discovery as a second, independent archive index.
          cc_records = []
          try:
              ci = session.get('https://index.commoncrawl.org/collinfo.json', timeout=30)
              ci.raise_for_status()
              indexes = [x['cdx-api'] for x in ci.json() if str(x.get('id','')).startswith('CC-MAIN-2026')][:6]
              for api in indexes:
                  q = f'{api}?url={DOMAIN}/*&output=json&filter=status:200&filter=mime:application/pdf&pageSize=5&page=0'
                  rr = session.get(q, timeout=45)
                  print('COMMONCRAWL', rr.status_code, len(rr.content), api)
                  if rr.ok:
                      for line in rr.text.splitlines():
                          try:
                              item=json.loads(line)
                              if item not in cc_records: cc_records.append(item)
                          except Exception:
                              pass
          except Exception as e:
              errors.append(f'commoncrawl: {e}')

          # Prefer the latest identifiable 2026 Ahnsen protocol. Meeting dates are extracted from PDF text.
          def date_key(m):
              best=(0,0,0)
              for raw in m['dates']:
                  try:
                      d,mo,y=map(int,raw.split('.')); best=max(best,(y,mo,d))
                  except Exception: pass
              return best
          matches.sort(key=date_key, reverse=True)
          report=[]
          for n,m in enumerate(matches,1):
              report.append({k:v for k,v in m.items() if k not in {'data','text'}} | {'text_preview': m['text'][:3000]})
              if n <= 5:
                  datepart = '-'.join(str(x).zfill(2) for x in date_key(m)) if date_key(m)!=(0,0,0) else f'candidate-{n}'
                  filename = out / f'ris-2026-{datepart}-ahnsen-protokoll.pdf'
                  filename.write_bytes(m['data'])
                  print('SAVED', filename)

          Path('ris_discovery_report.json').write_text(json.dumps({'wayback_records':len(records),'matches':report,'commoncrawl_records':cc_records[:100],'errors':errors}, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'wayback_records':len(records),'matches':len(matches),'commoncrawl_records':len(cc_records),'errors':errors}, ensure_ascii=False))
          PY
      - name: Show discovery report
        run: |
          cat ris_discovery_report.json || true
          ls -lh static/ratsarchive-seed/ris-2026-* || true
      - name: Remove temporary workflow and commit discoveries
        if: always()
        run: |
          rm -f .github/workflows/tmp-discover-current-ris-protocol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RIS-Archivsuche für aktuelles Ahnsen-Protokoll auswerten' || true
          git push origin HEAD:agent/import-current-2026-ris-protokoll
