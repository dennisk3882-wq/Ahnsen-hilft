name: Citizen service center smoke tests

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./citizen-service-smoke.db
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Bürgerservice center
        run: |
          python -m py_compile citizen_service_center.py home_hero_inline_patch.py runtime_extensions.py
          python - <<'PY'
          from fastapi.responses import HTMLResponse
          import citizen_service_center as service
          import home_hero_inline_patch as home

          paths = {route.path for route in service.router.routes}
          assert '/buergerservice' in paths
          assert '/buergerinformationen' in paths

          html = service.citizen_service_page().body.decode('utf-8')
          assert '<h1>Bürgerservice</h1>' in html
          assert 'Was möchtest du erledigen?' in html
          assert 'Personalausweis' in html and 'Reisepass' in html
          assert 'Geburtsurkunde' in html and 'Online beantragen' in html
          assert 'Gewerbe anmelden' in html and 'Hund anmelden' in html
          assert 'Wohnungsgeberbestätigung' in html
          assert 'Grundstücksentwässerung' in html
          assert 'SEPA-Lastschriftmandat' in html
          assert 'Alle offiziellen Formulare & PDFs' in html
          assert 'Leistungen von A–Z' in html
          assert 'Samtgemeinde Eilsen' in html
          assert '05722 / 886-0' in html
          assert 'nicht in diesem Bereich der PWA erfasst oder gespeichert' in html
          assert 'target="_blank"' in html and 'rel="noopener noreferrer"' in html

          source = HTMLResponse('''<!doctype html><html><head></head><body><div class="hero-image" style="background-image:url('/assets/ahnsen-hero.webp?v=4')"></div><a href="/buergerinformationen"><h3>Bürgerinformationen</h3><p>Hinweise der Gemeinde.</p></a></body></html>''')
          polished = home._with_inline_hero(source).body.decode('utf-8')
          assert 'href="/buergerservice"' in polished
          assert '<h3>Bürgerservice</h3>' in polished
          assert 'Anträge, Dokumente &amp; Rathausservices.' in polished
          assert 'href="/buergerinformationen"' not in polished

          runtime = open('runtime_extensions.py', encoding='utf-8').read()
          assert 'citizen_service_center_installed' in runtime
          assert 'from citizen_service_center import router as citizen_service_router' in runtime
          print('Citizen service center smoke tests passed')
          PY
