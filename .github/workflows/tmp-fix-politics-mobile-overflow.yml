name: Temporary fix politics mobile overflow
on:
  push:
    branches: [agent/fix-politics-mobile-overflow]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-politics-mobile-overflow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply responsive fix
        run: python scripts/tmp_fix_politics_mobile_overflow.py
      - name: Validate politics mobile CSS
        run: |
          python -m py_compile community_ui.py
          python - <<'PY'
          from pathlib import Path
          text = Path('community_ui.py').read_text(encoding='utf-8')
          assert 'scroll-snap-type:x proximity' not in text
          assert '.council-member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible' in text
          assert '@media(max-width:430px){.council-member-grid{grid-template-columns:1fr}' in text
          assert '.council-portal{display:grid;gap:16px;min-width:0;width:100%;max-width:100%;overflow-x:hidden}' in text
          assert '.council-meeting-main{min-width:0;max-width:100%;overflow-wrap:anywhere' in text
          print('politics mobile overflow guard: OK')
          PY
      - name: Commit only production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community_ui.py
          git commit -m 'Politikbereich auf Mobilgeräten ohne Horizontal-Overflow darstellen'
          git push origin HEAD:agent/fix-politics-mobile-overflow
