name: Bürgermeister Autonomous QA

on:
  push:
    branches: [main]
    paths:
      - 'BuergermeisterPWA/**'
      - '.github/workflows/buergermeister-autotest.yml'
  pull_request:
    paths:
      - 'BuergermeisterPWA/**'
      - '.github/workflows/buergermeister-autotest.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run the deep Monte-Carlo suite'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: buergermeister-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-test:
    name: Simulation, balance, browser and PWA integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select test depth
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.deep }}" == "true" ]]; then
            echo "DEEP_TEST=1" >> "$GITHUB_ENV"
            echo "Running DEEP Monte-Carlo suite"
          else
            echo "DEEP_TEST=0" >> "$GITHUB_ENV"
            echo "Running STANDARD verification suite"
          fi

      - name: Syntax and split-engine checks
        working-directory: BuergermeisterPWA
        run: |
          node --check game-engine.js
          node --check app.js
          node --check tests/e2e.mjs

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Run autonomous test system
        if: always()
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Install browser test runtime
        working-directory: BuergermeisterPWA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Browser end-to-end smoke
        working-directory: BuergermeisterPWA
        run: node tests/e2e.mjs

      - name: Upload full QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buergermeister-qa-report-${{ github.run_number }}
          path: BuergermeisterPWA/test-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Promote tested commit to production
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$GITHUB_SHA"; then
            echo "Production branch is not an ancestor of the tested commit. Refusing unsafe promotion."
            exit 1
          fi
          git push origin "$GITHUB_SHA":refs/heads/buergermeister-production
          echo "Promoted tested commit $GITHUB_SHA to buergermeister-production"
