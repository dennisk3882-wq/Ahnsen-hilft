name: Temporary Poliscope key docs
on:
  push:
    branches: [agent/ahnsen-protokolle-direkt]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect API auth docs
        shell: bash
        run: |
          python - <<'PY'
          import requests, json
          spec=requests.get('https://api.poliscope.de/v2/openapi.json',timeout=15).json()
          print('INFO',json.dumps(spec.get('info',{}),ensure_ascii=False,indent=2)[:5000])
          print('SECURITY',json.dumps(spec.get('security'),ensure_ascii=False,indent=2))
          print('SCHEMES',json.dumps(spec.get('components',{}).get('securitySchemes',{}),ensure_ascii=False,indent=2)[:5000])
          for p in ['/meetings','/files/{id}','/search']:
              op=(spec.get('paths',{}).get(p) or {}).get('get') or {}
              print('\nPATH',p)
              for k in ['summary','description','security']:
                  print(k,json.dumps(op.get(k),ensure_ascii=False)[:4000])
          for url in ['https://docs.poliscope.de/api','https://poliscope.de/api','https://poliscope.de/preise','https://poliscope.de/kontakt']:
              try:
                  r=requests.get(url,timeout=15,headers={'User-Agent':'Mozilla/5.0'})
                  print('\nPAGE',url,r.status_code,r.url,r.headers.get('content-type'))
                  text=r.text.replace('\n',' ')
                  for needle in ['API-Key','API Key','apikey','Schlüssel','Kontakt','registrieren','Registrieren']:
                      i=text.lower().find(needle.lower())
                      if i>=0: print('HIT',needle,text[max(0,i-500):i+1800])
              except Exception as e: print('ERR',url,repr(e))
          PY
