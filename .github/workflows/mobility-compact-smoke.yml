name: Mobility compact UI smoke tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: mobility-compact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./mobility-compact-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate compact mobility UI
        run: |
          python -m py_compile mobility_trip_buttons_patch.py feature_routes.py
          python - <<'PY'
          import mobility_trip_buttons_patch as compact
          import mobility_citizen as legacy

          html = compact.compact_content()
          assert 'Wie kommst du ans Ziel?' in html
          assert 'Beste Verbindung suchen' in html
          assert '.mob-citizen .cit-board' in html
          assert '.mob-citizen .cit-map-details' in html
          assert '.mob-citizen .cit-lines' in html
          assert 'display: none !important' in html
          assert legacy._content is compact.content

          # APIs and Fahrtverlauf remain installed even though the old panels
          # are hidden from the citizen page.
          paths = {getattr(route, 'path', '') for route in compact.router.routes}
          for path in (
              '/api/mobilitaet/haltestellen',
              '/api/mobilitaet/ziele',
              '/api/mobilitaet/verbindungen',
              '/api/mobilitaet/fahrt',
          ):
              assert path in paths, path

          print('Mobility compact UI smoke tests passed')
          PY
