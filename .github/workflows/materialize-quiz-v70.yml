name: Materialize Quiz v7

on:
  push:
    branches:
      - quiz-v70-materialized-cleanup
  pull_request:
    branches:
      - ahnsen-live-quiz-online

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: quiz-v70-materialized-cleanup

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: quiz-app
        run: npm ci

      - name: Version 7 dauerhaft materialisieren
        shell: bash
        run: |
          set -euo pipefail
          cd quiz-app
          if node -e "const p=require('./package.json'); process.exit(p.version==='7.0.0' && !p.scripts['prepare:v7'] ? 0 : 1)"; then
            echo "Version 7 ist bereits materialisiert."
          else
            npm run prepare:v7
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='7.0.0'; delete p.scripts['prepare:v7']; p.scripts.start='node server.js'; p.scripts['test:all']='npm run check && npm run test:core && npm run test:catalog'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
            rm -f ../tools/prepare-v70.js ../tools/apply-v70.js ../.github/workflows/apply-v70.yml
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Sauberen Endstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test ! -f tools/prepare-v70.js
          test ! -f tools/apply-v70.js
          test -s quiz-app/public/vendor/qrcode.min.js
          ! grep -q 'prepare:v7' quiz-app/package.json
          ! grep -q 'cdnjs.cloudflare.com' quiz-app/public/screen.html
          cd quiz-app
          npm run test:all

      - name: Materialisierten Stand committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine weiteren Änderungen."
            exit 0
          fi
          git commit -m "Version 7 als normale Projektdateien materialisieren"
          git push origin HEAD:quiz-v70-materialized-cleanup
