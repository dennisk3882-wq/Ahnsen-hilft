name: Temporary Ratsinfo internal-only apply
on:
  push:
    branches: [agent/ratsinfo-internal-only]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratsinfo-internal-only
          fetch-depth: 0
      - name: Apply internal-only politics navigation
        run: python scripts/apply_ratsinfo_internal_only.py
      - name: Validate politics page
        run: |
          python -m py_compile community_ui.py community_routes.py ratsinfo_service.py
          python - <<'PY'
          from pathlib import Path
          text = Path('community_ui.py').read_text(encoding='utf-8')
          section = text[text.index('def politics_page'):text.index('_PUBLIC_MAP_TEMPLATE')]
          assert 'Offizielles Ratsinfo' not in section
          assert 'Sitzung im Original öffnen' not in section
          assert 'Infos der Samtgemeinde' not in section
          assert 'Originaldatei der Samtgemeinde herunterladen' in section
          assert 'vollständig in Ahnsen hilft' in section
          PY
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/apply_ratsinfo_internal_only.py .github/workflows/tmp-ratsinfo-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community_ui.py scripts/apply_ratsinfo_internal_only.py .github/workflows/tmp-ratsinfo-probe.yml
          git commit -m 'Politik und Rat vollständig in der PWA halten'
          git push origin HEAD:agent/ratsinfo-internal-only
