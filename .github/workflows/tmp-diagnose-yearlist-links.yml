name: Temporary diagnose Ahnsen yearlist document links
on:
  push:
    branches: [agent/ratsarchive-autosync]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratsarchive-autosync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Inspect annual list around Ahnsen sessions
        run: |
          cat > /tmp/yearlist.py <<'PY'
          import asyncio, json, sys
          sys.path.insert(0,'.')
          from scripts.sync_ratsarchive_from_ris import BASE_URL, _wait_for_public_page, _anchors, _click_previous_year
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=False,args=['--disable-dev-shm-usage'])
                  c=await b.new_context(locale='de-DE',viewport={'width':1440,'height':1100})
                  page=await c.new_page()
                  await page.goto(BASE_URL,wait_until='domcontentloaded',timeout=45000); await _wait_for_public_page(page)
                  await page.goto(BASE_URL+'termine',wait_until='domcontentloaded',timeout=45000); await page.wait_for_timeout(1200)
                  await page.get_by_text('Jahresliste',exact=True).first.click(timeout=7000); await page.wait_for_timeout(1200)
                  await _click_previous_year(page)  # 2025
                  await page.wait_for_timeout(800)
                  anchors=await _anchors(page)
                  interesting=[]
                  for a in anchors:
                      blob=' '.join(str(a.get(k) or '') for k in ('label','visible','title','aria','url'))
                      if 'Ahnsen' in blob or '16.09.2025' in blob or '/sdnetrim/' in blob:
                          interesting.append(a)
                  print('INTERESTING',json.dumps(interesting,ensure_ascii=False,indent=2))
                  # Dump outerHTML of every element whose text includes the session date/name.
                  loc=page.locator("text=Gemeinderat Ahnsen")
                  html=[]
                  for i in range(min(await loc.count(),20)):
                      try:
                          el=loc.nth(i)
                          html.append((await el.evaluate('(e)=>e.closest("li,article,tr,div")?.outerHTML || e.outerHTML'))[:25000])
                      except Exception: pass
                  print('HTML',json.dumps(html,ensure_ascii=False,indent=2))
                  await b.close()
          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/yearlist.py
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/tmp-diagnose-yearlist-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Temporäre Jahreslisten-Diagnose entfernen' || true
          git pull --rebase origin agent/ratsarchive-autosync || true
          git push origin HEAD:agent/ratsarchive-autosync
