name: Quiz CI

on:
  push:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-ci.yml'
  pull_request:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        working-directory: quiz-app
        run: npm ci

      - name: Syntax, Spiellogik und Fragenkataloge prüfen
        working-directory: quiz-app
        run: npm run test:all
