name: Homepage final polish smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: home-final-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./home-final-polish-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate final homepage polish
        run: |
          python -m py_compile home_dashboard_final_polish.py runtime_extensions.py
          python - <<'PY'
          import asyncio
          from datetime import timedelta
          from io import BytesIO
          from types import SimpleNamespace

          from PIL import Image
          import home_dashboard_final_polish as polish
          import pwa_core
          from pwa_core import startup

          parts = sorted(polish.HERO_PARTS_DIR.glob('ahnsen-hero-*.b64'))
          assert len(parts) == 6, len(parts)
          image_bytes = polish._hero_image_bytes()
          assert len(image_bytes) > 25000, len(image_bytes)
          with Image.open(BytesIO(image_bytes)) as hero:
              assert hero.format == 'WEBP', hero.format
              assert hero.width >= 700 and hero.height >= 390, hero.size
              hero.load()

          assert polish._waste_summary('Bioabfall, Leichtverpackungen, Sommerbiotonne') == 'Bioabfall, Leichtverpackungen, Sommerbiotonne'
          assert polish._waste_summary('Restabfall') == 'Restabfall'

          now = polish.center._local_now()
          today = now.date()
          assert polish._waste_day_label(today, today) == 'Heute'
          assert polish._waste_day_label(today + timedelta(days=1), today) == 'Morgen'

          polish.get_aktive_veranstaltungen = lambda: []
          polish.get_naechste_muelltermine = lambda limit=1: [SimpleNamespace(
              datum=today + timedelta(days=1),
              abfuhrarten='Bioabfall, Leichtverpackungen, Sommerbiotonne',
          )]

          original_current_user = pwa_core._current_user
          pwa_core._current_user = lambda request: SimpleNamespace(name='Dennis Koch')
          personal = polish._quick_overview(object())
          assert 'Schön, dass du da bist, Dennis.' in personal
          pwa_core._current_user = original_current_user
          assert 'Schön, dass du da bist.' in polish._quick_overview()

          startup()
          import pwa_main
          from runtime_extensions import install_runtime_extensions
          install_runtime_extensions()

          roots = [
              route for route in pwa_main.app.router.routes
              if getattr(route, 'path', '') == '/' and 'GET' in (getattr(route, 'methods', set()) or set())
          ]
          assert roots and roots[0].endpoint.__module__ == 'home_dashboard_final_polish', roots[0].endpoint.__module__ if roots else None
          hero_routes = [
              route for route in pwa_main.app.router.routes
              if getattr(route, 'path', '') == '/assets/ahnsen-hero.webp' and 'GET' in (getattr(route, 'methods', set()) or set())
          ]
          assert hero_routes and hero_routes[0].endpoint.__module__ == 'home_dashboard_final_polish'
          hero_response = asyncio.run(polish.ahnsen_hero_image())
          assert hero_response.media_type == 'image/webp'
          assert hero_response.body == image_bytes

          response = asyncio.run(polish.final_home_dashboard())
          html = response.body.decode('utf-8')
          assert '<span class="hero-kicker">' not in html
          assert 'Informationen, Termine, DGH, Müllabfuhr und Anliegen an einem Ort' not in html
          assert 'Digitale Bürgerplattform' in html
          assert 'min-height:205px!important' in html
          assert "url('/assets/ahnsen-hero.webp?v=3')" in html
          assert 'max-width:52%!important' in html
          assert 'inset:16px auto auto 18px!important' in html
          assert '>Morgen<' in html
          assert 'Bioabfall, Leichtverpackungen, Sommerbiotonne' in html
          assert '+ 2 weitere' not in html
          assert 'waste-card' in html
          assert 'home-dashboard-final-polish' in html
          print('Homepage final polish smoke tests passed')
          PY
