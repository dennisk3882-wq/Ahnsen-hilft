name: Temporary final Ahnsen 2026 RIS minutes query
on:
  push:
    branches: [agent/import-current-2026-ris-protokoll]
permissions:
  contents: write
jobs:
  query:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-current-2026-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Query public Ahnsen minutes in 2026
        run: |
          cat > /tmp/query_final.py <<'PY'
          import asyncio, hashlib, io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright
          from pypdf import PdfReader

          BASE='https://samtgemeinde-eilsen.ratsinfomanagement.net/'
          OUT=Path('static/ratsarchive-seed'); OUT.mkdir(parents=True,exist_ok=True)
          def pdf_text(data):
              try:
                  r=PdfReader(io.BytesIO(data)); return '\n'.join((p.extract_text() or '') for p in r.pages[:100])[:800000]
              except Exception:return ''
          async def main():
              report={'links':[],'pdfs':[],'pages':[]}
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=False,args=['--disable-dev-shm-usage'])
                  c=await b.new_context(locale='de-DE',viewport={'width':1440,'height':1000},accept_downloads=True)
                  page=await c.new_page()
                  await page.goto(BASE,wait_until='domcontentloaded',timeout=45000)
                  for _ in range(14):
                      await page.wait_for_timeout(2500)
                      if 'Browser-Überprüfung' not in await page.title(): break
                  if 'Browser-Überprüfung' in await page.title(): raise RuntimeError('WAF challenge did not complete')
                  await page.goto(urljoin(BASE,'recherche'),wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(1200)
                  await page.locator('#terms').fill('')
                  await page.locator('#keywords').fill('')
                  await page.locator('#idgremium').select_option('35')
                  await page.locator('#DPC_from').fill('2026-01-01')
                  await page.locator('#DPC_to').fill('2026-08-09')
                  try:
                      if await page.locator('#doktyp_all').is_checked(): await page.locator('#doktyp_all').uncheck()
                  except Exception: pass
                  # Make document filter exact: only Niederschriften N.
                  for ident in ('#doktyp_t','#doktyp_e','#doktyp_b'):
                      try:
                          if await page.locator(ident).is_checked(): await page.locator(ident).uncheck()
                      except Exception: pass
                  await page.locator('#doktyp_n').check()
                  try: await page.locator('#count').fill('100')
                  except Exception: pass
                  await page.locator('input[type="submit"][value="Anzeigen"]').click()
                  await page.wait_for_load_state('domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(3000)
                  report['result_url']=page.url
                  report['result_text']=(await page.locator('body').inner_text())[:250000]

                  # Collect every result link, keeping labels for later identification.
                  links=[]
                  for i in range(await page.locator('a[href]').count()):
                      a=page.locator('a[href]').nth(i)
                      try:
                          label=' '.join((await a.inner_text()).split())
                          href=urljoin(page.url,await a.get_attribute('href'))
                          if href.startswith(BASE) and label:
                              links.append({'label':label[:800],'url':href})
                      except Exception: pass
                  # Keep result-like links by protocol/date/document hints and unique URL.
                  seen=set(); resultlinks=[]
                  for x in links:
                      if x['url'] in seen: continue
                      if re.search(r'niederschrift|protokoll|2026|gemeinderat|sitzung',x['label'],re.I) or re.search(r'dokument|download|\.pdf|tops|sitzung|recherche/\d',x['url'],re.I):
                          seen.add(x['url']); resultlinks.append(x)
                  report['links']=resultlinks

                  pdf_candidates=[]
                  # Also visit all result-like pages and collect links/buttons there.
                  for x in resultlinks[:60]:
                      try:
                          rr=await c.request.get(x['url'],timeout=30000)
                          data=await rr.body(); ct=(rr.headers.get('content-type') or '').lower()
                          if data.startswith(b'%PDF-') or 'application/pdf' in ct:
                              pdf_candidates.append((x,data)); continue
                          p2=await c.new_page()
                          await p2.goto(x['url'],wait_until='domcontentloaded',timeout=30000)
                          await p2.wait_for_timeout(700)
                          ptext=(await p2.locator('body').inner_text())[:30000]
                          report['pages'].append({'url':p2.url,'title':await p2.title(),'label':x['label'],'text':ptext[:5000]})
                          for j in range(await p2.locator('a[href]').count()):
                              aa=p2.locator('a[href]').nth(j)
                              try:
                                  lab=' '.join((await aa.inner_text()).split())
                                  href=urljoin(p2.url,await aa.get_attribute('href'))
                                  if href.startswith(BASE) and (re.search(r'pdf|download|niederschrift|protokoll',lab,re.I) or re.search(r'dokument|download|\.pdf|sdnetrim',href,re.I)):
                                      rrr=await c.request.get(href,timeout=30000); dd=await rrr.body(); ctt=(rrr.headers.get('content-type') or '').lower()
                                      if dd.startswith(b'%PDF-') or 'application/pdf' in ctt:
                                          pdf_candidates.append(({'label':lab or x['label'],'url':href},dd))
                              except Exception: pass
                          await p2.close()
                      except Exception as e:
                          report.setdefault('errors',[]).append({'url':x['url'],'error':str(e)})

                  hashes=set()
                  for cand,data in pdf_candidates:
                      sha=hashlib.sha256(data).hexdigest()
                      if sha in hashes: continue
                      hashes.add(sha)
                      text=pdf_text(data)
                      # Must be official public Ahnsen council material and relate to 2026.
                      folded=text.casefold()
                      if 'ahnsen' not in folded: continue
                      dates=sorted(set(re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.2026\b',text)))
                      if not dates and '2026' not in text: continue
                      item={'label':cand['label'],'url':cand['url'],'bytes':len(data),'sha256':sha,'dates':dates,'text_preview':text[:12000]}
                      report['pdfs'].append(item)
                      (OUT/f'ris-2026-ahnsen-final-{len(report["pdfs"])}.pdf').write_bytes(data)
                  await b.close()
              Path('ris_ahnsen_2026_final.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps({'result_url':report.get('result_url'),'result_preview':report.get('result_text','')[:6000],'links':report['links'],'pdfs':report['pdfs'],'errors':report.get('errors')},ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/query_final.py
      - name: Show results
        run: |
          cat ris_ahnsen_2026_final.json
          ls -lh static/ratsarchive-seed/ris-2026-ahnsen-final-* || true
      - name: Remove temporary workflow and commit result
        if: always()
        run: |
          rm -f .github/workflows/tmp-query-ahnsen-2026-ris-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ahnsener Niederschriften 2026 aus offiziellem RIS geladen' || true
          git push origin HEAD:agent/import-current-2026-ris-protokoll
