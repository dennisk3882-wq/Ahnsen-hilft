name: Quiz Phase 4

on:
  pull_request:
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-phase4.yml'
  push:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-phase4.yml'

jobs:
  online-multiplayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-app
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Bestehende Prüfungen ausführen
        run: npm run test:all
      - name: Phase-4-Online-Mehrspieler prüfen
        run: node test/phase4-online.test.js
