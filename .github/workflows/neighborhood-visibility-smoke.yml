name: Neighborhood visibility smoke tests

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./neighborhood-visibility-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate final neighborhood actions
        run: |
          python -m py_compile neighborhood_enhanced_patch.py feature_routes.py
          python - <<'PY'
          from pwa_models import PWAUser
          import neighborhood_enhanced_patch as enhanced

          user = PWAUser(id=1, email='test@example.test', password_hash='x', name='Test Nutzer', aktiv=True)
          html = enhanced._home_html([], user, set(), set()).body.decode('utf-8')

          assert 'Hilfe suchen</a>' not in html
          assert 'Hilfe anbieten</a>' not in html
          assert '💬 Meine Nachrichten' not in html
          assert '📌 Meine Beiträge' in html
          assert '<summary>Eigenen Beitrag erstellen</summary>' in html
          assert '<summary>Push für neue Hilfe</summary>' in html
          print('Neighborhood visibility smoke tests passed')
          PY
