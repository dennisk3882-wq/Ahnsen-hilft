name: QuizTime Browser Tests

on:
  push:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-browser-tests.yml'
  pull_request:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - '.github/workflows/quiz-browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiztime-browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiztime
          POSTGRES_PASSWORD: quiztime
          POSTGRES_DB: quiztime_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiztime -d quiztime_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      PORT: '3000'
      APP_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://quiztime:quiztime@127.0.0.1:5432/quiztime_e2e
      PROFILE_SESSION_SECRET: browser-test-profile-secret
      PLATFORM_SECURITY_SECRET: browser-test-platform-secret
      PLATFORM_ADMIN_SECRET: browser-test-admin-secret
      PLATFORM_INTERNAL_SECRET: browser-test-internal-secret
      ADMIN_PASSWORD: e2e-admin-password
      EVENT_PASSWORD: e2e-event-password
      QUIZTIME_E2E_SECRET: quiztime-e2e-secret
      QUIZTIME_E2E_BROWSER_STATUS: success
      ELEVENLABS_API_KEY: ''
      BREVO_API_KEY: ''
      RESEND_API_KEY: ''
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            quiz-app/package-lock.json
            quiz-app/e2e-tools/package-lock.json

      - name: Anwendung installieren
        working-directory: quiz-app
        run: npm ci

      - name: Playwright reproduzierbar installieren
        working-directory: quiz-app/e2e-tools
        run: npm ci --ignore-scripts

      - name: Chromium installieren
        working-directory: quiz-app
        run: ./e2e-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Vollständige Browserabläufe prüfen
        working-directory: quiz-app
        run: npm run test:browser

      - name: PostgreSQL-Protokoll erfassen
        if: always()
        working-directory: quiz-app
        run: docker logs "${{ job.services.postgres.id }}" > postgres.log 2>&1

      - name: PostgreSQL-Protokoll strikt prüfen
        if: always()
        working-directory: quiz-app
        run: npm run test:postgres-log

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quiztime-browser-report-${{ github.run_number }}
          path: |
            quiz-app/playwright-report
            quiz-app/test-results
            quiz-app/postgres.log
          retention-days: 14
          if-no-files-found: ignore
