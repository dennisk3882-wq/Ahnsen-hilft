name: Temporary find latest Ahnsen 2026 meeting
on:
  push:
    branches: [agent/import-current-2026-ris-protokoll]
permissions:
  contents: write
jobs:
  find:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-current-2026-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Find latest Ahnsen meeting and minutes
        run: |
          cat > /tmp/find_latest.py <<'PY'
          import asyncio, json, re, hashlib, io
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright
          from pypdf import PdfReader

          BASE='https://samtgemeinde-eilsen.ratsinfomanagement.net/'
          OUT=Path('static/ratsarchive-seed'); OUT.mkdir(parents=True, exist_ok=True)

          def ptxt(data):
              try:
                  r=PdfReader(io.BytesIO(data))
                  return '\n'.join((p.extract_text() or '') for p in r.pages[:120])
              except Exception:
                  return ''

          async def wait_waf(page):
              for _ in range(18):
                  await page.wait_for_timeout(2000)
                  if 'Browser-Überprüfung' not in await page.title():
                      return
              raise RuntimeError('WAF challenge did not complete')

          async def anchors(page):
              out=[]
              for i in range(await page.locator('a[href]').count()):
                  a=page.locator('a[href]').nth(i)
                  try:
                      label=' '.join((await a.inner_text()).split())
                      href=urljoin(page.url, await a.get_attribute('href'))
                      if label and href.startswith(BASE):
                          out.append({'label':label,'url':href})
                  except Exception: pass
              return out

          async def main():
              report={'stages':[], 'ahnsen_links':[], 'pdfs':[], 'errors':[]}
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=False,args=['--disable-dev-shm-usage'])
                  c=await b.new_context(locale='de-DE',viewport={'width':1440,'height':1100},accept_downloads=True)
                  page=await c.new_page()
                  await page.goto(BASE,wait_until='domcontentloaded',timeout=45000); await wait_waf(page)
                  await page.goto(urljoin(BASE,'termine'),wait_until='domcontentloaded',timeout=45000); await page.wait_for_timeout(1800)
                  report['stages'].append({'name':'initial','url':page.url,'text':(await page.locator('body').inner_text())[:12000],'anchors':await anchors(page)})

                  # Switch to annual list if possible.
                  try:
                      await page.get_by_text('Jahresliste', exact=True).first.click(timeout=7000)
                      await page.wait_for_timeout(1800)
                  except Exception as e:
                      report['errors'].append('Jahresliste click: '+str(e))
                  report['stages'].append({'name':'yearlist','url':page.url,'text':(await page.locator('body').inner_text())[:30000],'anchors':await anchors(page)})

                  # Select/click 2026 if the list did not already show it.
                  try:
                      loc=page.get_by_text('2026', exact=True)
                      if await loc.count():
                          await loc.last.click(timeout=7000)
                          await page.wait_for_timeout(1800)
                  except Exception as e:
                      report['errors'].append('2026 click: '+str(e))
                  body=(await page.locator('body').inner_text())
                  all_a=await anchors(page)
                  report['stages'].append({'name':'year2026','url':page.url,'text':body[:60000],'anchors':all_a})

                  ah=[]; seen=set()
                  for x in all_a:
                      if ('ahnsen' in x['label'].casefold() or 'ahnsen' in x['url'].casefold()) and x['url'] not in seen:
                          seen.add(x['url']); ah.append(x)
                  report['ahnsen_links']=ah

                  candidates=[]
                  for x in ah[:40]:
                      try:
                          p2=await c.new_page(); await p2.goto(x['url'],wait_until='domcontentloaded',timeout=30000); await p2.wait_for_timeout(1000)
                          text=(await p2.locator('body').inner_text())
                          sub=await anchors(p2)
                          report.setdefault('ahnsen_pages',[]).append({'label':x['label'],'url':p2.url,'text':text[:12000],'anchors':sub})
                          for y in sub:
                              if re.search(r'niederschrift|protokoll|download|pdf', y['label'], re.I) or re.search(r'dokument|download|\.pdf', y['url'], re.I):
                                  try:
                                      r=await c.request.get(y['url'],timeout=30000); data=await r.body(); ct=(r.headers.get('content-type') or '').lower()
                                      if data.startswith(b'%PDF-') or 'application/pdf' in ct:
                                          candidates.append((y,data,text))
                                  except Exception: pass
                          await p2.close()
                      except Exception as e:
                          report['errors'].append(x['url']+': '+str(e))

                  uniq=set()
                  for y,data,parent_text in candidates:
                      sha=hashlib.sha256(data).hexdigest()
                      if sha in uniq: continue
                      uniq.add(sha)
                      text=ptxt(data)
                      if 'ahnsen' not in (text+' '+parent_text).casefold(): continue
                      dates=re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.2026\b', text+' '+parent_text)
                      item={'label':y['label'],'url':y['url'],'bytes':len(data),'sha256':sha,'dates':dates,'text_preview':text[:10000]}
                      report['pdfs'].append(item)
                      (OUT/f'ris-2026-ahnsen-meeting-{len(report["pdfs"])}.pdf').write_bytes(data)
                  await b.close()
              Path('ris_latest_ahnsen_2026.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps({'ahnsen_links':report['ahnsen_links'],'pdfs':report['pdfs'],'errors':report['errors']},ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/find_latest.py
      - name: Show result
        run: |
          cat ris_latest_ahnsen_2026.json
          ls -lh static/ratsarchive-seed/ris-2026-ahnsen-meeting-* || true
      - name: Remove temporary workflow and commit result
        if: always()
        run: |
          rm -f .github/workflows/tmp-find-latest-ahnsen-2026-meeting.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aktuellste Ahnsener Sitzung 2026 im offiziellen RIS auswerten' || true
          git push origin HEAD:agent/import-current-2026-ris-protokoll
