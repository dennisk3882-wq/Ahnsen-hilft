name: Apply Bürgermeister Balance Fix

on:
  push:
    branches: [main]
    paths:
      - 'BuergermeisterPWA/tools/apply-balance-fix.mjs'
      - '.github/workflows/buergermeister-apply-balance-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic balance patch
        working-directory: BuergermeisterPWA
        run: node tools/apply-balance-fix.mjs
      - name: Verify JavaScript syntax
        working-directory: BuergermeisterPWA
        run: node --check app.js && node --check sw.js
      - name: Commit corrected game logic
        shell: bash
        run: |
          if git diff --quiet -- BuergermeisterPWA/app.js BuergermeisterPWA/sw.js; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/app.js BuergermeisterPWA/sw.js
          git commit -m 'Rebalance Bürgermeister food economy and forecast'
          git push origin main
