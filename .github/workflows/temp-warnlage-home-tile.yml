name: Temporary warnlage home tile

on:
  push:
    branches:
      - agent/warnlage-home-tile

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warnlage-home-tile
      - name: Move Warnlage to home tile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pwa_ui.py')
          text = path.read_text(encoding='utf-8')

          old_home = '("shield", "Warnungen", "Amtliche Warnlage für Ahnsen.", "/warnungen"),'
          new_home = '("shield", "Warnlage", "Amtliche Wetter- und Gefahrenwarnungen für Ahnsen.", "/warnungen"),'
          if old_home not in text:
              raise SystemExit('Startseiten-Kachel Warnungen nicht gefunden')
          text = text.replace(old_home, new_home, 1)

          old_more = '("Warnlage", "/warnungen", "bell", "Amtliche Wetter- und Gefahrenwarnungen"), '
          if old_more not in text:
              raise SystemExit('Warnlage-Eintrag im Mehr-Menü nicht gefunden')
          text = text.replace(old_more, '', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile pwa_ui.py
      - name: Commit changes
        run: |
          rm .github/workflows/temp-warnlage-home-tile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py .github/workflows/temp-warnlage-home-tile.yml
          git commit -m "Warnlage auf die Startseite verschieben"
          git push origin HEAD:agent/warnlage-home-tile
