name: PWA exact photo icon smoke tests

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./pwa-stone-icon-smoke.db
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate exact Ahnsen launcher photo
        run: |
          python - <<'PY'
          import asyncio
          import io
          import json
          from pathlib import Path
          from PIL import Image
          import pwa_icon_photo_patch as icons
          from runtime_extensions import install_runtime_extensions
          from pwa_core import app

          source = icons._source_bytes()
          with Image.open(io.BytesIO(source)) as image:
              assert image.format == 'WEBP'
              assert image.width > 0 and image.height > 0
              image.verify()

          icons._ensure_icons()
          for size in (180, 192, 512):
              path = Path(f'static/ahnsen-app-v7-{size}.png')
              with Image.open(path) as image:
                  assert image.format == 'PNG'
                  assert image.size == (size, size)

          payload = json.loads(asyncio.run(icons.photo_manifest()).body)
          sources = {entry['src'] for entry in payload['icons']}
          assert '/pwa/ahnsen-app-v7-192.png' in sources
          assert '/pwa/ahnsen-app-v7-512.png' in sources

          install_runtime_extensions()
          routes = [r for r in app.router.routes if getattr(r, 'path', '') == '/manifest.webmanifest']
          assert routes and routes[0].endpoint is icons.photo_manifest
          print('PWA exact photo icon smoke tests passed')
          PY
