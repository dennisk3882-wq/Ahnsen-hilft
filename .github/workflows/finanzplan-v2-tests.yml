name: Finanzplan v3 tests

on:
  push:
    branches: [finanzplan, finanzplan-v2-audit, finanzplan-v2-2-hardening, finanzplan-v3-hardening, finanzplan-v3-1-premium]
    paths:
      - 'finanzplan/**'
      - 'finanzplan-backend/**'
      - '.github/workflows/finanzplan-v2-tests.yml'
  pull_request:
    paths:
      - 'finanzplan/**'
      - 'finanzplan-backend/**'

jobs:
  finance-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every Finanzplan JavaScript module
        run: |
          set -e
          find finanzplan finanzplan-backend -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Run finance regression tests
        run: node --test finanzplan/tests/finance-lib.test.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static Finanzplan server
        run: |
          python3 -m http.server 8080 --directory finanzplan > /tmp/finanzplan-http.log 2>&1 &
          echo $! > /tmp/finanzplan-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/finanzplan-http.log
          exit 1
      - name: Run baseline browser finance flow
        run: node finanzplan/tests/smoke.mjs
      - name: Run hardening browser finance flow
        run: node finanzplan/tests/hardening-smoke.mjs
      - name: Run extra V3 edge flow
        run: node finanzplan/tests/hardening-extra.mjs
      - name: Run Chromium desktop and WebKit mobile flow
        run: node finanzplan/tests/v3-cross-browser.mjs
      - name: Run V3 IndexedDB backup and scale flow
        run: node finanzplan/tests/v3-storage-backup.mjs
      - name: Run V2 migration and installed-PWA flow
        run: node finanzplan/tests/v3-migration-install.mjs
      - name: Run accessibility and offline flow
        run: node finanzplan/tests/v3-quality.mjs
      - name: Run V3.1 premium/offline flow
        run: node finanzplan/tests/v31-premium.mjs

  live-render-smoke:
    if: github.ref == 'refs/heads/finanzplan'
    needs: [finance-engine, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_URL: https://finanzplan-pwa.onrender.com
    steps:
      - name: Wait for Render current V3 deployment
        run: |
          set -e
          for i in {1..36}; do
            if curl -fsS "$LIVE_URL/sw.js?check=$RANDOM" | grep -Eq "finanzplan-v3\.(1\.0|0\.0)"; then exit 0; fi
            sleep 10
          done
          echo "Render did not expose current Finanzplan V3 in time"
          exit 1
      - name: Verify live security headers
        run: |
          set -e
          headers="$(curl -fsSI "$LIVE_URL/")"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options:.*nosniff'
          echo "$headers" | grep -qi '^referrer-policy:.*no-referrer'
          echo "$headers" | grep -qi '^strict-transport-security:'
