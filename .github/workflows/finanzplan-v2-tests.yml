name: Finanzplan v2 tests

on:
  push:
    branches: [finanzplan, finanzplan-v2-audit]
    paths:
      - 'finanzplan/**'
      - '.github/workflows/finanzplan-v2-tests.yml'
  pull_request:
    paths:
      - 'finanzplan/**'

jobs:
  finance-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every Finanzplan JavaScript module
        run: |
          set -e
          find finanzplan -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check finanzplan/tests/finance-lib.test.js
      - name: Run finance regression tests
        run: node --test finanzplan/tests/finance-lib.test.js
