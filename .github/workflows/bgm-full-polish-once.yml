name: Bürgermeister Full Polish Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-full-polish-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild patch script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/bgm_patch.part1 .github/scripts/bgm_patch.part2 .github/scripts/bgm_patch.part3 .github/scripts/bgm_patch.part4 > /tmp/bgm_patch.b64
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          raw=base64.b64decode(Path('/tmp/bgm_patch.b64').read_text().strip())
          Path('/tmp/bgm_full_polish.py').write_bytes(zlib.decompress(raw))
          PY
          python3 -m py_compile /tmp/bgm_full_polish.py
      - name: Apply complete Bürgermeister upgrade
        run: python3 /tmp/bgm_full_polish.py
      - name: Syntax verification
        run: |
          node --check BuergermeisterPWA/game-engine.js
          node --check BuergermeisterPWA/app.js
          node --check BuergermeisterPWA/tests/e2e.mjs
      - name: Engine and balance verification
        working-directory: BuergermeisterPWA
        run: |
          node tests/reachability-diagnostic.mjs
          node tests/planner-search.mjs
          node tests/autotest.mjs
      - name: Browser end-to-end verification
        working-directory: BuergermeisterPWA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          node tests/e2e.mjs
      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/bgm_patch.part1 .github/scripts/bgm_patch.part2 .github/scripts/bgm_patch.part3 .github/scripts/bgm_patch.part4
          rm -f .github/workflows/bgm-full-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Bürgermeister gameplay and quality overhaul'
          git push origin HEAD:main
