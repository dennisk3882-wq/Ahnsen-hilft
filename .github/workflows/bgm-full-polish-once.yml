name: Bürgermeister Full Polish Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-full-polish-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild patch script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/bgm_patch.part1 .github/scripts/bgm_patch.part2 .github/scripts/bgm_patch.part3 .github/scripts/bgm_patch.part4 > /tmp/bgm_patch.b64
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          raw=base64.b64decode(Path('/tmp/bgm_patch.b64').read_text().strip())
          p=Path('/tmp/bgm_full_polish.py')
          p.write_bytes(zlib.decompress(raw))
          s=p.read_text()
          s=s.replace('pattern=r"function load\\(seed\\)\\{[\\s\\S]*?return c\\.__T;\\}"', 'pattern=r"function load\\(seed\\)\\s*\\{[\\s\\S]*?\\n\\}"')
          s=s.replace('pattern=r"function engine\\(seed\\)\\{[\\s\\S]*?return c\\.__TEST__;\\n\\}"', 'pattern=r"function engine\\(seed\\)\\s*\\{[\\s\\S]*?\\n\\}"')
          old="""engine_block = engine_block.replace('saveGame(this); renderGame(this, true);', "globalThis.BGM_HOOKS?.save?.(this); globalThis.BGM_HOOKS?.render?.(this, true);")
          engine_block = engine_block.replace('saveGame(this); renderGame(this);', "globalThis.BGM_HOOKS?.save?.(this); globalThis.BGM_HOOKS?.render?.(this);")
          engine_block = engine_block.replace('addScore(this);', "globalThis.BGM_HOOKS?.score?.(this);")"""
          new="""engine_block = re.sub(r'saveGame\\(this\\);', "globalThis.BGM_HOOKS?.save?.(this);", engine_block)
          engine_block = re.sub(r'renderGame\\(this,\\s*true\\);', "globalThis.BGM_HOOKS?.render?.(this, true);", engine_block)
          engine_block = re.sub(r'renderGame\\(this\\);', "globalThis.BGM_HOOKS?.render?.(this);", engine_block)
          engine_block = re.sub(r'addScore\\(this\\);', "globalThis.BGM_HOOKS?.score?.(this);", engine_block)"""
          if old not in s: raise SystemExit('engine hook migration block missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 -m py_compile /tmp/bgm_full_polish.py
      - name: Apply complete Bürgermeister upgrade
        run: python3 /tmp/bgm_full_polish.py
      - name: Syntax verification
        run: |
          node --check BuergermeisterPWA/game-engine.js
          node --check BuergermeisterPWA/app.js
          node --check BuergermeisterPWA/tests/e2e.mjs
      - name: Engine and balance verification
        working-directory: BuergermeisterPWA
        run: |
          node tests/reachability-diagnostic.mjs
          node tests/planner-search.mjs
          node tests/autotest.mjs
      - name: Browser end-to-end verification
        working-directory: BuergermeisterPWA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          node tests/e2e.mjs
      - name: Commit verified game release
        shell: bash
        run: |
          set -euo pipefail
          # Workflow-Dateien werden separat über die GitHub-Verbindung gepflegt.
          # So verhindert GitHubs Workflow-Schutz keinen bereits vollständig geprüften Spiel-Commit.
          git restore --source=HEAD -- .github/workflows
          rm -f .github/scripts/bgm_patch.part1 .github/scripts/bgm_patch.part2 .github/scripts/bgm_patch.part3 .github/scripts/bgm_patch.part4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA .github/scripts
          git commit -m 'Complete Bürgermeister gameplay and quality overhaul'
          git push origin HEAD:main
