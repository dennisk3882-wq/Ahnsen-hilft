name: Temporary i18n white-label finalizer

on:
  push:
    branches:
      - agent/i18n-white-label-complete

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-white-label-complete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Finish tenant and translation integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Extra white-label PWA identity fields.
          replace_once(
              'gemeinde_crud.py',
              '    "plattform_basis_url": "https://ahnsen-hilft.onrender.com",\n    "ticket_prefix": "AHN",\n',
              '    "plattform_basis_url": "https://ahnsen-hilft.onrender.com",\n    "plattform_slug": "ahnsen-hilft",\n    "pwa_icon_192_url": "/pwa/ahnsen-app-v5-192.png",\n    "pwa_icon_512_url": "/pwa/ahnsen-app-v5-512.png",\n    "apple_touch_icon_url": "/pwa/ahnsen-app-v5-180.png",\n    "ticket_prefix": "AHN",\n',
              'pwa white-label defaults',
          )

          p = Path('platform_runtime.py')
          text = p.read_text(encoding='utf-8')
          if 'def _slug(' not in text:
              text = text.replace(
                  'def _safe_url(value: str, default: str = "") -> str:\n',
                  '''def _slug(value: str, default: str = "plattform") -> str:\n    raw = str(value or "").strip().casefold()\n    raw = raw.replace("ä", "ae").replace("ö", "oe").replace("ü", "ue").replace("ß", "ss")\n    raw = re.sub(r"[^a-z0-9]+", "-", raw).strip("-")\n    return raw[:80] or default\n\n\ndef _safe_url(value: str, default: str = "") -> str:\n''',
                  1,
              )
          text = text.replace(
              '        "public_base_url": _safe_url(settings.get("plattform_basis_url") or os.getenv("PUBLIC_BASE_URL", "")),\n        "logo_url": _safe_url(settings.get("logo_bild_url") or ""),\n',
              '        "public_base_url": _safe_url(settings.get("plattform_basis_url") or os.getenv("PUBLIC_BASE_URL", "")),\n        "platform_slug": _slug(settings.get("plattform_slug") or platform_name, "plattform"),\n        "logo_url": _safe_url(settings.get("logo_bild_url") or ""),\n        "pwa_icon_192_url": _safe_url(settings.get("pwa_icon_192_url") or "/pwa/ahnsen-app-v5-192.png", "/pwa/ahnsen-app-v5-192.png"),\n        "pwa_icon_512_url": _safe_url(settings.get("pwa_icon_512_url") or "/pwa/ahnsen-app-v5-512.png", "/pwa/ahnsen-app-v5-512.png"),\n        "apple_touch_icon_url": _safe_url(settings.get("apple_touch_icon_url") or "/pwa/ahnsen-app-v5-180.png", "/pwa/ahnsen-app-v5-180.png"),\n',
              1,
          )
          # Do not rewrite arbitrary citizen-entered prose. Only replace known static UI phrases.
          text = text.replace(
              '''        (" in Ahnsen", f" in {municipality}"),\n        (" für Ahnsen", f" für {municipality}"),\n        (" aus Ahnsen", f" aus {municipality}"),\n        (" von Ahnsen", f" von {municipality}"),\n        ("AHN-", str(cfg["ticket_prefix"]) + "-"),\n''',
              '''        ("Was ist los in Ahnsen?", f"Was ist los in {municipality}?"),\n        ("Termine, Aktionen und Feste in Ahnsen.", f"Termine, Aktionen und Feste in {municipality}."),\n        ("Die nächsten Abholtermine für Ahnsen.", f"Die nächsten Abholtermine für {municipality}."),\n        ("Kommende Termine in Ahnsen", f"Kommende Termine in {municipality}"),\n        ("Vereine in Ahnsen", f"Vereine in {municipality}"),\n        ("Ahnsen im Überblick", f"{municipality} im Überblick"),\n        ("Warnzentrale Ahnsen", f"Warnzentrale {municipality}"),\n        ("Verfügbarkeit DGH Ahnsen", f"Verfügbarkeit DGH {municipality}"),\n        ("für Ahnsen und den Landkreis Schaumburg", f"für {cfg['warning_area_label']}"),\n        ("AHN-", str(cfg["ticket_prefix"]) + "-"),\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # White-label settings form includes PWA icon set and slug.
          p = Path('community_dashboard.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '<div class="admin-grid"><label>Plattformname<input name="platform_name" value="{escape(c[\'platform_name\'])}" required></label><label>Kurzname der PWA<input name="short_name" value="{escape(c[\'short_name\'])}" maxlength="30"></label><label>Gemeinde / Ort<input name="municipality_name" value="{escape(c[\'municipality_name\'])}" required></label><label>Postleitzahl<input name="postal_code" value="{escape(c[\'postal_code\'])}"></label></div>',
              '<div class="admin-grid"><label>Plattformname<input name="platform_name" value="{escape(c[\'platform_name\'])}" required></label><label>Kurzname der PWA<input name="short_name" value="{escape(c[\'short_name\'])}" maxlength="30"></label><label>Gemeinde / Ort<input name="municipality_name" value="{escape(c[\'municipality_name\'])}" required></label><label>Postleitzahl<input name="postal_code" value="{escape(c[\'postal_code\'])}"></label><label>Technischer Plattform-Slug<input name="platform_slug" value="{escape(c[\'platform_slug\'])}" placeholder="meine-gemeinde"></label></div>',
              1,
          )
          text = text.replace(
              '<div class="admin-grid"><label>Primärfarbe<input name="primary_color" value="{escape(c[\'primary_color\'])}" placeholder="#174936"></label><label>Akzentfarbe<input name="accent_color" value="{escape(c[\'accent_color\'])}" placeholder="#8da77a"></label><label>Logo-URL<input name="logo_url" value="{escape(c[\'logo_url\'])}" placeholder="/assets/logo.png oder https://…"></label><label>Hero-Bild-URL<input name="hero_image_url" value="{escape(c[\'hero_image_url\'])}"></label></div>',
              '<div class="admin-grid"><label>Primärfarbe<input name="primary_color" value="{escape(c[\'primary_color\'])}" placeholder="#174936"></label><label>Akzentfarbe<input name="accent_color" value="{escape(c[\'accent_color\'])}" placeholder="#8da77a"></label><label>Logo-URL<input name="logo_url" value="{escape(c[\'logo_url\'])}" placeholder="/assets/logo.png oder https://…"></label><label>Hero-Bild-URL<input name="hero_image_url" value="{escape(c[\'hero_image_url\'])}"></label></div><div class="admin-grid"><label>PWA-Icon 192×192<input name="pwa_icon_192_url" value="{escape(c[\'pwa_icon_192_url\'])}"></label><label>PWA-Icon 512×512<input name="pwa_icon_512_url" value="{escape(c[\'pwa_icon_512_url\'])}"></label><label>Apple-Touch-Icon<input name="apple_touch_icon_url" value="{escape(c[\'apple_touch_icon_url\'])}"></label></div>',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Persist all extra platform fields and synchronize legacy content settings used by old admin pages.
          p = Path('community_routes.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        "plattform_basis_url": _clean(form.get("public_base_url"), 500),\n        "ticket_prefix": _clean(form.get("ticket_prefix"), 8),\n',
              '        "plattform_basis_url": _clean(form.get("public_base_url"), 500),\n        "plattform_slug": _clean(form.get("platform_slug"), 80),\n        "pwa_icon_192_url": _clean(form.get("pwa_icon_192_url"), 1000),\n        "pwa_icon_512_url": _clean(form.get("pwa_icon_512_url"), 1000),\n        "apple_touch_icon_url": _clean(form.get("apple_touch_icon_url"), 1000),\n        "ticket_prefix": _clean(form.get("ticket_prefix"), 8),\n',
              1,
          )
          text = text.replace(
              '''    for key, value in extras.items():\n        set_gemeinde_einstellung(key, value)\n    audit_event("Verwaltung", "Plattform-Konfiguration geändert", "municipality_config", str(config.id), config.platform_name)\n''',
              '''    extras.update({\n        "seiten_titel": config.platform_name,\n        "logo_text": config.platform_name,\n        "hauptfarbe": config.primary_color,\n        "akzentfarbe": config.accent_color,\n    })\n    for key, value in extras.items():\n        set_gemeinde_einstellung(key, value)\n    audit_event("Verwaltung", "Plattform-Konfiguration geändert", "municipality_config", str(config.id), config.platform_name)\n''',
              1,
          )
          text = text.replace('    response.set_cookie("ahnsen_language", language, max_age=365 * 24 * 3600, samesite="lax", secure=request.url.scheme == "https")\n', '    response.set_cookie("platform_language", language, max_age=365 * 24 * 3600, samesite="lax", secure=request.url.scheme == "https")\n    response.delete_cookie("ahnsen_language")\n', 1)
          text = text.replace('            "Jemand möchte Kontakt zu deinem Beitrag aufnehmen. Öffne dein Ahnsen-Postfach.",\n', '            f"Jemand möchte Kontakt zu deinem Beitrag aufnehmen. Öffne dein {get_platform_snapshot()[\'municipality_name\']}-Postfach.",\n', 1)
          text = text.replace('            "Neue Nachricht in Ahnsen hilft",\n', '            f"Neue Nachricht in {get_platform_snapshot()[\'platform_name\']}",\n', 1)
          text = text.replace('        if not (51.5 <= lat <= 53.0 and 8.0 <= lon <= 10.5):\n            continue\n', '        if not (-90 <= lat <= 90 and -180 <= lon <= 180):\n            continue\n', 1)
          p.write_text(text, encoding='utf-8')

          # Browser language migration to the generic cookie name.
          p = Path('static/community.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("document.cookie.match(/(?:^|; )ahnsen_language=([^;]+)/)?.[1] ||", "document.cookie.match(/(?:^|; )platform_language=([^;]+)/)?.[1] ||\n              document.cookie.match(/(?:^|; )ahnsen_language=([^;]+)/)?.[1] ||", 1)
          p.write_text(text, encoding='utf-8')

          # Dynamic fallback push title.
          p = Path('push_service.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              text = text.replace('from pwa_crud import ', 'from platform_runtime import get_platform_snapshot\nfrom pwa_crud import ', 1)
          text = text.replace('            "title": str(title or "Ahnsen hilft")[:120],\n', '            "title": str(title or get_platform_snapshot()["platform_name"])[:120],\n', 1)
          p.write_text(text, encoding='utf-8')

          # Smart digest titles are tenant aware.
          p = Path('smart_push.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              text = text.replace('from ', 'from platform_runtime import get_platform_snapshot\nfrom ', 1)
          text = text.replace('        body = f"{period}zusammenfassung für Ahnsen: " + " ".join(lines)\n', '        cfg = get_platform_snapshot()\n        body = f"{period}zusammenfassung für {cfg[\'municipality_name\']}: " + " ".join(lines)\n', 1)
          text = text.replace('            "Deine Ahnsen-Zusammenfassung",\n', '            f"Deine {cfg[\'municipality_name\']}-Zusammenfassung",\n', 1)
          p.write_text(text, encoding='utf-8')

          # Waste reminder uses tenant municipality.
          p = Path('pwa_push_job.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              insert_at = text.find('\n\n')
              text = text[:insert_at] + '\nfrom platform_runtime import get_platform_snapshot' + text[insert_at:]
          text = text.replace('                f"Morgen wird in Ahnsen abgeholt: {kinds}.",\n', '                f"Morgen wird in {get_platform_snapshot()[\'municipality_name\']} abgeholt: {kinds}.",\n', 1)
          p.write_text(text, encoding='utf-8')

          # Email subjects and bodies follow platform identity.
          p = Path('email_service.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              insert_at = text.find('\n\n')
              text = text[:insert_at] + '\nfrom platform_runtime import get_platform_snapshot' + text[insert_at:]
          text = text.replace('        f"""Neue Mängelmeldung über Ahnsen hilft\n', '        f"""Neue Mängelmeldung über {get_platform_snapshot()[\'platform_name\']}\n', 1)
          text = text.replace('        f"""Neue DGH-Mietanfrage über Ahnsen hilft\n', '        f"""Neue DGH-Mietanfrage über {get_platform_snapshot()[\'platform_name\']}\n', 1)
          text = text.replace('    msg["Subject"] = "Ahnsen hilft – Systemtest E-Mail"\n', '    msg["Subject"] = f"{get_platform_snapshot()[\'platform_name\']} – Systemtest E-Mail"\n', 1)
          text = text.replace('        f"""Ahnsen hilft Systemtest\n', '        f"""{get_platform_snapshot()[\'platform_name\']} Systemtest\n', 1)
          p.write_text(text, encoding='utf-8')

          # Müll PDF parser becomes municipality-configurable.
          p = Path('muelltermine_parser.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              insert_at = text.find('\n\n')
              text = text[:insert_at] + '\nfrom platform_runtime import get_platform_snapshot' + text[insert_at:]
          text = text.replace('    return "Ahnsen"\n', '    return get_platform_snapshot()["municipality_name"]\n', 1)
          text = text.replace('            "In der PDF wurde kein Abfuhrkalender für Ahnsen erkannt."\n', '            f"In der PDF wurde kein Abfuhrkalender für {get_platform_snapshot()[\'municipality_name\']} erkannt."\n', 1)
          text = text.replace('            "Bitte prüfe, ob es der AWS-Jahreskalender für Ahnsen ist."\n', '            f"Bitte prüfe, ob es der Jahreskalender für {get_platform_snapshot()[\'municipality_name\']} ist."\n', 1)
          p.write_text(text, encoding='utf-8')

          # Warning UI/dashboard default labels use tenant warning area.
          p = Path('warning_ui.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              text = text.replace('from pwa_ui import ', 'from platform_runtime import get_platform_snapshot\nfrom pwa_ui import ', 1)
          text = text.replace('warning.area or "Ahnsen"', 'warning.area or get_platform_snapshot()["warning_area_label"]')
          text = text.replace('<h1>Warnungen für Ahnsen</h1><p>Wetter- und Gefahrenmeldungen aus amtlichen Quellen – kompakt für Ahnsen und den Landkreis Schaumburg.</p>', '<h1>Warnungen für {escape(get_platform_snapshot()["municipality_name"])}</h1><p>Wetter- und Gefahrenmeldungen aus amtlichen Quellen – kompakt für {escape(get_platform_snapshot()["warning_area_label"])}.</p>', 1)
          text = text.replace('description="Amtliche Warnungen und Unwetterinformationen für Ahnsen"', 'description=f"Amtliche Warnungen und Unwetterinformationen für {get_platform_snapshot()[\'municipality_name\']}"', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('warning_dashboard.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              insert_at = text.find('\n\n')
              text = text[:insert_at] + '\nfrom platform_runtime import get_platform_snapshot' + text[insert_at:]
          text = text.replace('warning.area or "Ahnsen"', 'warning.area or get_platform_snapshot()["warning_area_label"]')
          text = text.replace('<h1>Warnzentrale Ahnsen</h1>', '<h1>Warnzentrale {escape(get_platform_snapshot()["municipality_name"])}</h1>', 1)
          text = text.replace('<title>Warnlage · Ahnsen hilft</title>', '<title>Warnlage · {escape(get_platform_snapshot()["platform_name"])}</title>', 1)
          p.write_text(text, encoding='utf-8')

          # Public PWA legal notice discloses machine translation behavior.
          p = Path('pwa_ui.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('placeholder="AHN-20260806-ABC123"', 'placeholder="{escape(get_platform_snapshot()[\'ticket_prefix\'])}-20260806-ABC123"', 1)
          text = text.replace('("village", "Über Ahnsen", "Unser Dorf im Überblick.", "/ueber-ahnsen"),', '("village", "Über Ahnsen", "Unser Dorf im Überblick.", "/ueber-gemeinde"),', 1)
          old_legal = '''def legal_page(kind: str, settings: dict) -> HTMLResponse:\n    title = "Datenschutz" if kind == "datenschutz" else "Impressum"; key = "datenschutz_seite_text" if kind == "datenschutz" else "impressum_seite_text"; text = settings.get(key, f"{title} wird ergänzt.")\n    paragraphs = "".join(f'<p>{escape(x.strip())}</p>' for x in str(text or "").splitlines() if x.strip())\n    return page(title, f'<section class="page-heading compact"><a class="back-link" href="/mehr">← Mehr</a><span class="eyebrow">Rechtliches</span><h1>{title}</h1></section><article class="legal-card">{paragraphs}</article>', active="more")\n'''
          new_legal = '''def legal_page(kind: str, settings: dict) -> HTMLResponse:\n    title = "Datenschutz" if kind == "datenschutz" else "Impressum"\n    key = "datenschutz_seite_text" if kind == "datenschutz" else "impressum_seite_text"\n    text = settings.get(key, f"{title} wird ergänzt.")\n    paragraphs = "".join(f'<p>{escape(x.strip())}</p>' for x in str(text or "").splitlines() if x.strip())\n    translation_note = ""\n    if kind == "datenschutz" and get_platform_snapshot().get("translation_enabled"):\n        translation_note = '<section class="legal-translation-note"><h2>Maschinelle Übersetzung</h2><p>Wenn eine Fremdsprache ausgewählt wird, werden sichtbare Seitentexte zur maschinellen Übersetzung an den in der Plattform-Konfiguration hinterlegten LibreTranslate-kompatiblen Übersetzungsdienst übertragen. Inhalte in Formular-Eingabefeldern werden nicht automatisch übertragen. Übersetzungen können Fehler enthalten; bei amtlichen Informationen ist die deutsche Originalfassung maßgeblich.</p></section>'\n    return page(title, f'<section class="page-heading compact"><a class="back-link" href="/mehr">← Mehr</a><span class="eyebrow">Rechtliches</span><h1>{title}</h1></section><article class="legal-card">{paragraphs}{translation_note}</article>', active="more")\n'''
          if old_legal in text:
              text = text.replace(old_legal, new_legal, 1)
          elif 'legal-translation-note' not in text:
              raise SystemExit('legal page anchor missing')
          p.write_text(text, encoding='utf-8')

          # pwa_core internal app metadata becomes runtime-tenant aware after startup.
          p = Path('pwa_core.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    init_translation_db()\n    start_warning_monitor()\n',
              '    init_translation_db()\n    cfg = get_platform_snapshot()\n    app.title = f"{cfg[\'platform_name\']} PWA"\n    app.description = cfg["description"]\n    start_warning_monitor()\n',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # pwa_main overrides the manifest and browser JS in production; make those overrides tenant aware too.
          p = Path('pwa_main.py')
          text = p.read_text(encoding='utf-8')
          if 'from platform_runtime import get_platform_snapshot' not in text:
              text = text.replace('from pwa_core import STATIC_DIR, app\n', 'from pwa_core import STATIC_DIR, app\nfrom platform_runtime import get_platform_snapshot\n', 1)
          text = text.replace(
              '    "Ahnsen-hilft/1.0 (+https://ahnsen-hilft.onrender.com)",\n',
              '    f"{get_platform_snapshot()[\'platform_slug\']}/1.0 (+{get_platform_snapshot().get(\'public_base_url\') or \'municipal-pwa\'})",\n',
              1,
          )
          manifest_pattern = r'async def manifest_v5\(\):\n.*?\n\n\nasync def versioned_icon'
          manifest = '''async def manifest_v5():\n    cfg = get_platform_snapshot()\n    icon_192 = cfg.get("pwa_icon_192_url") or f"/pwa/ahnsen-app-{ICON_VERSION}-192.png"\n    icon_512 = cfg.get("pwa_icon_512_url") or f"/pwa/ahnsen-app-{ICON_VERSION}-512.png"\n    return JSONResponse(\n        {\n            "id": f"/?app-id={cfg['platform_slug']}",\n            "name": cfg["platform_name"],\n            "short_name": cfg["short_name"],\n            "description": cfg["description"],\n            "lang": cfg["default_language"],\n            "start_url": "/?installed=1",\n            "scope": "/",\n            "display": "standalone",\n            "orientation": "portrait-primary",\n            "background_color": "#fbf8f0",\n            "theme_color": cfg["primary_color"],\n            "prefer_related_applications": False,\n            "categories": ["government", "utilities", "social"],\n            "icons": [\n                {"src": icon_192, "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},\n                {"src": icon_512, "sizes": "512x512", "type": "image/png", "purpose": "any maskable"},\n            ],\n            "shortcuts": [\n                {"name": "Mangel melden", "url": "/mangel-melden", "icons": [{"src": icon_192, "sizes": "192x192", "type": "image/png"}]},\n                {"name": "DGH anfragen", "url": "/dgh-anfrage", "icons": [{"src": icon_192, "sizes": "192x192", "type": "image/png"}]},\n                {"name": "Warnungen", "url": "/warnungen", "icons": [{"src": icon_192, "sizes": "192x192", "type": "image/png"}]},\n                {"name": "Mein Profil", "url": "/profil", "icons": [{"src": icon_192, "sizes": "192x192", "type": "image/png"}]},\n            ],\n        },\n        media_type="application/manifest+json",\n        headers={"Cache-Control": "no-store, no-cache, must-revalidate, max-age=0", "Pragma": "no-cache", "Expires": "0"},\n    )\n\n\nasync def versioned_icon'''
          text, count = re.subn(manifest_pattern, manifest, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('pwa_main manifest rewrite failed')
          old_js = '''async def pwa_javascript_v6():\n    source = (STATIC_DIR / "pwa.js").read_text(encoding="utf-8")\n    source = source.replace("ahnsen-hilft-public-v3", "ahnsen-hilft-public-v6")\n    source = source.replace("/pwa/icon-192.png", "/pwa/ahnsen-app-v5-192.png")\n    source = source.replace("/pwa/icon-512.png", "/pwa/ahnsen-app-v5-512.png")\n'''
          new_js = '''async def pwa_javascript_v6():\n    cfg = get_platform_snapshot()\n    source = (STATIC_DIR / "pwa.js").read_text(encoding="utf-8")\n    source = source.replace("ahnsen-hilft-public-v3", f"{cfg['platform_slug']}-public-v7")\n    source = source.replace("Ahnsen hilft", cfg["platform_name"])\n    source = source.replace("/pwa/icon-192.png", cfg.get("pwa_icon_192_url") or "/pwa/ahnsen-app-v5-192.png")\n    source = source.replace("/pwa/icon-512.png", cfg.get("pwa_icon_512_url") or "/pwa/ahnsen-app-v5-512.png")\n'''
          if old_js not in text:
              raise SystemExit('pwa_main js anchor missing')
          text = text.replace(old_js, new_js, 1)
          text = text.replace('        source + _PUSH_HELPER + _LOCATION_HELPER,\n', '        source + _PUSH_HELPER.replace("/pwa/ahnsen-app-v5-180.png", cfg.get("apple_touch_icon_url") or "/pwa/ahnsen-app-v5-180.png") + _LOCATION_HELPER,\n', 1)
          p.write_text(text, encoding='utf-8')

          # Static pwa.js is still safe when served directly outside pwa_main.
          p = Path('static/pwa.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("      title: 'Ahnsen hilft',", "      title: document.querySelector('meta[name=\\\"application-name\\\"]')?.content || document.title.split(' · ').pop() || 'Bürgerplattform',", 1)
          text = text.replace("      installButton.setAttribute('aria-label', 'Ahnsen hilft installieren');", "      installButton.setAttribute('aria-label', `${document.title.split(' · ').pop() || 'Bürgerplattform'} installieren`);", 1)
          p.write_text(text, encoding='utf-8')

          # Add application-name metadata used by generic JS.
          p = Path('pwa_ui.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<meta charset="utf-8"><meta name="viewport"', '<meta charset="utf-8"><meta name="application-name" content="{escape(cfg[\'platform_name\'])}"><meta name="viewport"', 1)
          p.write_text(text, encoding='utf-8')

          PY
      - name: Validate code
        run: |
          python -m py_compile platform_runtime.py translation_service.py community_crud.py community_routes.py community_dashboard.py community_search.py community_ui.py intern_ui.py warning_service.py warning_ui.py warning_dashboard.py pwa_ui.py pwa_core.py pwa_main.py push_service.py smart_push.py pwa_push_job.py email_service.py muelltermine_parser.py
          node --check static/community.js
          node --check static/pwa.js
      - name: Import application
        run: |
          python - <<'PY'
          import pwa_main
          from platform_runtime import get_platform_snapshot
          cfg = get_platform_snapshot()
          assert cfg['platform_name']
          assert cfg['pwa_icon_192_url']
          assert any(getattr(route, 'path', '') == '/api/uebersetzen' for route in pwa_main.app.routes)
          assert any(getattr(route, 'path', '') == '/intern/plattform' for route in pwa_main.app.routes)
          print('final white-label/i18n import smoke ok')
          PY
      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemeinde_crud.py platform_runtime.py community_dashboard.py community_routes.py static/community.js push_service.py smart_push.py pwa_push_job.py email_service.py muelltermine_parser.py warning_ui.py warning_dashboard.py pwa_ui.py pwa_core.py pwa_main.py static/pwa.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "White-Label und Vollübersetzung finalisieren"
          git push origin HEAD:agent/i18n-white-label-complete
