name: Apply push preferences

on:
  push:
    branches:
      - agent/push-einstellungen-vollstaendig
    paths:
      - scripts/apply_push_preferences.py
      - .github/workflows/apply-push-preferences.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/push-einstellungen-vollstaendig
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply implementation
        run: python scripts/apply_push_preferences.py
      - name: Fix f-string JavaScript braces
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("push_dashboard.py")
          text = path.read_text(encoding="utf-8")
          old = "category?.addEventListener('change',()=>{const option=category.options[category.selectedIndex];if(option?.dataset.url)url.value=option.dataset.url;});"
          new = "category?.addEventListener('change',()=>{{const option=category.options[category.selectedIndex];if(option?.dataset.url)url.value=option.dataset.url;}});"
          if old not in text:
              raise SystemExit("Expected JavaScript snippet not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            pwa_models.py \
            pwa_crud.py \
            push_service.py \
            pwa_account_ui.py \
            pwa_core.py \
            main.py \
            intern_ui.py \
            dashboard.py \
            dgh_dashboard.py \
            veranstaltungen_dashboard.py \
            pwa_push_job.py \
            push_dashboard.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_models.py pwa_crud.py push_service.py pwa_account_ui.py pwa_core.py main.py intern_ui.py dashboard.py dgh_dashboard.py veranstaltungen_dashboard.py pwa_push_job.py push_dashboard.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add configurable push categories and admin push center"
            git push origin HEAD:agent/push-einstellungen-vollstaendig
          fi
