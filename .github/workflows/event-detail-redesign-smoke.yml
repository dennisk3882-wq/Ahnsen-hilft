name: Event detail redesign smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: event-detail-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./event-detail-redesign-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate event detail and recap UI
        run: |
          python -m py_compile event_time_utils.py event_detail_redesign.py feature_routes.py
          python - <<'PY'
          import asyncio
          import json
          from datetime import date, timedelta

          from starlette.requests import Request
          from database import Base, SessionLocal, engine
          from veranstaltungen_models import Veranstaltung
          from event_time_utils import display_event_title

          assert display_event_title("LIAM's Geburtstag") == 'Liams Geburtstag'

          Base.metadata.create_all(bind=engine)
          db = SessionLocal()
          future = Veranstaltung(
              titel='winterfest',
              datum=(date.today() + timedelta(days=3)).strftime('%d.%m.%Y'),
              uhrzeit='17:00 Uhr',
              ort='dgh',
              kategorie='Veranstaltung',
              beschreibung='Gemeinsamer Abend im Dorf.',
              ansprechpartner='Ansprechpartner',
              aktiv='Ja',
          )
          past = Veranstaltung(
              titel="LIAM's Geburtstag",
              datum=(date.today() - timedelta(days=12)).strftime('%d.%m.%Y'),
              uhrzeit='18:00 Uhr',
              ort='In der Flöte 19',
              kategorie='Veranstaltung',
              beschreibung='Ursprüngliche Einladung.',
              ansprechpartner='Dennis',
              rueckblick_text='Ein schöner gemeinsamer Abend.',
              rueckblick_bilder_json=json.dumps([
                  {'mime':'image/jpeg','data':'aGVsbG8='},
                  {'mime':'image/webp','data':'d29ybGQ='},
              ]),
              aktiv='Ja',
          )
          empty_past = Veranstaltung(
              titel='Alter Termin',
              datum=(date.today() - timedelta(days=20)).strftime('%d.%m.%Y'),
              uhrzeit='19:00 Uhr',
              ort='DGH',
              kategorie='Veranstaltung',
              beschreibung='Alte Terminbeschreibung.',
              ansprechpartner='Keine Angabe',
              aktiv='Ja',
          )
          db.add_all([future, past, empty_past]); db.commit()
          db.refresh(future); db.refresh(past); db.refresh(empty_past)
          future_id, past_id, empty_past_id = future.id, past.id, empty_past.id
          db.close()

          import pwa_main
          from feature_routes import install_feature_routes
          install_feature_routes()
          assert pwa_main.app.state.event_detail_redesign_installed is True

          matching = [r for r in pwa_main.app.router.routes if getattr(r, 'path', '') == '/aktuelles-termine/{event_id}']
          assert matching
          assert matching[0].endpoint.__module__ == 'event_detail_redesign'

          from event_detail_redesign import redesigned_event_detail, _clean_contact
          assert _clean_contact('Ansprechpartner') == ''
          assert _clean_contact('Keine Angabe') == ''
          request = Request({
              'type':'http','method':'GET','path':'/aktuelles-termine/1','headers':[],
              'query_string':b'', 'scheme':'http', 'server':('testserver',80),
              'client':('127.0.0.1',1)
          })

          upcoming = asyncio.run(redesigned_event_detail(request, future_id)).body.decode('utf-8')
          assert 'Winterfest' in upcoming
          assert '17:00 Uhr' in upcoming
          assert 'DGH' in upcoming
          assert 'Über den Termin' in upcoming
          assert 'Über die Veranstaltung' not in upcoming
          assert '🔔 Erinnern' in upcoming
          assert '📅 Zum Kalender' in upcoming
          assert 'Ursprüngliche Termininfo' not in upcoming
          assert 'padding-bottom:170px' in upcoming
          assert '@media(max-width:350px)' in upcoming
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in upcoming
          assert '<div class="ed-contact">' not in upcoming

          recap = asyncio.run(redesigned_event_detail(request, past_id)).body.decode('utf-8')
          assert 'Liams Geburtstag' in recap
          assert 'Vergangener Termin' in recap
          assert 'Vergangene Veranstaltung' not in recap
          assert 'Fotos und Nachbericht zum vergangenen Termin.' in recap
          assert 'Dorfchronik' in recap
          assert 'So war es' in recap
          assert 'Ein schöner gemeinsamer Abend.' in recap
          assert 'Ursprüngliche Termininfo' in recap
          assert 'Ursprüngliche Veranstaltungsinfo' not in recap
          assert 'data-event-photo=' in recap
          assert 'event-photo-lightbox' in recap
          assert '🔔 Erinnern' not in recap
          assert 'Zum Kalender' not in recap

          empty = asyncio.run(redesigned_event_detail(request, empty_past_id)).body.decode('utf-8')
          assert 'ed-recap compact' in empty
          assert 'Zu diesem Termin wurde noch kein Nachbericht ergänzt.' in empty
          assert 'Zu dieser Veranstaltung wurde noch kein Nachbericht ergänzt.' not in empty
          assert '<div class="ed-contact">' not in empty

          print('Event detail redesign smoke tests passed')
          PY
