name: Bürgermeister Compact Mobile Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-mobile-final-release.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply compact mobile workspace
        run: python .github/scripts/bgm_mobile_final_patch.py

      - name: Verify mobile UI implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          grep -Fq 'data-game-tab="actions"' BuergermeisterPWA/app.js
          grep -Fq 'data-game-tab="finance"' BuergermeisterPWA/app.js
          grep -Fq 'class="game-sticky-bar"' BuergermeisterPWA/app.js
          grep -Fq 'renderCompactMarket' BuergermeisterPWA/app.js
          grep -Fq 'Bürgermeister compact mobile workspace v1' BuergermeisterPWA/styles.css
          grep -Fq 'buergermeister-1992-plus-v8' BuergermeisterPWA/sw.js

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested compact UI and promote production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/bgm_mobile_final_patch.py .github/workflows/bgm-mobile-final-release.yml
          git add BuergermeisterPWA/app.js BuergermeisterPWA/styles.css BuergermeisterPWA/sw.js
          git commit -m "Redesign Bürgermeister for compact mobile gameplay"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$RELEASE_SHA"; then
            echo "Production branch is not an ancestor of tested release. Refusing promotion."
            exit 1
          fi
          git push origin "$RELEASE_SHA":refs/heads/buergermeister-production
          echo "Promoted tested compact mobile release $RELEASE_SHA"
