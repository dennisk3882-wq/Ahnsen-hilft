name: Temporary fix community UI

on:
  push:
    branches:
      - agent/community-platform-expansion

permissions:
  contents: write

jobs:
  fix-community-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/community-platform-expansion
      - name: Fix nested f-string and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('community_ui.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for item in items:\n        source = f'<a class="secondary-button small-button" href="{escape(item.source_url)}" target="_blank" rel="noopener">Originalquelle</a>' if item.source_url else ""\n        rows.append(\n            f'<article class="community-card civic-item"><span class="civic-kind">{escape(item.kind)}</span><h2>{escape(item.title)}</h2>'\n            f'<div class="community-meta">{f"<span class=\\"community-chip\\">📅 {escape(item.date_text)}</span>" if item.date_text else ""}{f"<span class=\\"community-chip\\">📍 {escape(item.location)}</span>" if item.location else ""}</div>'\n            f'<p>{escape(item.body)}</p>{source}</article>'\n        )\n'''
          new = '''    for item in items:\n        source = f'<a class="secondary-button small-button" href="{escape(item.source_url)}" target="_blank" rel="noopener">Originalquelle</a>' if item.source_url else ""\n        date_chip = f'<span class="community-chip">📅 {escape(item.date_text)}</span>' if item.date_text else ""\n        location_chip = f'<span class="community-chip">📍 {escape(item.location)}</span>' if item.location else ""\n        rows.append(\n            f'<article class="community-card civic-item"><span class="civic-kind">{escape(item.kind)}</span><h2>{escape(item.title)}</h2>'\n            f'<div class="community-meta">{date_chip}{location_chip}</div>'\n            f'<p>{escape(item.body)}</p>{source}</article>'\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'date_chip = ' not in text:
              raise SystemExit('Expected politics-page snippet not found')
          PY
          python -m py_compile community_ui.py community_models.py community_crud.py community_search.py community_dashboard.py community_routes.py smart_push.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_ui.py
          git commit -m "Community-UI Syntax korrigieren"
          git push origin HEAD:agent/community-platform-expansion
