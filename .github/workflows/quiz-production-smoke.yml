name: QuizTime Production Smoke

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - 'quiz-app/**'
      - 'render.yaml'
      - '.github/workflows/quiz-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiztime-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUIZTIME_PRODUCTION_SMOKE: '1'
      PLAYWRIGHT_BASE_URL: ${{ vars.QUIZTIME_PRODUCTION_URL || 'https://ahnsen-live-quiz.onrender.com' }}
      PRODUCTION_URL: ${{ vars.QUIZTIME_PRODUCTION_URL || 'https://ahnsen-live-quiz.onrender.com' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            quiz-app/package-lock.json
            quiz-app/e2e-tools/package-lock.json

      - name: Anwendung installieren
        working-directory: quiz-app
        run: npm ci

      - name: Playwright reproduzierbar installieren
        working-directory: quiz-app/e2e-tools
        run: npm ci --ignore-scripts

      - name: Chromium installieren
        working-directory: quiz-app
        run: ./e2e-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Auf genau diesen Render-Commit warten
        shell: bash
        run: |
          set -euo pipefail
          echo "Warte auf ${GITHUB_SHA} unter ${PLAYWRIGHT_BASE_URL}."
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "${PLAYWRIGHT_BASE_URL}/health" >/dev/null; then
              payload=$(curl --fail --silent --show-error --max-time 20 "${PLAYWRIGHT_BASE_URL}/api/platform/release-readiness" || true)
              deployed_sha=$(node -e "try{const value=JSON.parse(process.argv[1]);process.stdout.write(String(value.commitSha||''));}catch{}" "$payload")
              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                echo "QuizTime 13.1 ist mit dem erwarteten Commit erreichbar."
                exit 0
              fi
              echo "Versuch ${attempt}/30: Render liefert noch ${deployed_sha:-keinen Commit}."
            else
              echo "Versuch ${attempt}/30: Dienst noch nicht erreichbar."
            fi
            sleep 20
          done
          echo "Render hat den erwarteten Commit nicht innerhalb von zehn Minuten ausgeliefert."
          exit 1

      - name: Phase-11-Bereitschaft prüfen
        working-directory: quiz-app
        run: npm run test:production-readiness

      - name: QuizTime-13.1-Releasebereitschaft prüfen
        working-directory: quiz-app
        run: npm run test:release-readiness

      - name: Produktionsseite mit echtem Browser prüfen
        working-directory: quiz-app
        run: npm run test:production-smoke

      - name: Produktionsbericht sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quiztime-production-report-${{ github.run_number }}
          path: |
            quiz-app/playwright-report
            quiz-app/test-results
          retention-days: 14
          if-no-files-found: ignore
