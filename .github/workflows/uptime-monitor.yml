name: Kostenlose Betriebsueberwachung

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://ahnsen-digital.onrender.com/health/deep' }}
    steps:
      - name: Produktionssystem pruefen
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 10 "$HEALTH_URL")"
          echo "$response"
          python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok", data' <<< "$response"
