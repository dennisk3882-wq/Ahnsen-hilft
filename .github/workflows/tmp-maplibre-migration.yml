name: Temporary MapLibre migration
on:
  push:
    branches:
      - agent/maplibre-defect-map
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maplibre-defect-map
      - name: Apply MapLibre migration
        run: python tmp_maplibre_patch.py
      - name: Validate migration
        run: |
          python -m py_compile community_ui.py community_routes.py pwa_main.py
          grep -q "maplibre-gl@5.24.0" community_ui.py
          grep -q "tiles.openfreemap.org/styles/liberty" community_ui.py
          grep -q "cooperativeGestures:true" community_ui.py
          ! grep -q "leaflet@1.9.4" community_ui.py
          ! grep -q "leaflet.markercluster" community_ui.py
      - name: Commit migration
        run: |
          rm tmp_maplibre_patch.py .github/workflows/tmp-maplibre-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_ui.py tmp_maplibre_patch.py .github/workflows/tmp-maplibre-migration.yml
          git commit -m "Mängelkarte auf MapLibre migrieren"
          git push
