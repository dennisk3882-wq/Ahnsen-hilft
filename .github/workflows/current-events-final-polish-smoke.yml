name: Aktuelles final polish smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: current-events-final-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./current-events-final-polish-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate final current events polish
        run: |
          python -m py_compile event_time_utils.py event_storage_polish.py current_events_final_polish.py runtime_extensions.py
          python - <<'PY'
          import asyncio
          from datetime import date, timedelta

          from starlette.requests import Request
          from database import Base, SessionLocal, engine
          from veranstaltungen_models import Veranstaltung
          from event_time_utils import (
              canonical_event_time,
              display_event_place,
              display_event_title,
              time_input_value,
          )

          Base.metadata.create_all(bind=engine)

          # Canonical time and display cleanup.
          assert canonical_event_time('18') == '18:00 Uhr'
          assert canonical_event_time('18Uhr') == '18:00 Uhr'
          assert canonical_event_time('18 Uhr') == '18:00 Uhr'
          assert canonical_event_time('18.30') == '18:30 Uhr'
          assert canonical_event_time('1830') == '18:30 Uhr'
          assert time_input_value('18Uhr') == '18:00'
          assert display_event_place('Dfh') == 'DGH'
          assert display_event_place('dgh') == 'DGH'
          assert display_event_title("Liam's Geburtstag") == 'Liams Geburtstag'

          import pwa_main
          from runtime_extensions import install_runtime_extensions
          install_runtime_extensions()
          assert pwa_main.app.state.current_events_final_polish_installed is True

          # Admin must use a native mobile/browser time picker instead of free text.
          import main as legacy
          admin = legacy.veranstaltungen_dashboard().body.decode('utf-8')
          assert 'type="time" name="uhrzeit"' in admin
          assert 'step="300"' in admin
          assert 'Uhrzeit auswählen · 5-Minuten-Schritte' in admin
          assert 'name="uhrzeit" value="" placeholder="18:00 Uhr"' not in admin

          # Patched write path stores canonical values.
          event = legacy.save_veranstaltung(
              titel="Liam's Geburtstag",
              datum=(date.today() + timedelta(days=3)).strftime('%d.%m.%Y'),
              uhrzeit='18Uhr',
              ort='Dfh',
              kategorie='Veranstaltung',
              beschreibung='Testveranstaltung',
              ansprechpartner='Test',
          )
          db = SessionLocal()
          stored = db.query(Veranstaltung).filter(Veranstaltung.id == event.id).first()
          assert stored is not None
          assert stored.uhrzeit == '18:00 Uhr'
          assert stored.ort == 'DGH'
          event_id = stored.id
          db.close()

          # Public mobile page: no duplicate archive card, clear filter swipe cue,
          # clean title/place/time and enough bottom space for the fixed nav.
          import current_events_mobile_patch as mobile
          request = Request({
              'type':'http','method':'GET','path':'/aktuelles-termine','headers':[],
              'query_string':b'', 'scheme':'http', 'server':('testserver',80),
              'client':('127.0.0.1',1)
          })
          page = mobile._compact_main_page(request).body.decode('utf-8')
          assert 'Liams Geburtstag' in page
          assert '18:00 Uhr' in page
          assert '📍 DGH' in page
          assert '<a class="ctm-archive-link"' not in page
          assert 'mask-image:linear-gradient' in page
          assert 'padding-bottom:235px' in page

          # Detail/ICS use the same canonical time.
          import current_events_patch as center
          detail = asyncio.run(center.event_detail(request, event_id)).body.decode('utf-8')
          assert '18:00 Uhr' in detail
          assert '📍 <span>DGH</span>' in detail
          ics = asyncio.run(center.event_ics(event_id)).body.decode('utf-8')
          assert 'T180000' in ics
          assert 'DTSTART;VALUE=DATE:' not in ics

          print('Aktuelles final polish smoke tests passed')
          PY
