name: Temporary i18n and white-label completion

on:
  push:
    branches:
      - agent/i18n-white-label-complete

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-white-label-complete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch platform modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Flexible settings: no schema migration needed for these extra tenant values.
          replace_once(
              'gemeinde_crud.py',
              '    "gruen": "#6d8f49",\n',
              '''    "gruen": "#6d8f49",\n    "plattform_kurzname": "Ahnsen",\n    "plattform_beschreibung": "Digitale Bürgerplattform für Ahnsen",\n    "standard_sprache": "de",\n    "plattform_sprachen": "de,en,pl,uk,tr,fr,es,it,nl,ro,cs,da,sv,ar,ru",\n    "zeitzone": "Europe/Berlin",\n    "plattform_basis_url": "https://ahnsen-hilft.onrender.com",\n    "ticket_prefix": "AHN",\n    "karten_mittelpunkt_lat": "52.258",\n    "karten_mittelpunkt_lon": "9.099",\n    "karten_zoom": "15",\n    "warnung_ortsname": "Ahnsen",\n    "warnung_bereich": "Ahnsen / Landkreis Schaumburg",\n    "warnung_suchbegriffe": "Ahnsen|Bad Eilsen|Eilsen",\n    "bbk_mowas_rss_url": "https://warnung.bund.de/api31/mowas/rss/032570000000.rss",\n    "dwd_cap_index_url": "https://opendata.dwd.de/weather/alerts/cap/COMMUNEUNION_DWD_STAT/",\n    "uebersetzung_aktiv": "ja",\n    "uebersetzung_api_url": "https://de.libretranslate.com/translate",\n    "uebersetzung_fallback_url": "https://translate.argosopentech.com/translate",\n    "geschichte_modus": "ahnsen",\n''',
              'white-label settings defaults',
          )

          # Community preferences support the complete language selector.
          replace_once(
              'community_crud.py',
              '''SUPPORTED_LANGUAGES = {\n    "de": "Deutsch",\n    "en": "English",\n    "pl": "Polski",\n    "uk": "Українська",\n    "tr": "Türkçe",\n}\n''',
              '''SUPPORTED_LANGUAGES = {\n    "de": "Deutsch",\n    "en": "English",\n    "pl": "Polski",\n    "uk": "Українська",\n    "tr": "Türkçe",\n    "fr": "Français",\n    "es": "Español",\n    "it": "Italiano",\n    "nl": "Nederlands",\n    "ro": "Română",\n    "cs": "Čeština",\n    "da": "Dansk",\n    "sv": "Svenska",\n    "ar": "العربية",\n    "ru": "Русский",\n}\n''',
              'language expansion',
          )
          replace_once(
              'community_crud.py',
              '    sender_label: str = "Gemeinde Ahnsen",\n) -> CitizenMessage:\n',
              '    sender_label: str | None = None,\n) -> CitizenMessage:\n',
              'dynamic sender signature',
          )
          replace_once(
              'community_crud.py',
              '''    db = SessionLocal()\n    try:\n        item = CitizenMessage(\n            user_id=user_id,\n''',
              '''    if not sender_label:\n        try:\n            from platform_runtime import get_platform_snapshot\n            sender_label = get_platform_snapshot().get("contact_name") or "Verwaltung"\n        except Exception:\n            sender_label = "Verwaltung"\n    db = SessionLocal()\n    try:\n        item = CitizenMessage(\n            user_id=user_id,\n''',
              'dynamic sender fallback',
          )
          replace_once(
              'community_crud.py',
              '            sender_label=str(sender_label or "Gemeinde Ahnsen")[:120],\n',
              '            sender_label=str(sender_label or "Verwaltung")[:120],\n',
              'dynamic sender storage',
          )

          # platform_runtime: additionally replace common grammatical tenant phrases and ticket example.
          p = Path('platform_runtime.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        ("Idee für Ahnsen", f"Idee für {municipality}"),\n',
              '        ("Idee für Ahnsen", f"Idee für {municipality}"),\n        (" in Ahnsen", f" in {municipality}"),\n        (" für Ahnsen", f" für {municipality}"),\n        (" aus Ahnsen", f" aus {municipality}"),\n        (" von Ahnsen", f" von {municipality}"),\n        ("AHN-", f"{cfg[\"ticket_prefix\"]}-"),\n',
          )
          p.write_text(text, encoding='utf-8')

          # PWA UI central page/brand rendering.
          replace_once(
              'pwa_ui.py',
              'from ahnsen_history import history_content\n',
              'from ahnsen_history import history_content\nfrom platform_runtime import apply_static_branding, get_platform_snapshot, platform_language_options\n',
              'pwa platform import',
          )
          p = Path('pwa_ui.py')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'def _brand\(\) -> str:\n.*?\n\ndef _bottom_nav',
              '''def _brand() -> str:\n    cfg = get_platform_snapshot()\n    logo = (\n        f'<span class="brand-crest custom-brand-logo" aria-hidden="true"><img src="{escape(cfg["logo_url"])}" alt=""></span>'\n        if cfg.get("logo_url")\n        else """<span class="brand-crest" aria-hidden="true"><svg viewBox="0 0 64 72"><path class="crest-shape" d="M7 5h50v34c0 16-12 24-25 29C19 63 7 55 7 39z"/><path class="crest-hill" d="M8 45c11-10 22-8 28-3 7-7 13-8 20-3v4c0 13-10 20-24 25C18 63 8 56 8 43z"/><path class="crest-house" d="m20 42 12-10 12 10v14H20z"/><path class="crest-roof" d="m17 43 15-13 15 13"/><path class="crest-door" d="M29 47h6v9h-6z"/><path class="crest-tree" d="M47 20v21M42 25l5-7 5 7M41 32l6-8 6 8"/><path class="crest-tower" d="M19 20h8v18h-8zM18 20l5-8 5 8"/></svg></span>"""\n    )\n    return f"""\n    <a class="brand" href="/" aria-label="{escape(cfg['platform_name'])} Startseite" translate="no">\n      {logo}\n      <span class="brand-copy"><strong data-platform-municipality>{escape(cfg['municipality_name'])}</strong><em data-platform-product>{escape(cfg['platform_name'].replace(cfg['municipality_name'], '').strip() or 'digital')}</em><small data-platform-claim>{escape(cfg['claim'])}</small></span>\n    </a>"""\n\n\ndef _bottom_nav''',
              text,
              count=1,
              flags=re.S,
          )
          if 'custom-brand-logo' not in text:
              raise SystemExit('brand function rewrite failed')
          text = re.sub(
              r'def page\(title: str, content: str, \*, active: str = "home", description: str = "Digitale Bürgerplattform für Ahnsen", show_header: bool = True, body_class: str = ""\) -> HTMLResponse:\n.*?\n\ndef _entries',
              '''def page(title: str, content: str, *, active: str = "home", description: str = "", show_header: bool = True, body_class: str = "") -> HTMLResponse:\n    cfg = get_platform_snapshot()\n    language_options = platform_language_options()\n    content = apply_static_branding(content, cfg)\n    title = apply_static_branding(title, cfg)\n    description = apply_static_branding(description or cfg["description"], cfg)\n    header = f'<header class="topbar">{_brand()}<div class="topbar-community-actions"><label class="language-picker" translate="no"><span class="sr-only">Sprache</span><select id="platform-language" aria-label="Sprache auswählen">{language_options}</select></label><span id="translation-state" class="translation-state" role="status" aria-live="polite" hidden translate="no">↻</span><a class="message-center-link" id="message-center-link" href="/nachrichten" aria-label="Nachrichten" hidden>{icon("message")}<span class="message-badge" hidden></span></a><button class="install-button" id="install-app" type="button" hidden>{icon("download")}<span>Installieren</span></button></div></header>' if show_header else ""\n    style = f'<style>:root{{--forest:{cfg["primary_color"]};--sage:{cfg["accent_color"]};}} .custom-brand-logo img{{width:100%;height:100%;object-fit:contain}} .translation-state{{font-weight:900;opacity:.65}}</style>'\n    html = f"""<!doctype html><html lang="{escape(cfg['default_language'])}"><head>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="{escape(cfg['primary_color'])}"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="{escape(cfg['short_name'])}"><meta name="description" content="{escape(description)}"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/pwa/icon-192.png"><link rel="icon" href="/pwa/icon-192.png"><link rel="stylesheet" href="/pwa.css?v=1"><link rel="stylesheet" href="/community.css?v=2"><link rel="stylesheet" href="/warning.css?v=1"><title>{escape(title)} · {escape(cfg['platform_name'])}</title>{style}</head>\n<body class="{escape(body_class)}" data-platform-municipality-name="{escape(cfg['municipality_name'])}" data-platform-default-language="{escape(cfg['default_language'])}"><div class="app-shell">{header}<main class="app-main">{content}</main>{_bottom_nav(active)}</div><div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden>Du bist offline. Bereits geladene Inhalte bleiben verfügbar.</div><script src="/pwa.js?v=1" defer></script><script src="/community.js?v=2" defer></script></body></html>"""\n    return HTMLResponse(html)\n\n\ndef _entries''',
              text,
              count=1,
              flags=re.S,
          )
          if 'community.js?v=2' not in text:
              raise SystemExit('page function rewrite failed')
          # Custom hero image + configurable hero copy.
          text = text.replace(
              '    content = f"""\n<section class="hero-card"><div class="hero-image" role="img" aria-label="Dorfansicht von Ahnsen"></div><div class="hero-overlay"><span class="hero-kicker">Willkommen in Ahnsen</span><h1>Digital. Direkt.<br>Gemeinsam.</h1><p>Alles Wichtige aus dem Dorf in einer App.</p></div></section>\n',
              '''    cfg = get_platform_snapshot()\n    hero_url = str(settings.get("hero_bild_url") or cfg.get("hero_image_url") or "")\n    hero_style = f' style="background-image:url(\\'{escape(hero_url)}\\')"' if hero_url else ""\n    hero_kicker = settings.get("hero_titel") or f"Willkommen in {cfg['municipality_name']}"\n    hero_subtitle = settings.get("hero_untertitel") or "Digital. Direkt. Gemeinsam."\n    hero_text = settings.get("hero_text") or cfg["description"]\n    content = f"""\n<section class="hero-card"><div class="hero-image" role="img" aria-label="Ansicht {escape(cfg['municipality_name'])}"{hero_style}></div><div class="hero-overlay"><span class="hero-kicker">{escape(hero_kicker)}</span><h1>{escape(hero_subtitle)}</h1><p>{escape(hero_text)}</p></div></section>\n''',
          )
          # About page becomes tenant-aware; Ahnsen keeps the rich history module.
          old = '''def info_page(kind: str, settings: dict) -> HTMLResponse:\n    if kind == "ueber-ahnsen":\n        return page(\n            "Über Ahnsen",\n            history_content(),\n            active="home",\n            description="Ahnsen von den Anfängen bis heute – vollständige Ortsgeschichte bis 2026",\n            body_class="history-view",\n        )\n'''
          new = '''def info_page(kind: str, settings: dict) -> HTMLResponse:\n    cfg = get_platform_snapshot()\n    if kind in {"ueber-ahnsen", "ueber-gemeinde"}:\n        if cfg.get("history_mode") == "ahnsen" and cfg["municipality_name"].casefold() == "ahnsen":\n            return page(\n                f"Über {cfg['municipality_name']}",\n                history_content(),\n                active="home",\n                description=f"{cfg['municipality_name']} von den Anfängen bis heute – Ortsgeschichte",\n                body_class="history-view",\n            )\n        raw = str(settings.get("ueber_ahnsen_text") or settings.get("ueber_ahnsen_seite_text") or cfg["description"])\n        paragraphs = "".join(f'<p>{escape(part.strip())}</p>' for part in raw.splitlines() if part.strip()) or f'<p>{escape(cfg["description"])}</p>'\n        return page(f"Über {cfg['municipality_name']}", f'<section class="page-heading compact"><a class="back-link" href="/">← Start</a><span class="eyebrow">Unser Ort</span><h1>Über {escape(cfg["municipality_name"])}</h1></section><section class="content-card">{paragraphs}</section>', active="more")\n'''
          if old not in text:
              raise SystemExit('about page anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Community map and tenant-aware defaults.
          replace_once(
              'community_ui.py',
              'from pwa_ui import icon, page\n',
              'from pwa_ui import icon, page\nfrom platform_runtime import get_platform_snapshot\n',
              'community ui platform import',
          )
          p = Path('community_ui.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''def public_map_page(points: list[dict]) -> HTMLResponse:\n    safe_points = json.dumps(points, ensure_ascii=False).replace("</", "<\\\\/")\n''',
              '''def public_map_page(points: list[dict]) -> HTMLResponse:\n    cfg = get_platform_snapshot()\n    safe_points = json.dumps(points, ensure_ascii=False).replace("</", "<\\\\/")\n''',
          )
          text = text.replace('aria-label="Karte von Ahnsen"', 'aria-label="Karte von {escape(cfg[\'municipality_name\'])}"')
          text = text.replace("const map=L.map('public-map').setView([52.258,9.099],15);", "const map=L.map('public-map').setView([{cfg['map_lat']},{cfg['map_lon']}],{cfg['map_zoom']});")
          p.write_text(text, encoding='utf-8')

          # Search follows tenant identity and disables Ahnsen history for other tenants.
          replace_once(
              'community_search.py',
              'from veranstaltungen_crud import get_aktive_veranstaltungen\n',
              'from veranstaltungen_crud import get_aktive_veranstaltungen\nfrom platform_runtime import apply_static_branding, get_platform_snapshot\n',
              'search platform import',
          )
          p = Path('community_search.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''    candidates: list[dict] = []\n    for title, text, url, kind in SERVICE_INDEX:\n        candidates.append({"title": title, "text": text, "url": url, "kind": kind})\n\n    settings = get_gemeinde_einstellungen()\n''',
              '''    cfg = get_platform_snapshot()\n    candidates: list[dict] = []\n    for title, text, url, kind in SERVICE_INDEX:\n        if url == "/ueber-ahnsen":\n            url = "/ueber-gemeinde"\n        candidates.append({"title": apply_static_branding(title, cfg), "text": apply_static_branding(text, cfg), "url": url, "kind": kind})\n\n    settings = get_gemeinde_einstellungen()\n''',
          )
          old_history = '''    history = _plain(history_content())\n    history_score = _score(query, "Geschichte Ahnsens", history)\n    if history_score:\n        candidates.append({\n            "title": "Geschichte Ahnsens",\n            "text": _snippet(history, query, 300),\n            "url": "/ueber-ahnsen",\n            "kind": "geschichte",\n            "fixed_score": history_score,\n        })\n'''
          new_history = '''    if cfg.get("history_mode") == "ahnsen" and cfg["municipality_name"].casefold() == "ahnsen":\n        history = _plain(history_content())\n        history_title = f"Geschichte {cfg['municipality_name']}s"\n        history_score = _score(query, history_title, history)\n        if history_score:\n            candidates.append({\n                "title": history_title,\n                "text": _snippet(history, query, 300),\n                "url": "/ueber-gemeinde",\n                "kind": "geschichte",\n                "fixed_score": history_score,\n            })\n    else:\n        about = str(settings.get("ueber_ahnsen_text") or settings.get("ueber_ahnsen_seite_text") or "")\n        if about:\n            candidates.append({"title": f"Über {cfg['municipality_name']}", "text": about, "url": "/ueber-gemeinde", "kind": "information"})\n'''
          if old_history not in text:
              raise SystemExit('history search anchor missing')
          text = text.replace(old_history, new_history, 1)
          p.write_text(text, encoding='utf-8')

          # Community routes: translation API + complete platform save/load.
          replace_once(
              'community_routes.py',
              'from crud import suche_meldungen\n',
              'from crud import suche_meldungen\nfrom gemeinde_crud import set_gemeinde_einstellung\nfrom platform_runtime import get_platform_snapshot\nfrom translation_service import provider_status, translate_texts\n',
              'community route platform imports',
          )
          p = Path('community_routes.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('            "ort": location[:100] or "Ahnsen",\n', '            "ort": location[:100] or get_platform_snapshot()["municipality_name"],\n')
          anchor = '''@router.get("/api/plattform")\nasync def public_platform_config():\n    config = get_municipality_config()\n    return {\n        "platform_name": config.platform_name,\n        "municipality_name": config.municipality_name,\n        "claim": config.claim,\n        "postal_code": config.postal_code,\n        "primary_color": config.primary_color,\n        "accent_color": config.accent_color,\n    }\n'''
          replacement = '''@router.post("/api/uebersetzen")\nasync def public_translate(request: Request):\n    try:\n        payload = await request.json()\n    except Exception:\n        payload = {}\n    texts = payload.get("texts") or payload.get("text") or []\n    if isinstance(texts, str):\n        texts = [texts]\n    if not isinstance(texts, list):\n        raise HTTPException(status_code=400, detail="texts muss eine Liste sein")\n    target = _clean(payload.get("target"), 10)\n    source = _clean(payload.get("source"), 10) or "auto"\n    try:\n        return translate_texts(texts, target=target, source=source)\n    except ValueError as error:\n        raise HTTPException(status_code=400, detail=str(error)) from error\n    except RuntimeError as error:\n        raise HTTPException(status_code=503, detail=str(error)) from error\n\n\n@router.get("/api/uebersetzen/status")\nasync def public_translation_status():\n    return provider_status()\n\n\n@router.get("/api/plattform")\nasync def public_platform_config():\n    return get_platform_snapshot()\n'''
          if anchor not in text:
              raise SystemExit('platform public API anchor missing')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('    return platform_settings_page(get_municipality_config())\n', '    return platform_settings_page(get_platform_snapshot())\n', 1)
          old_save = '''    values = {field: _clean(form.get(field), limit) for field, limit in (\n        ("platform_name", 120), ("municipality_name", 120), ("claim", 180),\n        ("postal_code", 20), ("primary_color", 20), ("accent_color", 20),\n        ("warning_terms", 500),\n    )}\n    config = update_municipality_config(values)\n    audit_event("Verwaltung", "Plattform-Konfiguration geändert", "municipality_config", str(config.id), config.platform_name)\n    return RedirectResponse(url="/intern/plattform", status_code=303)\n'''
          new_save = '''    values = {field: _clean(form.get(field), limit) for field, limit in (\n        ("platform_name", 120), ("municipality_name", 120), ("claim", 180),\n        ("postal_code", 20), ("primary_color", 20), ("accent_color", 20),\n        ("warning_terms", 500),\n    )}\n    config = update_municipality_config(values)\n    extras = {\n        "plattform_kurzname": _clean(form.get("short_name"), 30),\n        "plattform_beschreibung": _clean(form.get("description"), 300),\n        "standard_sprache": _clean(form.get("default_language"), 10),\n        "plattform_sprachen": _clean(form.get("languages"), 300),\n        "zeitzone": _clean(form.get("timezone"), 80),\n        "plattform_basis_url": _clean(form.get("public_base_url"), 500),\n        "ticket_prefix": _clean(form.get("ticket_prefix"), 8),\n        "karten_mittelpunkt_lat": _clean(form.get("map_lat"), 30),\n        "karten_mittelpunkt_lon": _clean(form.get("map_lon"), 30),\n        "karten_zoom": _clean(form.get("map_zoom"), 3),\n        "warnung_ortsname": _clean(form.get("warning_location_name"), 160),\n        "warnung_bereich": _clean(form.get("warning_area_label"), 240),\n        "warnung_suchbegriffe": _clean(form.get("warning_terms"), 500),\n        "bbk_mowas_rss_url": _clean(form.get("bbk_mowas_rss_url"), 1000),\n        "dwd_cap_index_url": _clean(form.get("dwd_cap_index_url"), 1000),\n        "uebersetzung_aktiv": "ja" if _clean(form.get("translation_enabled"), 10) == "ja" else "nein",\n        "uebersetzung_api_url": _clean(form.get("translation_api_url"), 1000),\n        "uebersetzung_fallback_url": _clean(form.get("translation_fallback_url"), 1000),\n        "geschichte_modus": _clean(form.get("history_mode"), 20),\n        "logo_bild_url": _clean(form.get("logo_url"), 1000),\n        "hero_bild_url": _clean(form.get("hero_image_url"), 1000),\n        "kontakt_name": _clean(form.get("contact_name"), 180),\n        "kontakt_adresse": _clean(form.get("contact_address"), 500),\n        "kontakt_email": _clean(form.get("contact_email"), 180),\n        "kontakt_telefon": _clean(form.get("contact_phone"), 80),\n        "externe_website_url": _clean(form.get("website_url"), 1000),\n        "footer_datenschutz_url": _clean(form.get("privacy_url"), 1000),\n        "footer_impressum_url": _clean(form.get("imprint_url"), 1000),\n    }\n    for key, value in extras.items():\n        set_gemeinde_einstellung(key, value)\n    audit_event("Verwaltung", "Plattform-Konfiguration geändert", "municipality_config", str(config.id), config.platform_name)\n    return RedirectResponse(url="/intern/plattform?hinweis=" + quote("White-Label-Konfiguration gespeichert."), status_code=303)\n'''
          if old_save not in text:
              raise SystemExit('platform save anchor missing')
          text = text.replace(old_save, new_save, 1)
          p.write_text(text, encoding='utf-8')

          # Complete white-label settings dashboard.
          replace_once(
              'community_dashboard.py',
              'from intern_ui import intern_nav, intern_nav_css\n',
              'from intern_ui import intern_nav, intern_nav_css\nfrom platform_runtime import get_platform_snapshot\n',
              'admin platform import',
          )
          p = Path('community_dashboard.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '<title>{escape(title)} · Ahnsen hilft Verwaltung</title><style>{intern_nav_css()}',
              '<title>{escape(title)} · {escape(get_platform_snapshot()["platform_name"])} Verwaltung</title><style>{intern_nav_css()}',
              1,
          )
          text = re.sub(
              r'def platform_settings_page\(config\) -> HTMLResponse:\n.*?\Z',
