name: Temporary validate ratsarchive autosync
on:
  push:
    branches: [agent/ratsarchive-autosync]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/ratsarchive-test.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratsarchive-autosync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.62.0 pypdf==6.15.0
          python -m playwright install --with-deps chromium
      - name: Run official RIS sync
        run: xvfb-run -a python scripts/sync_ratsarchive_from_ris.py --years 6
      - name: Validate manifest and bundled PDFs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('static/ratsarchive-seed/manifest.json').read_text(encoding='utf-8'))
          items=data['meetings']
          nums={int(x['session_number']) for x in items}
          assert nums.issuperset(range(1,19)), nums
          assert len(items)==18, len(items)
          pdf_sessions={int(x['session_number']) for x in items if x.get('filename')}
          print('sessions=',sorted(nums),'pdf_sessions=',sorted(pdf_sessions))
          assert {5,6,17,18}.issubset(pdf_sessions), pdf_sessions
          for item in items:
              if item.get('filename'):
                  p=Path('static/ratsarchive-seed')/item['filename']
                  assert p.exists() and p.read_bytes().startswith(b'%PDF-')
          PY
      - name: Test duplicate cleanup and idempotent seed
        run: |
          rm -f /tmp/ratsarchive-test.db
          python - <<'PY'
          import hashlib
          from datetime import datetime
          from pathlib import Path
          from database import SessionLocal
          from ratsarchive_models import CouncilDocument, CouncilMeeting
          from ratsarchive_service import add_archive_document, create_archive_meeting, init_ratsarchive_db
          from ratsarchive_seed import seed_official_ratsarchive

          init_ratsarchive_db()
          meeting_id=create_archive_meeting(
              date_text='2026-05-05',time_text='19:30',
              title='Öffentliche Niederschrift der 18. Sitzung des Gemeinderates Ahnsen',
              organization='Gemeinderat Ahnsen',location='DGH Ahnsen',
              summary='Alter Datensatz: 19:30 bis 20:33 Uhr.',source_url='',published=True)
          official=Path('static/ratsarchive-seed/2026-05-05_niederschrift_gemeinderat_ahnsen_sitzung_18.pdf').read_bytes()
          add_archive_document(meeting_id,kind='Niederschrift / Protokoll',title='Öffentliche Niederschrift der 18. Sitzung des Gemeinderates Ahnsen',filename='official.pdf',data=official,source_url='',published=True)
          db=SessionLocal()
          db.add(CouncilDocument(
              meeting_id=meeting_id,kind='Niederschrift / Protokoll',title='Öffentliche Niederschrift der 18. Sitzung des Gemeinderates Ahnsen',
              filename='alte-archivkopie.pdf',mime_type='application/pdf',file_data=b'%PDF-1.4\nold synthetic archive copy',size_bytes=36,
              sha256='f'*64,extracted_text='alte Kopie',source_url='',published=True,created_at=datetime.utcnow(),updated_at=datetime.utcnow()))
          db.commit(); db.close()

          first=seed_official_ratsarchive()
          second=seed_official_ratsarchive()
          db=SessionLocal()
          meeting=db.query(CouncilMeeting).filter(CouncilMeeting.id==meeting_id).one()
          docs=db.query(CouncilDocument).filter(CouncilDocument.meeting_id==meeting_id, CouncilDocument.kind=='Niederschrift / Protokoll').all()
          total_meetings=db.query(CouncilMeeting).filter(CouncilMeeting.organization=='Gemeinderat Ahnsen').count()
          print('first=',first,'second=',second,'total_meetings=',total_meetings,'meeting_docs=',len(docs))
          assert len(docs)==1
          assert docs[0].file_data==official
          assert docs[0].sha256==hashlib.sha256(official).hexdigest()
          assert '20:33' not in meeting.summary
          assert total_meetings==18
          db.close()
          PY
      - name: Compile changed Python
        run: python -m py_compile ratsarchive_seed.py scripts/sync_ratsarchive_from_ris.py
      - name: Remove temporary workflow and commit final synced manifest
        if: always()
        run: |
          rm -f .github/workflows/tmp-validate-ratsarchive-autosync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ratsarchiv-Autosync final validieren' || true
          git pull --rebase origin agent/ratsarchive-autosync || true
          git push origin HEAD:agent/ratsarchive-autosync
