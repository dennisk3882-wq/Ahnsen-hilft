name: Temporary home info tiles

on:
  push:
    branches:
      - agent/home-info-tiles-fire-icon

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-info-tiles-fire-icon
      - name: Update home tiles and icons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pwa_ui.py')
          text = path.read_text(encoding='utf-8')

          old_icons = '    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎", "fire": "🚒",\n'
          new_icons = (
              '    "arrow": "›", "bell": "●", "shield": "◇", "download": "↓", "phone": "☎",\n'
              '    "fire": \'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V8h10l3 3h3a2 2 0 0 1 2 2v2"/><path d="M5 8V5h8v3M8 5V3h4v2M2 15h20M13 11h3"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg>\',\n'
              '    "info": \'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>\',\n'
              '    "village": \'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 11 8 6l5.5 5v8h-11zM6 19v-5h4v5"/><path d="M17 19V9M14.5 12 17 7l2.5 5M13.5 15l3.5-6 3.5 6"/></svg>\',\n'
          )
          if old_icons not in text:
              raise SystemExit('Icon-Zeile nicht gefunden')
          text = text.replace(old_icons, new_icons, 1)

          old_services = (
              '        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),\n'
              '        ("phone", "Ansprechpartner", "Wichtige Kontakte auf einen Blick.", "/ansprechpartner"), ("fire", "Feuerwehr", "Feuerwehr Ahnsen & Sicherheit.", "/feuerwehr"),\n'
          )
          new_services = (
              '        ("people", "Vereine & Gruppen", "Gemeinschaft erleben.", "/vereine"), ("news", "Aktuelles", "Neuigkeiten aus dem Dorf.", "/aktuelles"),\n'
              '        ("info", "Bürgerinformationen", "Hinweise der Gemeinde.", "/buergerinformationen"), ("village", "Über Ahnsen", "Unser Dorf im Überblick.", "/ueber-ahnsen"),\n'
              '        ("phone", "Ansprechpartner", "Wichtige Kontakte auf einen Blick.", "/ansprechpartner"), ("fire", "Feuerwehr", "Feuerwehr Ahnsen & Sicherheit.", "/feuerwehr"),\n'
          )
          if old_services not in text:
              raise SystemExit('Service-Kacheln nicht gefunden')
          text = text.replace(old_services, new_services, 1)

          old_config = '"feuerwehr": ("Feuerwehr Ahnsen", "Sicherheit & Ehrenamt", "shield", settings.get("feuerwehr_text", "")), "buergerinformationen": ("Bürgerinformationen", "Gut informiert", "news", settings.get("buergerinfo_text", "")), "ueber-ahnsen": ("Über Ahnsen", "Unser Dorf", "home", settings.get("ueber_ahnsen_text", ""))'
          new_config = '"feuerwehr": ("Feuerwehr Ahnsen", "Sicherheit & Ehrenamt", "fire", settings.get("feuerwehr_text", "")), "buergerinformationen": ("Bürgerinformationen", "Gut informiert", "info", settings.get("buergerinfo_text", "")), "ueber-ahnsen": ("Über Ahnsen", "Unser Dorf", "village", settings.get("ueber_ahnsen_text", ""))'
          if old_config not in text:
              raise SystemExit('Info-Seiten-Konfiguration nicht gefunden')
          text = text.replace(old_config, new_config, 1)

          old_more = '    items = [("Bürgerinformationen", "/buergerinformationen", "news", "Hinweise der Gemeinde"), ("Über Ahnsen", "/ueber-ahnsen", "home", "Unser Dorf"), ("Meldestatus", "/meldestatus", "search", "Bearbeitungsstand prüfen"), ("Verwaltung", "/verwaltung", "building", "Geschützter Bereich"), ("Datenschutz", "/datenschutz", "shield", "Datenverarbeitung"), ("Impressum", "/impressum", "news", "Anbieterkennzeichnung")]\n'
          new_more = '    items = [("Meldestatus", "/meldestatus", "search", "Bearbeitungsstand prüfen"), ("Verwaltung", "/verwaltung", "building", "Geschützter Bereich"), ("Datenschutz", "/datenschutz", "shield", "Datenverarbeitung"), ("Impressum", "/impressum", "news", "Anbieterkennzeichnung")]\n'
          if old_more not in text:
              raise SystemExit('Mehr-Menü nicht gefunden')
          text = text.replace(old_more, new_more, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile pwa_ui.py
      - name: Commit changes
        run: |
          rm .github/workflows/temp-home-info-tiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py .github/workflows/temp-home-info-tiles.yml
          git commit -m "Bürgerinfos auf Startseite und Feuerwehrsymbol vereinheitlichen"
          git push origin HEAD:agent/home-info-tiles-fire-icon
