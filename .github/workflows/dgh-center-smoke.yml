name: DGH center smoke tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: dgh-center-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./dgh-center-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile DGH center
        run: python -m py_compile dgh_center.py pwa_main.py pwa_core.py dgh_crud.py
      - name: Validate production route and DGH UI
        run: |
          python - <<'PY'
          from starlette.requests import Request

          import pwa_main
          from pwa_core import startup
          from dgh_center import render_dgh_center

          startup()

          routes = [
              route for route in pwa_main.app.router.routes
              if getattr(route, "path", "") == "/dgh-mieten"
              and "GET" in (getattr(route, "methods", set()) or set())
          ]
          assert routes, "DGH route missing"
          assert routes[0].name == "dgh_center_page", [route.name for route in routes]
          assert getattr(pwa_main.app.state, "dgh_center_installed", False) is True

          scope = {
              "type": "http",
              "asgi": {"version": "3.0"},
              "http_version": "1.1",
              "method": "GET",
              "scheme": "http",
              "path": "/dgh-mieten",
              "raw_path": b"/dgh-mieten",
              "query_string": b"",
              "headers": [],
              "client": ("127.0.0.1", 12345),
              "server": ("testserver", 80),
          }
          html = render_dgh_center(Request(scope)).body.decode()
          for expected in (
              "Dorfgemeinschaftshaus Ahnsen",
              "Raum für Gemeinschaft",
              "Verfügbarkeit prüfen",
              "Wunschtermin finden",
              "So funktioniert die Anfrage",
              "DGH auf einen Blick",
              "Hinweise der Gemeinde",
              "/dgh-anfrage?datum=",
          ):
              assert expected in html, expected

          source = open("static/pwa.js", encoding="utf-8").read()
          assert "'/dgh-anfrage'" in source
          assert "'/dgh-anfrage-erfolgreich'" in source
          print("DGH center production smoke tests passed")
          PY
