name: Syndikat deep balance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/deep-balance.trigger'

jobs:
  deep-balance:
    strategy:
      fail-fast: false
      matrix:
        difficulty: [easy, normal, hard, boss]
        length: [short, normal, long]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNDIKAT_DIFFICULTY: ${{ matrix.difficulty }}
      SYNDIKAT_LENGTH: ${{ matrix.length }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical core bundle
        run: node Syndikat/tools/build-core.cjs --check
      - name: Run 20 full-table campaigns
        run: node Syndikat/tests/deep-balance-shard.cjs
