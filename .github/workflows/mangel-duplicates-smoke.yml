name: Mängel duplicate intelligence smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: mangel-duplicates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./mangel-duplicates-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate duplicate intelligence and administration workflow
        run: |
          python -m py_compile models.py crud.py mangel_duplicates.py mangel_duplicate_patch.py runtime_extensions.py
          python - <<'PY'
          import asyncio
          from datetime import datetime, timedelta
          from sqlalchemy import inspect
          from starlette.requests import Request

          from database import Base, SessionLocal, engine
          from models import Meldung
          from crud import (
              get_duplicate_children,
              get_duplicate_overview,
              get_meldung,
              init_db,
              mark_duplicate_suspicion,
              save_meldung,
              set_duplicate_decision,
              update_status,
          )
          from mangel_duplicates import WARNING_THRESHOLD, find_duplicate_matches

          Base.metadata.drop_all(bind=engine)
          Base.metadata.create_all(bind=engine)
          init_db()
          columns = {col['name'] for col in inspect(engine).get_columns('meldungen')}
          assert {
              'duplicate_candidate_ticket', 'duplicate_score', 'duplicate_state',
              'duplicate_of_ticket', 'duplicate_checked_at'
          } <= columns

          db = SessionLocal()
          existing = Meldung(
              ticket='AHN-LICHT-001', status='Offen', art='Straßenlaterne defekt',
              ort='In der Flöte 19',
              beschreibung='Die Straßenlaterne vor Haus 19 leuchtet nicht.\n\nGPS-Position: 52.240000, 9.100000',
              foto_vorhanden='Nein', whatsapp_absender='PWA', interne_notiz='',
              erstellt_am=datetime.utcnow() - timedelta(days=2),
          )
          unrelated = Meldung(
              ticket='AHN-MUELL-001', status='Offen', art='Müllablagerung',
              ort='Schulstraße 2',
              beschreibung='Mehrere Müllsäcke liegen am Straßenrand.\n\nGPS-Position: 52.250000, 9.120000',
              foto_vorhanden='Nein', whatsapp_absender='PWA', interne_notiz='',
              erstellt_am=datetime.utcnow() - timedelta(days=3),
          )
          finished = Meldung(
              ticket='AHN-LICHT-ALT', status='Erledigt', art='Straßenlaterne defekt',
              ort='In der Flöte 19',
              beschreibung='Laterne ausgefallen.\n\nGPS-Position: 52.240001, 9.100001',
              foto_vorhanden='Nein', whatsapp_absender='PWA', interne_notiz='',
              erstellt_am=datetime.utcnow() - timedelta(days=1),
          )
          db.add_all([existing, unrelated, finished]); db.commit(); db.close()

          similar = find_duplicate_matches(
              art='Straßenlaterne defekt',
              ort='In der Flöte 19 gegenüber Haus 19',
              beschreibung='Die Lampe vor Haus Nummer 19 geht nicht mehr.',
              latitude='52.240010', longitude='9.100010',
          )
          assert similar, 'expected a duplicate candidate'
          assert similar[0].ticket == 'AHN-LICHT-001', similar
          assert similar[0].score >= WARNING_THRESHOLD, similar[0]
          assert 'AHN-LICHT-ALT' not in {item.ticket for item in similar}

          far = find_duplicate_matches(
              art='Spielplatz oder Grünfläche',
              ort='Am Sportplatz',
              beschreibung='Eine Bank am Spielplatz hat ein loses Brett.',
              latitude='52.280000', longitude='9.180000',
          )
          assert not far or far[0].score < WARNING_THRESHOLD, far

          saved = save_meldung(
              'AHN-LICHT-002',
              {
                  'art':'Straßenlaterne defekt',
                  'ort':'In der Flöte 19',
                  'beschreibung':'Auch bei uns ist die Lampe dunkel.\n\nGPS-Position: 52.240009, 9.100009',
                  'foto_bytes':None,
              },
              'PWA | Name: Test',
          )
          assert saved.duplicate_state in ('', None)
          marked = mark_duplicate_suspicion('AHN-LICHT-002', 'AHN-LICHT-001', 91)
          assert marked.duplicate_state == 'Verdacht'
          assert marked.duplicate_score == 91
          assert get_duplicate_overview()['suspected'] == 1

          merged = set_duplicate_decision('AHN-LICHT-002', 'merge', 'AHN-LICHT-001')
          assert merged.duplicate_state == 'Zusammengeführt'
          assert merged.duplicate_of_ticket == 'AHN-LICHT-001'
          children = get_duplicate_children('AHN-LICHT-001')
          assert [item.ticket for item in children] == ['AHN-LICHT-002']
          update_status('AHN-LICHT-001', 'In Bearbeitung')
          assert get_meldung('AHN-LICHT-002').status == 'In Bearbeitung'

          independent = set_duplicate_decision('AHN-LICHT-002', 'independent')
          assert independent.duplicate_state == 'Eigenständig'
          assert independent.duplicate_of_ticket is None
          reset = set_duplicate_decision('AHN-LICHT-002', 'reset')
          assert (reset.duplicate_state or '') == ''
          assert reset.duplicate_candidate_ticket is None
          assert reset.duplicate_score == 0

          import pwa_main
          from runtime_extensions import install_runtime_extensions
          install_runtime_extensions()
          assert pwa_main.app.state.mangel_duplicate_workflow_installed is True

          def first_route(path, method):
              rows = [r for r in pwa_main.app.router.routes if getattr(r,'path','') == path and method in (getattr(r,'methods',set()) or set())]
              assert rows, (path, method)
              return rows[0]

          assert first_route('/mangel-melden', 'GET').endpoint.__module__ == 'mangel_duplicate_patch'
          assert first_route('/api/maengel', 'POST').endpoint.__module__ == 'mangel_duplicate_patch'
          assert first_route('/api/maengel/duplikat-pruefung', 'POST').endpoint.__module__ == 'mangel_duplicate_patch'
          assert first_route('/intern/maengel', 'GET').endpoint.__module__ == 'mangel_duplicate_patch'
          assert first_route('/intern/meldung/{ticket}', 'GET').endpoint.__module__ == 'mangel_duplicate_patch'
          assert first_route('/intern/meldung/{ticket}/duplikat', 'POST').endpoint.__module__ == 'mangel_duplicate_patch'

          from mangel_duplicate_patch import (
              _inject_admin_dashboard,
              _inject_report_intelligence,
              duplicate_preflight,
          )
          from dashboard import dashboard_page
          from pwa_ui import report_page

          citizen_html = _inject_report_intelligence(report_page()).body.decode('utf-8')
          assert 'duplicate-modal' in citizen_html
          assert '/api/maengel/duplikat-pruefung' in citizen_html
          assert 'Trotzdem absenden' in citizen_html
          assert 'duplicate_confirm' in citizen_html

          request = Request({
              'type':'http','method':'POST','path':'/api/maengel/duplikat-pruefung',
              'headers':[(b'content-type',b'application/json')], 'query_string':b'',
              'scheme':'http','server':('testserver',80),'client':('127.0.0.1',1),
          })
          async def receive():
              return {'type':'http.request','body':b'{"art":"Stra\\u00dfenlaterne defekt","ort":"In der Fl\\u00f6te 19","beschreibung":"Lampe vor Haus 19 ist dunkel","latitude":"52.24001","longitude":"9.10001"}','more_body':False}
          request._receive = receive
          preflight = asyncio.run(duplicate_preflight(request))
          payload = __import__('json').loads(preflight.body)
          assert payload['matches'] and payload['matches'][0]['ticket'] == 'AHN-LICHT-001'
          assert 'beschreibung' not in payload['matches'][0]

          # Restore a suspicion so the dashboard must visibly mark it.
          mark_duplicate_suspicion('AHN-LICHT-002', 'AHN-LICHT-001', 91)
          reports = __import__('crud').suche_meldungen()
          admin_html = _inject_admin_dashboard(dashboard_page(), reports).body.decode('utf-8')
          assert 'Dublettenübersicht' in admin_html
          assert 'Dublettenverdacht 91%' in admin_html
          assert 'Zusammengeführt' in admin_html

          print('Mängel duplicate intelligence smoke tests passed')
          PY
