name: Temporary diagnose Ahnsen protocol approval attachments
on:
  push:
    branches: [agent/ratsarchive-autosync]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratsarchive-autosync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Inspect protocol approval Vorgang pages
        run: |
          cat > /tmp/approval.py <<'PY'
          import asyncio, json, sys
          sys.path.insert(0,'.')
          from scripts.sync_ratsarchive_from_ris import BASE_URL,_wait_for_public_page,_collect_meeting_links,_anchors
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=False,args=['--disable-dev-shm-usage'])
                  c=await b.new_context(locale='de-DE',viewport={'width':1440,'height':1100})
                  page=await c.new_page(); await page.goto(BASE_URL,wait_until='domcontentloaded',timeout=45000); await _wait_for_public_page(page)
                  meetings=await _collect_meeting_links(page,6)
                  report=[]
                  for m in meetings:
                      if m['session_number'] not in (17,16,15,14): continue
                      p2=await c.new_page(); await p2.goto(m['source_page'],wait_until='domcontentloaded',timeout=40000); await p2.wait_for_timeout(700)
                      for a in await _anchors(p2):
                          blob=' '.join(str(a.get(k) or '') for k in ('label','title','aria'))
                          if '/vorgang/' in a['url'] and ('Genehmigung' in blob and ('Protokoll' in blob or 'Niederschrift' in blob)):
                              p3=await c.new_page(); await p3.goto(a['url'],wait_until='domcontentloaded',timeout=40000); await p3.wait_for_timeout(700)
                              report.append({'meeting':m,'approval':a,'body':(await p3.locator('body').inner_text())[:12000],'anchors':await _anchors(p3)})
                              await p3.close()
                      await p2.close()
                  print(json.dumps(report,ensure_ascii=False,indent=2))
                  await b.close()
          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/approval.py
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/tmp-diagnose-protocol-approval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Temporäre Protokollgenehmigungs-Diagnose entfernen' || true
          git pull --rebase origin agent/ratsarchive-autosync || true
          git push origin HEAD:agent/ratsarchive-autosync
