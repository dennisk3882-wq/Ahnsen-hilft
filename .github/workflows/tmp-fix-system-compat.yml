name: Temporary fix system compatibility
on:
  push:
    branches: [agent/admin-automations-council-fire]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-automations-council-fire
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kompatibilitätsfix anwenden
        run: python scripts/tmp_fix_system_compat.py
      - name: Systemmodul kompilieren
        run: python -m py_compile system_dashboard.py
      - name: Bestehende und neue Bezeichnung prüfen
        run: |
          grep -q 'System & Diagnose' system_dashboard.py
          grep -q 'Systemstatus & Automationen' system_dashboard.py
      - name: Nur Codefix committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system_dashboard.py
          git commit -m 'Systemstatus mit bestehender Diagnosebezeichnung kompatibel halten' || true
          git push origin HEAD:agent/admin-automations-council-fire
