name: Temporary white-label audit

on:
  push:
    branches:
      - agent/i18n-white-label-complete

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-white-label-complete
      - name: Find remaining tenant literals
        run: |
          echo '--- Runtime source literals containing Ahnsen ---'
          grep -R -n --include='*.py' --include='*.js' 'Ahnsen' . \
            --exclude='ahnsen_history.py' \
            --exclude-dir='.git' \
            --exclude-dir='.github' || true
          echo '--- Hard-coded map/default warning identifiers ---'
          grep -R -n --include='*.py' --include='*.js' -E '52\.258|9\.099|032570000000|AHN-' . \
            --exclude-dir='.git' --exclude-dir='.github' || true
