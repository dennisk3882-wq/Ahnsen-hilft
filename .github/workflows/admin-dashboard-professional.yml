name: Professional administration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed administration modules
        run: |
          python -m py_compile \
            main.py pwa_core.py community_routes.py community_dashboard.py neighborhood_enhanced_patch.py \
            governance.py governance_routes.py intern_ui.py system_diagnostics.py \
            dashboard.py veranstaltungen_dashboard.py dgh_dashboard.py \
            muelltermine_crud.py muelltermine_dashboard.py
      - name: Run repository contract tests
        env:
          DATABASE_URL: sqlite:///./dashboard-contract.db
          DASHBOARD_USER: admin
          DASHBOARD_PASSWORD: test-password
          DASHBOARD_SESSION_SECRET: dashboard-test-secret
          PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
          WARNING_BACKGROUND_ENABLED: "false"
        run: python -m unittest discover -v
