name: PostgreSQL migration smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: postgres-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahnsen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ahnsen_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ahnsen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Meldungen migration on PostgreSQL
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from crud import init_db
          from database import engine

          init_db()
          init_db()  # muss bei erneutem App-Start ebenfalls sauber durchlaufen

          columns = {column['name']: column for column in inspect(engine).get_columns('meldungen')}
          assert 'duplicate_checked_at' in columns
          assert 'TIMESTAMP' in str(columns['duplicate_checked_at']['type']).upper(), columns['duplicate_checked_at']
          print('PostgreSQL migration smoke test passed')
          PY
