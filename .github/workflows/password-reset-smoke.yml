name: Password reset smoke tests

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./password-reset-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password-with-12-chars
      DASHBOARD_SESSION_SECRET: dashboard-test-secret-with-entropy
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate one-time password recovery
        run: |
          python -m py_compile pwa_models.py pwa_crud.py pwa_account_ui.py email_service.py pwa_core.py
          python - <<'PY'
          import pwa_main
          from pwa_core import startup
          from pwa_crud import consume_password_reset, create_password_reset, create_user, get_user_by_email, password_reset_valid, verify_password

          startup()
          create_user("reset@example.test", "AltesPasswort123!", "Reset Test")
          recipient, token = create_password_reset("reset@example.test")
          assert recipient == "reset@example.test" and password_reset_valid(token)
          assert consume_password_reset(token, "NeuesPasswort456!")
          assert not password_reset_valid(token)
          assert not consume_password_reset(token, "NochEinPasswort789!")
          user = get_user_by_email("reset@example.test")
          assert verify_password("NeuesPasswort456!", user.password_hash)
          assert not verify_password("AltesPasswort123!", user.password_hash)

          paths = {getattr(route, "path", "") for route in pwa_main.app.router.routes}
          assert {"/passwort-vergessen", "/passwort-zuruecksetzen"} <= paths
          html = open("pwa_account_ui.py", encoding="utf-8").read()
          assert "Passwort vergessen?" in html and "30 Minuten" in html
          print("Password reset smoke tests passed")
          PY
