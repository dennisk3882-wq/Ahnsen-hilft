name: Apply Quiz v7 branch

on:
  push:
    branches:
      - quiz-v70-learning-profiles-admin

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quiz-v70-learning-profiles-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json
      - run: |
          mkdir -p quiz-app/public/vendor
          curl --fail --silent --show-error --location https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js --output quiz-app/public/vendor/qrcode.min.js
          node tools/apply-v70.js
      - working-directory: quiz-app
        run: npm ci && npm run test:all
      - run: |
          rm -f tools/v70-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build version 7 learning profiles and live controls"
          git push origin HEAD:quiz-v70-learning-profiles-admin
