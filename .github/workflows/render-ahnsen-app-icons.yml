name: Generate Ahnsen app icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-ahnsen-app-icons.yml

permissions:
  contents: write

jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(
                  url='static/icon-ahnsen.svg',
                  write_to=f'static/icon-{size}.png',
                  output_width=size,
                  output_height=size,
              )
          PY
      - name: Verify icons
        run: |
          file static/icon-192.png static/icon-512.png
          test -s static/icon-192.png
          test -s static/icon-512.png
      - name: Commit icons
        run: |
          git config user.name "Ahnsen PWA automation"
          git config user.email "actions@users.noreply.github.com"
          git add static/icon-192.png static/icon-512.png
          if git diff --cached --quiet; then
            echo "Icons are already current"
          else
            git commit -m "Replace installed PWA icons with professional Ahnsen design"
            git push
          fi
