name: Neighborhood mobile UI smoke tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./neighborhood-mobile-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate compact neighborhood UI and inbox bridge
        run: |
          python -m py_compile neighborhood_mobile_patch.py neighborhood_messages_patch.py feature_routes.py
          python - <<'PY'
          from types import SimpleNamespace

          import neighborhood_mobile_patch as mobile

          response = mobile.neighborhood_page(
              rows=[],
              logged_user=SimpleNamespace(id=123, name="Test Nutzer"),
              favorites=set(),
              subscriptions={"Alltag"},
              urgent_ids=set(),
          )
          html = response.body.decode("utf-8")
          assert 'href="#beitrag">Hilfe suchen' not in html
          assert 'href="#beitrag">Hilfe anbieten' not in html
          assert "Meine privaten Chats" not in html
          assert "📌 Meine Anzeigen" in html
          assert '<details class="nh-card nh-subscribe">' in html
          assert '<span class="nh-plus">+</span>' in html
          assert "max-width:100%" in html
          assert "overflow-x:hidden" in html
          assert "Push für neue Hilfe" in html

          import neighborhood_messages_patch as inbox

          created = []
          pushed = []
          inbox.create_message = lambda user_id, subject, body, **kwargs: created.append((user_id, subject, kwargs))
          inbox._original_send_user_notification = lambda *args, **kwargs: pushed.append((args, kwargs)) or 1

          result = inbox._send_and_mirror_to_inbox(
              7,
              "Neue private Nachricht",
              "Anna hat dir geschrieben.",
              "/nachbarschaft/chat/42",
              "neighbor-msg-42",
              None,
          )
          assert result == 1
          assert len(created) == 1
          assert created[0][0] == 7
          assert created[0][2]["category"] == "nachbarschaft-chat"
          assert created[0][2]["url"] == "/nachbarschaft/chat/42"
          assert len(pushed) == 1

          created.clear()
          inbox._send_and_mirror_to_inbox(7, "Neue Hilfe", "Neuer Beitrag", "/nachbarschaft", "tag", None)
          assert created == [], "category pushes must not clutter the central inbox"

          print("Neighborhood mobile UI smoke tests passed")
          PY
