name: Temporary finalize Ahnsen ratsarchive manifest
on:
  push:
    branches: [agent/ratsarchive-autosync]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratsarchive-autosync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0 pypdf==6.15.0
      - run: python -m playwright install --with-deps chromium
      - name: Synchronize current Ahnsen council term
        run: xvfb-run -a python scripts/sync_ratsarchive_from_ris.py --years 6
      - name: Validate sessions 1 through 18
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('static/ratsarchive-seed/manifest.json').read_text(encoding='utf-8'))
          items=data['meetings']
          nums={int(x['session_number']) for x in items}
          missing=[n for n in range(1,19) if n not in nums]
          print('count=',len(items),'sessions=',sorted(nums),'missing=',missing)
          print('with_pdf=',[(x['session_number'],x['date'],x.get('filename')) for x in items if x.get('filename')])
          assert not missing, missing
          assert len(items) >= 18
          assert all(x['date'] >= '2021-11-01' for x in items)
          for x in items:
              if x.get('filename'):
                  p=Path('static/ratsarchive-seed')/x['filename']
                  assert p.exists() and p.read_bytes().startswith(b'%PDF-')
          PY
      - name: Remove temporary workflow and commit manifest
        if: always()
        run: |
          rm -f .github/workflows/tmp-finalize-ratsarchive-manifest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aktuellen Ahnsener Ratszeitraum 1 bis 18 synchronisieren' || true
          git pull --rebase origin agent/ratsarchive-autosync || true
          git push origin HEAD:agent/ratsarchive-autosync
