name: Ratsarchiv täglich synchronisieren

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratsarchive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.62.0 pypdf==6.15.0
          python -m playwright install --with-deps chromium

      - name: Öffentliches Ahnsener Ratsarchiv synchronisieren
        run: xvfb-run -a python scripts/sync_ratsarchive_from_ris.py --years 6

      - name: Archiv vor Veröffentlichung validieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('static/ratsarchive-seed')
          manifest = json.loads((base / 'manifest.json').read_text(encoding='utf-8'))
          meetings = manifest.get('meetings', [])
          assert meetings, 'Manifest enthält keine Sitzungen.'
          seen = set()
          pdf_count = 0
          for item in meetings:
              assert item.get('organization') == 'Gemeinderat Ahnsen'
              key = (item.get('date'), item.get('session_number'))
              assert key not in seen, f'Doppelter Sitzungseintrag: {key}'
              seen.add(key)
              filename = str(item.get('filename') or '').strip()
              if not filename:
                  continue
              path = base / filename
              assert path.is_file(), f'PDF fehlt: {path}'
              assert path.read_bytes().startswith(b'%PDF-'), f'Ungültige PDF: {path}'
              pdf_count += 1
          print(f'{len(meetings)} Ahnsen-Sitzungen und {pdf_count} lokal archivierte PDFs validiert.')
          PY

      - name: Nur echte Änderungen veröffentlichen
        run: |
          if git diff --quiet -- static/ratsarchive-seed; then
            echo "Keine neuen oder geänderten Niederschriften."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/ratsarchive-seed
          git commit -m 'Ratsarchiv: amtliche Ahnsen-Niederschriften aktualisieren'
          git pull --rebase origin main
          git push origin HEAD:main
