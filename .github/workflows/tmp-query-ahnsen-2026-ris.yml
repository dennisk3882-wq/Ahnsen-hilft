name: Temporary query Ahnsen 2026 RIS minutes
on:
  push:
    branches: [agent/import-current-2026-ris-protokoll]
permissions:
  contents: write
jobs:
  query:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-current-2026-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright beautifulsoup4 pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Query Ahnsen minutes for 2026 and download newest public PDF
        run: |
          cat > /tmp/query_ris.py <<'PY'
          import asyncio, io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          from pypdf import PdfReader
          from playwright.async_api import async_playwright

          BASE='https://samtgemeinde-eilsen.ratsinfomanagement.net/'
          OUT=Path('static/ratsarchive-seed'); OUT.mkdir(parents=True, exist_ok=True)

          def pdf_text(data):
              try:
                  r=PdfReader(io.BytesIO(data))
                  return '\n'.join((p.extract_text() or '') for p in r.pages[:50])[:500000]
              except Exception:
                  return ''

          async def pass_waf(page):
              await page.goto(BASE, wait_until='domcontentloaded', timeout=45000)
              for _ in range(14):
                  await page.wait_for_timeout(2500)
                  title=await page.title()
                  body=(await page.locator('body').inner_text())[:3000]
                  if 'Browser-Überprüfung' not in title and 'Browser wird überprüft' not in body:
                      return True
              return False

          async def main():
              report={'controls':{},'result_text':'','links':[],'downloads':[]}
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=False,args=['--disable-dev-shm-usage'])
                  context=await browser.new_context(locale='de-DE',viewport={'width':1440,'height':1000},accept_downloads=True)
                  page=await context.new_page()
                  if not await pass_waf(page):
                      report['error']='WAF did not pass'
                  else:
                      await page.goto(urljoin(BASE,'recherche'),wait_until='domcontentloaded',timeout=45000)
                      await page.wait_for_timeout(1500)
                      # Record controls for reproducibility.
                      inputs=[]
                      for i in range(await page.locator('input').count()):
                          el=page.locator('input').nth(i)
                          try:
                              inputs.append({k:(await el.get_attribute(k)) for k in ('type','name','id','value','placeholder')})
                          except Exception: pass
                      selects=[]
                      for i in range(await page.locator('select').count()):
                          el=page.locator('select').nth(i)
                          try:
                              opts=await el.locator('option').all_text_contents()
                              vals=[]
                              for j in range(await el.locator('option').count()): vals.append(await el.locator('option').nth(j).get_attribute('value'))
                              selects.append({'name':await el.get_attribute('name'),'id':await el.get_attribute('id'),'options':list(zip(opts,vals))})
                          except Exception: pass
                      report['controls']={'inputs':inputs,'selects':selects}

                      # Fill search term using associated label if possible.
                      filled=False
                      for label in ('Suchbegriffe','Stichwörter'):
                          try:
                              loc=page.get_by_label(label, exact=False)
                              if await loc.count():
                                  await loc.first.fill('Ahnsen'); filled=True; break
                          except Exception: pass
                      if not filled:
                          # Search controls after the two login fields; use names discovered at runtime.
                          for i in range(await page.locator('input').count()):
                              el=page.locator('input').nth(i)
                              try:
                                  typ=(await el.get_attribute('type') or 'text').lower()
                                  if typ not in ('text','search'): continue
                                  aria=(await el.get_attribute('aria-label') or '')
                                  name=(await el.get_attribute('name') or '')
                                  ident=(await el.get_attribute('id') or '')
                                  if re.search(r'such|term|stich|search',aria+' '+name+' '+ident,re.I):
                                      await el.fill('Ahnsen'); filled=True; break
                              except Exception: pass

                      # Select Gemeinderat Ahnsen wherever that option exists.
                      for i in range(await page.locator('select').count()):
                          sel=page.locator('select').nth(i)
                          try:
                              texts=await sel.locator('option').all_text_contents()
                              if any('Gemeinderat Ahnsen' in x for x in texts):
                                  await sel.select_option(label='Gemeinderat Ahnsen')
                          except Exception: pass

                      # Tick the public Niederschriften document type.
                      try:
                          cb=page.get_by_label('Niederschriften', exact=False)
                          if await cb.count(): await cb.first.check()
                      except Exception: pass

                      # Try date range by label.
                      for label,value in [('Zeitraum von','01.01.2026'),('Zeitraum bis','09.08.2026')]:
                          try:
                              loc=page.get_by_label(label, exact=False)
                              if await loc.count(): await loc.first.fill(value)
                          except Exception: pass

                      # Submit the search form.
                      submitted=False
                      for pattern in ('Suche starten','Suchen','Recherche starten','Anzeigen'):
                          try:
                              b=page.get_by_role('button',name=re.compile(pattern,re.I))
                              if await b.count():
                                  await b.first.click(); submitted=True; break
                          except Exception: pass
                      if not submitted:
                          # Submit the form containing the search term, otherwise the first non-login form.
                          try:
                              form=page.locator('form').filter(has_text=re.compile('Suchkriterien|Suchbegriffe',re.I)).first
                              await form.evaluate('(f)=>f.submit()'); submitted=True
                          except Exception: pass

                      await page.wait_for_timeout(5000)
                      body=(await page.locator('body').inner_text())[:150000]
                      report['result_url']=page.url; report['result_title']=await page.title(); report['result_text']=body
                      candidates=[]
                      anchors=page.locator('a[href]')
                      for i in range(await anchors.count()):
                          a=anchors.nth(i)
                          try:
                              label=' '.join((await a.inner_text()).split())
                              href=urljoin(page.url,await a.get_attribute('href'))
                              if re.search(r'niederschrift|protokoll|gemeinderat ahnsen|2026',label,re.I) or re.search(r'\.pdf(?:$|\?)|sdnetrim',href,re.I):
                                  item={'label':label[:500],'url':href}
                                  report['links'].append(item)
                                  if re.search(r'niederschrift|protokoll',label,re.I): candidates.append(item)
                          except Exception: pass

                      # Follow candidate document links newest-looking first. Capture PDF response/download.
                      for cand in candidates[:20]:
                          try:
                              resp=await context.request.get(cand['url'],timeout=30000)
                              data=await resp.body()
                              ctype=(resp.headers.get('content-type') or '').lower()
                              if data.startswith(b'%PDF-') or 'application/pdf' in ctype:
                                  text=pdf_text(data)
                                  if 'ahnsen' in text.casefold():
                                      dates=re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.2026\b',text)
                                      report['downloads'].append({'label':cand['label'],'url':cand['url'],'bytes':len(data),'dates':sorted(set(dates)),'text_preview':text[:5000]})
                                      # Save all validated Ahnsen 2026 minutes candidates; later select latest by date.
                                      idx=len(report['downloads'])
                                      (OUT/f'ris-2026-ahnsen-candidate-{idx}.pdf').write_bytes(data)
                          except Exception as e:
                              report.setdefault('fetch_errors',[]).append({'url':cand['url'],'error':str(e)})
                  await browser.close()
              Path('ris_ahnsen_2026_query.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps({'error':report.get('error'),'result_url':report.get('result_url'),'links':report.get('links',[])[:30],'downloads':report.get('downloads',[])},ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/query_ris.py
      - name: Show query result
        run: |
          cat ris_ahnsen_2026_query.json
          ls -lh static/ratsarchive-seed/ris-2026-ahnsen-candidate-* || true
      - name: Remove temporary workflow and commit query result
        if: always()
        run: |
          rm -f .github/workflows/tmp-query-ahnsen-2026-ris.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ahnsener Niederschriften 2026 im offiziellen RIS abgefragt' || true
          git push origin HEAD:agent/import-current-2026-ris-protokoll
