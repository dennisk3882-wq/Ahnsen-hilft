name: Bürgermeister Housing Display Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-market-price-model-release.yml'

permissions:
  contents: write

concurrency:
  group: buergermeister-housing-display-release
  cancel-in-progress: false

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply housing display refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BuergermeisterPWA/app.js')
          s = p.read_text()

          old = """    const housingRatio = Math.round(g.housingCapacity()/Math.max(1,g.population)*100);\n    const eduRatio = Math.round(g.educationCoverage()*100);\n"""
          new = """    const housingCapacity = g.housingCapacity();\n    const housingRatio = Math.round(housingCapacity/Math.max(1,g.population)*100);\n    const housingFree = Math.max(0, housingCapacity - g.population);\n    const housingDeficit = Math.max(0, g.population - housingCapacity);\n    const housingCoverage = Math.min(100, housingRatio);\n    const eduRatio = Math.round(g.educationCoverage()*100);\n"""
          if old not in s:
              raise SystemExit('housing calculation anchor missing')
          s = s.replace(old, new, 1)

          old = """          <div><span>Land</span><b>${fmt.format(g.landFree())}</b></div>\n          <div><span>Nahrung</span><b class=\"${foodMonths<1?'bad':foodMonths<2?'warn':''}\">${foodMonths.toFixed(1)} Mon.</b></div>\n"""
          new = """          <div><span>Wohnen</span><b class=\"${housingDeficit>0?'bad':housingFree<15?'warn':'good'}\">${housingDeficit>0?`${fmt.format(housingDeficit)} fehlen`:`${fmt.format(housingFree)} frei`}</b></div>\n          <div><span>Nahrung</span><b class=\"${foodMonths<1?'bad':foodMonths<2?'warn':''}\">${foodMonths.toFixed(1)} Mon.</b></div>\n"""
          if old not in s:
              raise SystemExit('quick housing anchor missing')
          s = s.replace(old, new, 1)

          old = """            <div class=\"metric-card\"><span>Wohnplätze</span><b class=\"${healthClass(housingRatio,105,95)}\">${fmt.format(g.housingCapacity())}</b><small>${housingRatio}% Auslastung</small></div>\n"""
          new = """            <div class=\"metric-card\"><span>Wohnraum</span><b class=\"${housingDeficit>0?'bad':housingFree<15?'warn':'good'}\">${fmt.format(housingCapacity)} Plätze</b><small>${housingDeficit>0?`${fmt.format(housingDeficit)} fehlen · ${housingCoverage}% Bedarf gedeckt`:`${fmt.format(g.population)} belegt · ${fmt.format(housingFree)} frei`}</small></div>\n"""
          if old not in s:
              raise SystemExit('housing card anchor missing')
          s = s.replace(old, new, 1)

          old = """              <div class=\"resource\"><span>Wohnraumauslastung</span><b>${housingRatio}%</b></div>\n"""
          new = """              <div class=\"resource\"><span>Wohnraumdeckung</span><b class=\"${housingCoverage<100?'bad':'good'}\">${housingCoverage}%</b></div>\n              <div class=\"resource\"><span>Freie Wohnplätze</span><b class=\"${housingDeficit>0?'bad':housingFree<15?'warn':'good'}\">${housingDeficit>0?`${fmt.format(housingDeficit)} fehlen`:fmt.format(housingFree)}</b></div>\n"""
          if old not in s:
              raise SystemExit('political housing anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          sw = Path('BuergermeisterPWA/sw.js')
          t = sw.read_text()
          if 'buergermeister-1992-plus-v13' not in t:
              raise SystemExit('expected cache v13 missing')
          sw.write_text(t.replace('buergermeister-1992-plus-v13', 'buergermeister-1992-plus-v14', 1))
          PY

      - name: Verify housing UI
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          grep -Fq 'const housingFree = Math.max(0, housingCapacity - g.population);' BuergermeisterPWA/app.js
          grep -Fq '<span>Wohnen</span>' BuergermeisterPWA/app.js
          grep -Fq '<span>Freie Wohnplätze</span>' BuergermeisterPWA/app.js
          grep -Fq 'Wohnraumdeckung' BuergermeisterPWA/app.js
          grep -Fq 'buergermeister-1992-plus-v14' BuergermeisterPWA/sw.js

      - name: Behavioral housing test
        working-directory: BuergermeisterPWA
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('app.js','utf8').replace(/\n\s*renderHome\(\);\n\}\)\(\);\s*$/, '\n  globalThis.__BGM_TEST__={Game};\n})();');
          const store=new Map();
          const ctx={console,Math,Date,Intl,document:{getElementById:()=>({}),createElement:()=>({})},navigator:{},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)},globalThis:null}; ctx.globalThis=ctx;
          vm.createContext(ctx); vm.runInContext(src,ctx); const Game=ctx.__BGM_TEST__.Game;
          const start=new Game();
          if(start.housingCapacity()!==165) throw new Error('start housing capacity wrong '+start.housingCapacity());
          if(start.housingCapacity()-start.population!==40) throw new Error('start free housing wrong');
          const crowded=new Game({population:200,inventory:{land:7,houses:3,towers:0,schools:0,universities:0,shops:1,supermarkets:0,food:450}});
          if(!(crowded.population-crowded.housingCapacity()>0)) throw new Error('housing deficit scenario missing');
          console.log('HOUSING_DISPLAY_BEHAVIOR_OK',{capacity:start.housingCapacity(),occupied:start.population,free:start.housingCapacity()-start.population});
          NODE

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested housing UI and promote production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/app.js BuergermeisterPWA/sw.js
          git commit -m 'Show free housing clearly'
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$RELEASE_SHA"; then
            echo 'Production branch is not an ancestor; refusing promotion.'
            exit 1
          fi
          git push origin "$RELEASE_SHA":refs/heads/buergermeister-production
          echo "Promoted $RELEASE_SHA"
