name: Bürgermeister Market Price Model Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-market-price-model-release.yml'

permissions:
  contents: write

concurrency:
  group: buergermeister-market-price-model-release
  cancel-in-progress: false

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply targeted supermarket price fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BuergermeisterPWA/app.js')
          s = p.read_text()

          old_ctor = """  class Game {\n    constructor(data = {}) {\n      Object.assign(this, {\n        version: 2,\n"""
          new_ctor = """  class Game {\n    constructor(data = {}) {\n      const loadedVersion = Number(data.version || 2);\n      Object.assign(this, {\n        version: 3,\n"""
          if old_ctor not in s:
              raise SystemExit('constructor start missing')
          s = s.replace(old_ctor, new_ctor, 1)
          s = s.replace("""      this.version = 2;\n      this.inventory = { land:7, houses:3, towers:0, schools:0, universities:0, shops:1, supermarkets:0, food:450, ...(data.inventory || {}) };\n""", """      this.version = 3;\n      this.inventory = { land:7, houses:3, towers:0, schools:0, universities:0, shops:1, supermarkets:0, food:450, ...(data.inventory || {}) };\n""", 1)

          anchor = """      this.ensureMarket();\n    }\n\n    ensureMarket() {\n      for (const [key, item] of Object.entries(ITEMS)) if (!this.market[key]) this.market[key] = item.base;\n    }\n"""
          replacement = """      this.ensureMarket();\n      if (loadedVersion < 3) this.normalizeLegacySupermarketPrice();\n    }\n\n    ensureMarket() {\n      for (const [key, item] of Object.entries(ITEMS)) if (!this.market[key]) this.market[key] = item.base;\n    }\n\n    supermarketTargetPrice() {\n      const base = ITEMS.supermarkets.base;\n      const inflation = Math.pow(1.024, Math.max(0, this.monthsPlayed) / 12);\n      // Ein Supermarkt wird erst bei echter regionaler Nachfrage knapper.\n      const desired = Math.max(.15, this.population / 1100);\n      const gap = desired - this.inventory.supermarkets;\n      const demand = clamp(.94 + gap * .08, .88, 1.24);\n      return Math.max(1, base * inflation * demand);\n    }\n\n    normalizeLegacySupermarketPrice() {\n      // Alte Spielstände konnten den Supermarktpreis durch monatliches Aufmultiplizieren\n      // stark aufblasen. Nur diesen Preis einmalig auf einen plausiblen Korridor ziehen.\n      const target = this.supermarketTargetPrice();\n      this.market.supermarkets = Math.max(1, Math.round(clamp(this.market.supermarkets, target * .80, target * 1.25)));\n    }\n"""
          if anchor not in s:
              raise SystemExit('ensureMarket anchor missing')
          s = s.replace(anchor, replacement, 1)

          old_market = """    updateMarket() {\n      const inflation = 1.002 + Math.min(.008, this.monthsPlayed * .00008);\n      for (const [key,item] of Object.entries(ITEMS)) {\n        let factor = inflation * (0.965 + Math.random() * .07);\n        if (key === 'food') {\n          const pressure = this.inventory.food < this.monthlyFoodNeed() * 1.5 ? 1.035 : .995;\n          const supermarketRelief = 1 - Math.min(.018, this.inventory.supermarkets * .003);\n          factor *= pressure * supermarketRelief;\n        }\n        if (key === 'land' && this.landFree() < 3) factor *= 1.018;\n        if (key === 'houses' || key === 'towers') {\n          if (this.housingCapacity() < this.population * 1.05) factor *= 1.012;\n        }\n        if (key === 'shops' || key === 'supermarkets') {\n          factor *= this.commerceUtilization() > .8 ? 1.008 : .995;\n        }\n        this.market[key] = Math.max(1, Math.round(this.market[key] * factor));\n        const floor = Math.max(1, Math.round(item.base * .55));\n        const ceiling = Math.round(item.base * 3.2 + 5);\n        this.market[key] = clamp(this.market[key], floor, ceiling);\n      }\n    }\n"""
          new_market = """    updateMarket() {\n      const inflation = 1.002 + Math.min(.008, this.monthsPlayed * .00008);\n      for (const [key,item] of Object.entries(ITEMS)) {\n        if (key === 'supermarkets') {\n          const target = this.supermarketTargetPrice();\n          const current = this.market.supermarkets || item.base;\n          const normalized = clamp(current, target * .78, target * 1.32);\n          const noisyTarget = target * (1 + (Math.random() - .5) * .026);\n          const next = normalized + (noisyTarget - normalized) * .24;\n          this.market.supermarkets = clamp(Math.round(next), Math.round(item.base * .65), Math.round(item.base * 1.85));\n          continue;\n        }\n        let factor = inflation * (0.965 + Math.random() * .07);\n        if (key === 'food') {\n          const pressure = this.inventory.food < this.monthlyFoodNeed() * 1.5 ? 1.035 : .995;\n          const supermarketRelief = 1 - Math.min(.018, this.inventory.supermarkets * .003);\n          factor *= pressure * supermarketRelief;\n        }\n        if (key === 'land' && this.landFree() < 3) factor *= 1.018;\n        if (key === 'houses' || key === 'towers') {\n          if (this.housingCapacity() < this.population * 1.05) factor *= 1.012;\n        }\n        if (key === 'shops') {\n          factor *= this.commerceUtilization() > .8 ? 1.008 : .995;\n        }\n        this.market[key] = Math.max(1, Math.round(this.market[key] * factor));\n        const floor = Math.max(1, Math.round(item.base * .55));\n        const ceiling = Math.round(item.base * 3.2 + 5);\n        this.market[key] = clamp(this.market[key], floor, ceiling);\n      }\n    }\n"""
          if old_market not in s:
              raise SystemExit('old updateMarket block missing')
          s = s.replace(old_market, new_market, 1)

          p.write_text(s)
          sw = Path('BuergermeisterPWA/sw.js')
          t = sw.read_text().replace("buergermeister-1992-plus-v11", "buergermeister-1992-plus-v12")
          sw.write_text(t)
          PY

      - name: Verify targeted fix
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          grep -Fq 'supermarketTargetPrice()' BuergermeisterPWA/app.js
          grep -Fq 'normalizeLegacySupermarketPrice()' BuergermeisterPWA/app.js
          grep -Fq "if (key === 'supermarkets')" BuergermeisterPWA/app.js
          grep -Fq 'buergermeister-1992-plus-v12' BuergermeisterPWA/sw.js

      - name: Behavioral supermarket price tests
        working-directory: BuergermeisterPWA
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('app.js','utf8').replace(/\n\s*renderHome\(\);\n\}\)\(\);\s*$/, '\n  globalThis.__BGM_TEST__={Game};\n})();');
          const store=new Map();
          const ctx={console,Math,Date,Intl,document:{getElementById:()=>({}),createElement:()=>({})},navigator:{},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)},globalThis:null}; ctx.globalThis=ctx;
          vm.createContext(ctx); vm.runInContext(src,ctx); const Game=ctx.__BGM_TEST__.Game;
          const legacy=new Game({version:2,monthsPlayed:53,population:165,inventory:{land:7,houses:3,towers:0,schools:0,universities:0,shops:1,supermarkets:0,food:232},market:{land:132,houses:880,towers:8155,schools:3217,universities:13450,shops:1270,supermarkets:8795,food:1}});
          if(legacy.market.supermarkets>6000 || legacy.market.supermarkets<3500) throw new Error('legacy supermarket normalization failed '+legacy.market.supermarkets);
          const lowTarget=legacy.supermarketTargetPrice();
          const large=new Game({version:3,monthsPlayed:53,population:6000,inventory:{land:80,houses:80,towers:2,schools:4,universities:1,shops:8,supermarkets:1,food:5000}});
          if(!(large.supermarketTargetPrice()>lowTarget)) throw new Error('real demand should raise supermarket target');
          const originalFood=legacy.market.food, originalHouse=legacy.market.houses;
          for(let i=0;i<60;i++){legacy.updateMarket();legacy.monthsPlayed++;}
          if(legacy.market.supermarkets>7000) throw new Error('supermarket still drifts too high '+legacy.market.supermarkets);
          if(originalFood===undefined || originalHouse===undefined) throw new Error('baseline markets missing');
          console.log('SUPERMARKET_PRICE_FIX_OK',{normalized:legacy.market.supermarkets,lowTarget,highTarget:large.supermarketTargetPrice()});
          NODE

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested supermarket price fix and promote production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/app.js BuergermeisterPWA/sw.js
          git commit -m 'Fix runaway supermarket price'
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$RELEASE_SHA"; then
            echo 'Production branch is not an ancestor; refusing promotion.'
            exit 1
          fi
          git push origin "$RELEASE_SHA":refs/heads/buergermeister-production
          echo "Promoted $RELEASE_SHA"
