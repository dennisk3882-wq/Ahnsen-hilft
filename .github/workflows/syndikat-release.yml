name: Syndikat gated release

on:
  push:
    branches: [main]
    paths:
      - 'Syndikat/src/**'
      - 'Syndikat/js/**'
      - 'Syndikat/tests/**'
      - 'Syndikat/tools/**'
      - 'Syndikat/supabase/**'
      - 'Syndikat/assets/**'
      - 'Syndikat/index-source.html'
      - 'Syndikat/style.css'
      - 'Syndikat/sw.js'
      - 'Syndikat/cloud-config.js'
      - 'Syndikat/manifest.webmanifest'
      - 'Syndikat/icon*.svg'
      - '.github/workflows/syndikat-release.yml'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical core
        run: node Syndikat/tools/build-core.cjs --check
      - name: Run regression
        run: node Syndikat/tests/regression.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start source PWA
        run: |
          python3 -m http.server 4173 --directory Syndikat > /tmp/syndikat-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index-source.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Mobile and online E2E
        run: npx playwright test Syndikat/tests/ui.spec.cjs Syndikat/tests/online-e2e.spec.cjs --reporter=line --workers=1

  release:
    needs: [regression,browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tested snapshot
        run: |
          rm -rf Syndikat/live
          mkdir -p Syndikat/live
          cp -R Syndikat/assets Syndikat/js Syndikat/live/
          cp Syndikat/cloud-config.js Syndikat/style.css Syndikat/sw.js Syndikat/manifest.webmanifest Syndikat/icon.svg Syndikat/icon-192.svg Syndikat/icon-512.svg Syndikat/live/
          cp Syndikat/index-source.html Syndikat/live/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Syndikat/live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Syndikat release: tested live snapshot"
          git push
