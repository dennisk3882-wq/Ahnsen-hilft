name: Syndikat gated release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Syndikat/src/**'
      - 'Syndikat/js/**'
      - 'Syndikat/tests/**'
      - 'Syndikat/tools/**'
      - 'Syndikat/supabase/**'
      - 'Syndikat/assets/**'
      - 'Syndikat/index-source.html'
      - 'Syndikat/style.css'
      - 'Syndikat/sw.js'
      - 'Syndikat/cloud-config.js'
      - 'Syndikat/manifest.webmanifest'
      - 'Syndikat/icon*.svg'
      - '.github/workflows/syndikat-release.yml'

permissions:
  contents: write

concurrency:
  group: syndikat-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical core
        run: node Syndikat/tools/build-core.cjs --check
      - name: Decode every image
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 Syndikat/tests/assets.py
      - name: Run regression
        run: node Syndikat/tests/regression.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium firefox webkit
      - name: Start source PWA
        run: |
          python3 Syndikat/tools/serve-candidate.py > /tmp/syndikat-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index-source.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser quality and mobile UI
        run: npx playwright test --config Syndikat/tests/playwright.config.cjs '/(quality|ui)\.spec\.cjs$'
      - name: Online protocol and complete UI match
        run: npx playwright test --config Syndikat/tests/playwright.config.cjs --project=chromium online-e2e.spec.cjs online-ui.spec.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results

  strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node Syndikat/tests/active-strategies.cjs > active-strategies.json
      - uses: actions/upload-artifact@v4
        with:
          name: active-strategies
          path: active-strategies.json

  release:
    needs: [regression,browser,strategies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tested snapshot
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; this candidate will not be published."
            exit 0
          fi
          rm -rf Syndikat/live
          mkdir -p Syndikat/live
          cp -R Syndikat/assets Syndikat/js Syndikat/live/
          cp Syndikat/cloud-config.js Syndikat/style.css Syndikat/sw.js Syndikat/manifest.webmanifest Syndikat/icon.svg Syndikat/icon-192.svg Syndikat/icon-512.svg Syndikat/live/
          cp Syndikat/index-source.html Syndikat/live/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Syndikat/live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Syndikat release: tested live snapshot"
          git push
