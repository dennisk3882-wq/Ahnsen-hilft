name: Temporary visible defect list fix
on:
  push:
    branches:
      - agent/fix-visible-defect-list
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-visible-defect-list
      - name: Apply fix
        run: python tmp_fix_visible_list.py
      - name: Validate fix
        run: |
          python -m py_compile community_ui.py community_routes.py pwa_main.py
          grep -q "const renderVisibleList = () => { const bounds=map.getBounds();" community_ui.py
          ! grep -q "renderVisibleList = () => { if(!map.loaded()) return;" community_ui.py
      - name: Commit fix
        run: |
          rm tmp_fix_visible_list.py .github/workflows/tmp-fix-visible-list.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_ui.py tmp_fix_visible_list.py .github/workflows/tmp-fix-visible-list.yml
          git commit -m "Sichtbare Mängelliste nach Kartenstart aktualisieren"
          git push
