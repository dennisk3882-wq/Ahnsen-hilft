name: Materialize quiz app

on:
  workflow_dispatch:
  push:
    branches:
      - quiz-build-cleanup
    paths:
      - .github/workflows/materialize-quiz-app.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aktuell laufenden Quizstand rekonstruieren
        shell: bash
        run: |
          set -euo pipefail

          cat \
            quiz-v6.b64.part00 quiz-v6.b64.part01 quiz-v6.b64.part02 \
            quiz-v6.b64.part03.0 quiz-v6.b64.part03.1 quiz-v6.b64.part03.2 \
            quiz-v6.b64.part04.0 quiz-v6.b64.part04.1 quiz-v6.b64.part04.2 \
            quiz-v6.b64.part05.0 quiz-v6.b64.part05.1 quiz-v6.b64.part05.2 \
            quiz-v6.b64.part06.0 quiz-v6.b64.part06.1 quiz-v6.b64.part06.2 \
            quiz-v6.b64.part07.0 quiz-v6.b64.part07.1 quiz-v6.b64.part07.2 \
            quiz-v6.b64.part08.0 quiz-v6.b64.part08.1 quiz-v6.b64.part08.2 \
            quiz-v6.b64.part09.0 quiz-v6.b64.part09.1 quiz-v6.b64.part09.2 \
            quiz-v6.b64.part10.0 quiz-v6.b64.part10.1 quiz-v6.b64.part10.2 \
            quiz-v6.b64.part11 \
            | tr -d '\r\n ' | base64 -d > /tmp/quiz-v6.tar.gz

          echo '83984616269a7a898b112c9ca4cb61d606ab8b82ef1babfee3da4f15d0a18279  /tmp/quiz-v6.tar.gz' | sha256sum -c -
          gzip -t /tmp/quiz-v6.tar.gz

          rm -rf quiz-app
          mkdir -p quiz-app
          tar -xzf /tmp/quiz-v6.tar.gz -C quiz-app

          cat \
            quiz-v6.1-patch.part00 quiz-v6.1-patch.part01 \
            quiz-v6.1-patch.part02_03 quiz-v6.1-patch.part04_05 \
            quiz-v6.1-patch.part06_07 quiz-v6.1-patch.part08_09 \
            quiz-v6.1-patch.part10_11 quiz-v6.1-patch.part12_13 \
            quiz-v6.1-patch.part14 quiz-v6.1-patch.part15 \
            | tr -d '\r\n ' | base64 -d > /tmp/quiz-v6.1-ui-patch.tar.gz

          echo 'baa0485bd22861a6d9a7609db5b4c52c30c595eb4b776c879ec818568a073c4d  /tmp/quiz-v6.1-ui-patch.tar.gz' | sha256sum -c -
          gzip -t /tmp/quiz-v6.1-ui-patch.tar.gz
          tar -xzf /tmp/quiz-v6.1-ui-patch.tar.gz -C quiz-app

          cat \
            quiz-v62x.part00 quiz-v62x.part01 quiz-v62x.part02 \
            quiz-v62x.part03_04 quiz-v62x.part05_06 quiz-v62x.part07_08 \
            quiz-v62x.part09_10 quiz-v62x.part11_12 quiz-v62x.part13_14 \
            | tr -d '\r\n ' | base64 -d > /tmp/quiz-v62-ui-patch.tar.xz

          echo 'b8bcf5708285e3c81e27d709a13fd970dba6963cb68f6f9b8781b130b25145e2  /tmp/quiz-v62-ui-patch.tar.xz' | sha256sum -c -
          xz -t /tmp/quiz-v62-ui-patch.tar.xz
          tar -xJf /tmp/quiz-v62-ui-patch.tar.xz -C quiz-app

          test -f quiz-app/server.js
          test -f quiz-app/package.json
          test -f quiz-app/public/js/admin.js
          test -f quiz-app/public/js/player.js
          test -f quiz-app/public/js/screen.js

      - name: Erweiterte Katalogprüfung hinzufügen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quiz-app/tests

          cat > quiz-app/tests/catalog-quality.test.js <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');

          const appRoot = path.resolve(__dirname, '..');
          const errors = [];
          const warnings = [];
          const questions = [];
          const loadedModules = new Set();
          const visitedObjects = new WeakSet();

          const textKeys = ['question', 'text', 'prompt', 'frage', 'title'];
          const answerKeys = ['answers', 'options', 'choices', 'antworten'];
          const correctKeys = [
            'correctIndex', 'correct', 'answer', 'correctAnswer',
            'correctOption', 'richtigeAntwort', 'richtig'
          ];
          const categoryKeys = ['category', 'kategorie', 'topic', 'bereich'];
          const idKeys = ['id', 'questionId', 'frageId'];

          function firstValue(object, keys) {
            for (const key of keys) {
              if (Object.prototype.hasOwnProperty.call(object, key)) {
                return object[key];
              }
            }
            return undefined;
          }

          function normalize(value) {
            return String(value ?? '')
              .normalize('NFKD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/[^a-z0-9äöüß]+/gi, ' ')
              .trim()
              .replace(/\s+/g, ' ');
          }

          function looksLikeQuestion(value) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
            const text = firstValue(value, textKeys);
            const answers = firstValue(value, answerKeys);
            return typeof text === 'string' && Array.isArray(answers);
          }

          function collect(value, source, trail = 'root') {
            if (!value || typeof value !== 'object') return;
            if (visitedObjects.has(value)) return;
            visitedObjects.add(value);

            if (looksLikeQuestion(value)) {
              questions.push({ raw: value, source, trail });
              return;
            }

            if (Array.isArray(value)) {
              value.forEach((entry, index) => collect(entry, source, `${trail}[${index}]`));
              return;
            }

            for (const [key, entry] of Object.entries(value)) {
              collect(entry, source, `${trail}.${key}`);
            }
          }

          function requireAndCollect(filePath) {
            const absolute = path.resolve(filePath);
            if (loadedModules.has(absolute) || !fs.existsSync(absolute)) return;
            loadedModules.add(absolute);

            try {
              if (absolute.endsWith('.json')) {
                collect(JSON.parse(fs.readFileSync(absolute, 'utf8')), absolute);
              } else {
                collect(require(absolute), absolute);
              }
            } catch (error) {
              warnings.push(`Modul konnte nicht automatisch geprüft werden: ${path.relative(appRoot, absolute)} (${error.message})`);
            }
          }

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            const result = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (['node_modules', '.git', 'public'].includes(entry.name)) continue;
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) result.push(...walk(fullPath));
              else result.push(fullPath);
            }
            return result;
          }

          // Zuerst exakt die Datenmodule laden, die der bestehende Kerntest verwendet.
          const coreTestPath = path.join(appRoot, 'tests', 'scoring.test.js');
          if (fs.existsSync(coreTestPath)) {
            const coreSource = fs.readFileSync(coreTestPath, 'utf8');
            const requirePattern = /require\(\s*['"](\.\.\/[^'"]+)['"]\s*\)/g;
            for (const match of coreSource.matchAll(requirePattern)) {
              const requested = path.resolve(path.dirname(coreTestPath), match[1]);
              const variants = [requested, `${requested}.js`, `${requested}.json`, path.join(requested, 'index.js')];
              variants.forEach(requireAndCollect);
            }
          }

          // Danach alle typischen Katalog- und Datendateien ergänzend prüfen.
          for (const filePath of walk(appRoot)) {
            const relative = path.relative(appRoot, filePath);
            if (!/\.(js|cjs|json)$/i.test(filePath)) continue;
            if (relative === 'server.js' || relative.startsWith(`tests${path.sep}`)) continue;
            if (!/(question|fragen|catalog|katalog|bank|quiz|data)/i.test(relative)) continue;
            requireAndCollect(filePath);
          }

          if (questions.length === 0) {
            errors.push('Es konnten keine Fragenobjekte im Projekt gefunden werden.');
          }

          const textMap = new Map();
          const idMap = new Map();
          const normalizedQuestions = [];

          questions.forEach((entry, index) => {
            const question = entry.raw;
            const label = `${path.relative(appRoot, entry.source)}:${entry.trail}`;
            const text = firstValue(question, textKeys);
            const answers = firstValue(question, answerKeys);
            const correct = firstValue(question, correctKeys);
            const category = firstValue(question, categoryKeys);
            const id = firstValue(question, idKeys);
            const normalizedText = normalize(text);

            if (!normalizedText) errors.push(`${label}: Fragetext fehlt.`);
            if (!Array.isArray(answers) || answers.length !== 4) {
              errors.push(`${label}: Es müssen genau vier Antwortmöglichkeiten vorhanden sein.`);
              return;
            }

            const normalizedAnswers = answers.map(normalize);
            if (normalizedAnswers.some((answer) => !answer)) {
              errors.push(`${label}: Mindestens eine Antwort ist leer.`);
            }
            if (new Set(normalizedAnswers).size !== normalizedAnswers.length) {
              errors.push(`${label}: Antwortmöglichkeiten sind innerhalb der Frage doppelt.`);
            }

            const validCorrect = (() => {
              if (Number.isInteger(correct)) {
                return (correct >= 0 && correct < answers.length) || (correct >= 1 && correct <= answers.length);
              }
              if (typeof correct === 'string') {
                const normalizedCorrect = normalize(correct);
                if (/^[a-d]$/i.test(correct.trim())) return true;
                return normalizedAnswers.includes(normalizedCorrect);
              }
              return false;
            })();

            if (!validCorrect) {
              errors.push(`${label}: Die richtige Antwort fehlt oder verweist nicht eindeutig auf eine der vier Antworten.`);
            }

            if (normalizedText) {
              if (textMap.has(normalizedText)) {
                errors.push(`${label}: Exaktes Fragenduplikat zu ${textMap.get(normalizedText)}.`);
              } else {
                textMap.set(normalizedText, label);
              }
              normalizedQuestions.push({ text: normalizedText, label });
            }

            if (id !== undefined && id !== null && String(id).trim()) {
              const normalizedId = String(id).trim().toLowerCase();
              if (idMap.has(normalizedId)) {
                errors.push(`${label}: Doppelte Frage-ID, bereits verwendet bei ${idMap.get(normalizedId)}.`);
              } else {
                idMap.set(normalizedId, label);
              }
            } else {
              warnings.push(`${label}: Keine feste Frage-ID vorhanden.`);
            }

            if (!category || !String(category).trim()) {
              warnings.push(`${label}: Kategorie fehlt.`);
            }
            if (String(text).trim().length < 10) {
              warnings.push(`${label}: Sehr kurzer Fragetext – bitte auf Verständlichkeit prüfen.`);
            }
            if (String(text).trim().length > 220) {
              warnings.push(`${label}: Sehr langer Fragetext – auf Handy und Beamer prüfen.`);
            }
            if (!/[?？]$/.test(String(text).trim())) {
              warnings.push(`${label}: Fragetext endet nicht mit einem Fragezeichen.`);
            }
            answers.forEach((answer, answerIndex) => {
              if (String(answer).trim().length > 100) {
                warnings.push(`${label}: Antwort ${answerIndex + 1} ist ungewöhnlich lang.`);
              }
            });
          });

          function tokenSet(text) {
            return new Set(text.split(' ').filter((token) => token.length > 2));
          }

          function similarity(left, right) {
            const a = tokenSet(left);
            const b = tokenSet(right);
            if (!a.size || !b.size) return 0;
            let intersection = 0;
            for (const token of a) if (b.has(token)) intersection += 1;
            return intersection / (a.size + b.size - intersection);
          }

          const nearDuplicates = [];
          for (let left = 0; left < normalizedQuestions.length; left += 1) {
            for (let right = left + 1; right < normalizedQuestions.length; right += 1) {
              const score = similarity(normalizedQuestions[left].text, normalizedQuestions[right].text);
              if (score >= 0.86 && normalizedQuestions[left].text !== normalizedQuestions[right].text) {
                nearDuplicates.push({
                  score,
                  left: normalizedQuestions[left].label,
                  right: normalizedQuestions[right].label
                });
              }
            }
          }

          nearDuplicates
            .sort((a, b) => b.score - a.score)
            .slice(0, 50)
            .forEach((duplicate) => {
              warnings.push(
                `Mögliches ähnliches Fragenpaar (${Math.round(duplicate.score * 100)} %): ${duplicate.left} ↔ ${duplicate.right}`
              );
            });

          const reportLines = [
            '# Automatische Qualitätsprüfung des Fragenkatalogs',
            '',
            `Geprüfte Fragenobjekte: **${questions.length}**`,
            `Strukturelle Fehler: **${errors.length}**`,
            `Prüfhinweise: **${warnings.length}**`,
            '',
            '## Geprüfte Punkte',
            '',
            '- genau vier Antwortmöglichkeiten',
            '- vorhandene und gültige richtige Antwort',
            '- leere sowie doppelte Antworten',
            '- exakte doppelte Fragetexte',
            '- doppelte Frage-IDs',
            '- fehlende Kategorien und IDs',
            '- auffällig kurze oder lange Texte',
            '- mögliche sehr ähnliche Fragen',
            '',
            '> Sachliche Richtigkeit, Aktualität und sprachliche Eindeutigkeit können nicht vollständig automatisiert garantiert werden und benötigen weiterhin Stichproben durch einen Menschen.',
            ''
          ];

          if (errors.length) {
            reportLines.push('## Fehler', '', ...errors.map((error) => `- ${error}`), '');
          }
          if (warnings.length) {
            reportLines.push('## Hinweise', '', ...warnings.map((warning) => `- ${warning}`), '');
          }

          fs.writeFileSync(path.join(appRoot, 'CATALOG_QUALITY_REPORT.md'), `${reportLines.join('\n')}\n`);

          console.log(`Catalog quality check: ${questions.length} questions, ${errors.length} errors, ${warnings.length} warnings.`);
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log('Catalog quality tests passed.');
          EOF

          node <<'NODE'
          const fs = require('fs');
          const packagePath = 'quiz-app/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts = packageJson.scripts || {};
          packageJson.scripts['test:catalog'] = 'node tests/catalog-quality.test.js';
          packageJson.scripts['test:all'] = 'npm run check && npm run test:core && npm run test:catalog';
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Abhängigkeiten installieren und alles testen
        shell: bash
        run: |
          set -euo pipefail
          cd quiz-app
          npm install
          npm run test:all

      - name: Render auf normale Projektdateien umstellen
        shell: bash
        run: |
          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: ahnsen-live-quiz
              runtime: node
              region: frankfurt
              plan: free
              branch: ahnsen-live-quiz-online
              buildCommand: cd quiz-app && npm ci && npm run test:all
              startCommand: cd quiz-app && npm start
              healthCheckPath: /health
              autoDeploy: false
              envVars:
                - key: NODE_VERSION
                  value: "20"
                - key: QUIZ_TITLE
                  value: Ahnsen Quizabend
                - key: QUESTION_SECONDS
                  value: "20"
                - key: EVENT_PASSWORD
                  sync: false
                - key: ADMIN_PASSWORD
                  sync: false
          EOF

      - name: Alte Transportarchive entfernen
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \
            \( -name 'quiz-v6*' -o -name 'quiz-v62x*' -o -name 'quiz-live-archive*' \) \
            -print0 | xargs -0 -r git rm -f --

      - name: Normalen Projektstand committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A quiz-app render.yaml
          git commit -m 'Stelle Quiz auf normale Projektdateien um und prüfe Fragenkatalog'
          git push origin HEAD:quiz-build-cleanup
