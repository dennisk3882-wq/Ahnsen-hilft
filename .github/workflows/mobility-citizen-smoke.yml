name: Mobility citizen dashboard smoke tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: mobility-citizen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./mobility-citizen-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate citizen mobility dashboard and Transitous data path
        run: |
          python -m py_compile mobility_citizen.py mobility_efa_patch.py feature_routes.py muelltermine_crud.py
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path

          db = Path("mobility-citizen-smoke.db")
          if db.exists():
              db.unlink()

          import mobility_citizen as citizen
          import pwa_main
          from muelltermine_crud import init_muelltermine_db

          # Startup installs the production patch before the legacy route.
          init_muelltermine_db()
          import mobility_efa_patch as patch

          html = citizen._content()
          assert "Nächste Abfahrten" in html
          assert "Alle Abfahrten heute" in html
          assert "Alle Fahrtrichtungen" in html
          assert "Karte &amp; Live-Tracking" in html
          assert "Offizieller Fahrplan" in html
          assert "Datenquellen" in html
          assert "overflow-x:hidden" in html
          assert "Stufe 1" not in html
          assert "Stufe 2" not in html
          assert "Positionsschätzung" not in html

          mobility_routes = [
              route for route in pwa_main.app.router.routes
              if getattr(route, "path", "") == "/mobilitaet"
              and "GET" in (getattr(route, "methods", set()) or set())
          ]
          assert mobility_routes
          assert mobility_routes[0].name == "citizen_mobility", [route.name for route in mobility_routes]
          paths = {getattr(route, "path", "") for route in pwa_main.app.router.routes}
          assert "/api/mobilitaet/abfahrten" in paths
          assert "/api/mobilitaet/karte" in paths

          fixed_now = datetime(2026, 8, 10, 18, 30, tzinfo=citizen.LOCAL_TZ)
          citizen._now = lambda: fixed_now
          citizen._DAY_CACHE.clear()
          citizen._STOP_ID_CACHE.clear()
          patch._TRANSITOUS_DAY_CACHE.clear()
          patch._TRANSITOUS_STOP_CACHE.clear()
          patch._EFA_CACHE.clear()
          patch._known_coordinates = lambda stop: (52.258, 9.099)

          stop_match = {
              "type": "STOP",
              "name": "Ahnsen Schule",
              "id": "niedersachsen:ahnsen-schule",
              "lat": 52.2581,
              "lon": 9.0991,
              "score": 100,
              "modes": ["BUS"],
          }

          stop_times = {
              "place": {"name": "Ahnsen Schule"},
              "previousPageCursor": "",
              "nextPageCursor": "",
              "stopTimes": [
                  {
                      "place": {
                          "name": "Ahnsen Schule",
                          "departure": "2026-08-10T19:08:00+02:00",
                          "scheduledDeparture": "2026-08-10T19:05:00+02:00",
                      },
                      "mode": "BUS",
                      "realTime": True,
                      "headsign": "Bückeburg Bahnhof",
                      "tripTo": {"name": "Bückeburg Bahnhof"},
                      "routeShortName": "2132",
                      "displayName": "Bus 2132",
                      "tripShortName": "",
                      "cancelled": False,
                      "tripCancelled": False,
                  },
                  {
                      "place": {
                          "name": "Ahnsen Schule",
                          "departure": "2026-08-10T20:10:00+02:00",
                          "scheduledDeparture": "2026-08-10T20:10:00+02:00",
                      },
                      "mode": "BUS",
                      "realTime": False,
                      "headsign": "Bad Eilsen Busbahnhof",
                      "tripTo": {"name": "Bad Eilsen Busbahnhof"},
                      "routeShortName": "2133",
                      "displayName": "Bus 2133",
                      "tripShortName": "",
                      "cancelled": False,
                      "tripCancelled": False,
                  },
              ],
          }

          calls = []
          class FakeResponse:
              def __init__(self, payload):
                  self.payload = payload
              def raise_for_status(self):
                  return None
              def json(self):
                  return self.payload

          def fake_get(url, *, params=None, headers=None, timeout=None):
              calls.append((url, dict(params or {})))
              if url.endswith("/api/v1/reverse-geocode"):
                  assert params["type"] == "STOP"
                  return FakeResponse([stop_match])
              if url.endswith("/api/v1/geocode"):
                  assert params["type"] == "STOP"
                  return FakeResponse([stop_match])
              if url.endswith("/api/v5/stoptimes"):
                  assert params["stopId"] == "niedersachsen:ahnsen-schule"
                  assert params["time"].startswith("2026-08-10T00:00:00")
                  assert params["mode"] == "BUS,FLEX"
                  assert int(params["n"]) >= 100
                  return FakeResponse(stop_times)
              raise AssertionError(f"Unexpected request: {url}")

          patch.requests.get = fake_get
          result = citizen._fetch_day_for_stop(citizen._stop_by_key("schule"))
          assert result["provider"] == "Transitous", result
          assert result["status"] == "ok", result
          assert [item["line"] for item in result["departures"]] == ["2132", "2133"]
          assert result["departures"][0]["direction"] == "Bückeburg Bahnhof"
          assert result["departures"][0]["planned_time"] == "19:05"
          assert result["departures"][0]["time"] == "19:08"
          assert result["departures"][0]["delay_minutes"] == 3
          assert result["departures"][0]["minutes"] == 38
          assert result["departures"][0]["realtime"] is True
          assert result["departures"][1]["realtime"] is False
          assert any(url.endswith("/api/v5/stoptimes") for url, _ in calls)

          # Other regional bus line numbers must not be discarded at e.g. Klinikum.
          generic = patch._normalize_transitous(
              {
                  "place": {
                      "departure": "2026-08-10T21:00:00+02:00",
                      "scheduledDeparture": "2026-08-10T21:00:00+02:00",
                  },
                  "mode": "BUS",
                  "realTime": False,
                  "headsign": "Obernkirchen",
                  "tripTo": {"name": "Obernkirchen"},
                  "routeShortName": "2006",
                  "cancelled": False,
                  "tripCancelled": False,
              },
              citizen._stop_by_key("klinikum"),
              fixed_now,
          )
          assert generic and generic["line"] == "2006"

          print("Mobility citizen dashboard / Transitous smoke tests passed")
          PY
