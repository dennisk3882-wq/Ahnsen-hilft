name: Temporary free LibreTranslate mirror update

on:
  push:
    branches:
      - agent/free-translation-mirrors

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/free-translation-mirrors.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-translation-mirrors
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Use current no-key LibreTranslate mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'gemeinde_crud.py': {
                  'https://de.libretranslate.com/translate': 'https://translate.fedilab.app/translate',
                  'https://translate.argosopentech.com/translate': 'https://translate.cutie.dating/translate',
              },
              'platform_runtime.py': {
                  'https://de.libretranslate.com/translate': 'https://translate.fedilab.app/translate',
                  'https://translate.argosopentech.com/translate': 'https://translate.cutie.dating/translate',
              },
          }
          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text and new not in text:
                      raise SystemExit(f'{filename}: missing endpoint anchor {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile gemeinde_crud.py platform_runtime.py translation_service.py pwa_core.py pwa_main.py
          python - <<'PY'
          from gemeinde_crud import init_gemeinde_db
          init_gemeinde_db()
          from platform_runtime import get_platform_snapshot
          cfg = get_platform_snapshot()
          assert cfg['translation_api_url'] == 'https://translate.fedilab.app/translate', cfg['translation_api_url']
          assert cfg['translation_fallback_url'] == 'https://translate.cutie.dating/translate', cfg['translation_fallback_url']
          print('free LibreTranslate mirror defaults ok')
          PY
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemeinde_crud.py platform_runtime.py
          git commit -m "Aktuelle kostenlose LibreTranslate Spiegel verwenden"
          git push origin HEAD:agent/free-translation-mirrors
