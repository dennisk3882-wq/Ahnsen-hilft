name: SPD Ahnsen Native APK v1.6
on:
  push:
    branches: [spd-ahnsen-v1-6-archive-readonly]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spd-ahnsen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPD_Ahnsen_v1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SPD_Ahnsen_APK_v1_6
          path: spd-ahnsen/SPD_Ahnsen_v1.6.apk
          retention-days: 30
