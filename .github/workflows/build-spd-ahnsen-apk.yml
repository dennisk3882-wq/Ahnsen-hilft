name: SPD Ahnsen Native APK
on:
  push:
    branches: [build-spd-ahnsen-apk-v1-2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spd-ahnsen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SPD_Ahnsen_v1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SPD_Ahnsen_APK
          path: spd-ahnsen/SPD_Ahnsen_v1.3.apk
          retention-days: 30
