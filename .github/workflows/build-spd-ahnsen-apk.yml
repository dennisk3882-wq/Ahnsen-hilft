name: SPD Ahnsen 2.1 Release APK
on:
  push:
    branches: [spd-ahnsen-v2-1-attendance]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spd-ahnsen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile non-debuggable release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Collect offline signing utilities
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk SPD_Ahnsen_v2.1_release_unsigned.apk
          FIND_JAR=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          FIND_ALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          test -f "$FIND_JAR"
          test -x "$FIND_ALIGN"
          cp "$FIND_JAR" apksigner.jar
          cp "$FIND_ALIGN" zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: SPD_Ahnsen_2_1_Release_Paket
          path: |
            spd-ahnsen/SPD_Ahnsen_v2.1_release_unsigned.apk
            spd-ahnsen/apksigner.jar
            spd-ahnsen/zipalign
          retention-days: 14
