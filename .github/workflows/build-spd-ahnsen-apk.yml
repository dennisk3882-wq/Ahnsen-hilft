name: SPD Ahnsen 2.0 Android APK
on:
  push:
    branches: [spd-ahnsen-v2-0-pro]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spd-ahnsen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Collect signing utilities
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SPD_Ahnsen_v2.0_debug.apk
          FIND_JAR=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          test -n "$FIND_JAR"
          cp "$FIND_JAR" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: SPD_Ahnsen_2_0_Build
          path: |
            spd-ahnsen/SPD_Ahnsen_v2.0_debug.apk
            spd-ahnsen/apksigner.jar
          retention-days: 14
