name: Temporary DGH calendar cleanup

on:
  push:
    branches:
      - agent/dgh-calendar-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dgh-calendar-cleanup
      - name: Remove DGH summary cards and quick selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pwa_account_ui.py')
          text = path.read_text(encoding='utf-8')

          removals = [
              ".dgh-availability-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}",
              ".dgh-availability-stat{padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff}",
              ".dgh-availability-stat small{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}",
              ".dgh-availability-stat strong{display:block;margin-top:5px;color:var(--forest);font-size:25px}",
              ".dgh-next-days{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}",
              ".dgh-next-days a{padding:8px 11px;border:1px solid #cbe2d0;border-radius:999px;color:var(--forest);background:#eef8f0;font-size:12px;font-weight:900;text-decoration:none}",
              ".dgh-availability-grid{grid-template-columns:1fr}",
              "    confirmed = 0\n    requested = 0\n",
              "            confirmed += 1\n",
              "            requested += 1\n",
              "    next_days = [day for day in list(free_days) if day >= today][:6]\n    next_days_html = \"\".join(\n        f'<a href=\"/dgh-anfrage?datum={day.isoformat()}\">{day.strftime(\"%d.%m.%Y\")}</a>'\n        for day in next_days\n    ) or '<span class=\"muted\">Freie Termine werden derzeit aktualisiert.</span>'\n\n",
              "<section class=\"info-hero\"><span>{icon('building')}</span><div><small>Live-Belegungsübersicht</small><strong>{confirmed} bestätigte Belegungen</strong><p>Nur bestätigte Termine sind rot blockiert. Gelbe Tage zeigen laufende Anfragen und können weiterhin angefragt werden.</p></div></section>\n",
              "<div class=\"dgh-availability-grid\"><article class=\"dgh-availability-stat\"><small>Belegt</small><strong>{confirmed}</strong></article><article class=\"dgh-availability-stat\"><small>Offene Anfragen</small><strong>{requested}</strong></article><article class=\"dgh-availability-stat\"><small>Kalender-Vorschau</small><strong>12 Monate</strong></article></div>\n",
              "<section class=\"content-card\"><div class=\"section-title\"><span class=\"eyebrow\">Schnellauswahl</span><h2>Nächste freie Tage</h2></div><div class=\"dgh-next-days\">{next_days_html}</div></section>\n",
          ]

          missing = []
          for item in removals:
              if item not in text:
                  missing.append(item[:90])
              text = text.replace(item, '')

          if missing:
              raise SystemExit('Erwartete DGH-Bausteine nicht gefunden: ' + ' | '.join(missing))

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile pwa_account_ui.py
      - name: Commit cleanup
        run: |
          rm .github/workflows/temp-dgh-calendar-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_account_ui.py .github/workflows/temp-dgh-calendar-cleanup.yml
          git commit -m "DGH-Kalenderansicht auf das Wesentliche reduzieren"
          git push origin HEAD:agent/dgh-calendar-cleanup
