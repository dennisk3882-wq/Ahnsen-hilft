name: Temporary DGH calendar cleanup

on:
  push:
    branches:
      - agent/dgh-calendar-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dgh-calendar-cleanup
      - name: Remove remaining DGH booking counter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pwa_account_ui.py')
          text = path.read_text(encoding='utf-8')

          targets = [
              "    confirmed = 0\n",
              "            confirmed += 1\n",
              "<section class=\"info-hero\"><span>{icon('building')}</span><div><small>Live-Belegungsübersicht</small><strong>{confirmed} bestätigte Belegungen</strong><p>Nur bestätigte Termine sind rot blockiert. Gelbe Tage zeigen laufende Anfragen und können weiterhin angefragt werden.</p></div></section>\n",
          ]
          for target in targets:
              if target not in text:
                  raise SystemExit('Erwarteter DGH-Baustein nicht gefunden: ' + target[:120])
              text = text.replace(target, '')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile pwa_account_ui.py
      - name: Commit cleanup
        run: |
          rm .github/workflows/temp-dgh-calendar-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_account_ui.py .github/workflows/temp-dgh-calendar-cleanup.yml
          git commit -m "DGH-Kalender ohne Übersichtskennzahlen anzeigen"
          git push origin HEAD:agent/dgh-calendar-cleanup
