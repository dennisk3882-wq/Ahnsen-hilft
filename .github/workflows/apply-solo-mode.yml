name: Apply solo mode

on:
  push:
    branches:
      - quiz-solo-mode
    paths:
      - scripts/apply-solo-mode.js
      - .github/workflows/apply-solo-mode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Feature-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: quiz-solo-mode
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Solo-Modus integrieren und zurückschreiben
        run: node scripts/apply-solo-mode.js
