name: Bürgermeister Direct Assets v26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-direct-assets-v26.yml'

permissions:
  contents: write

jobs:
  build-direct-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split raster sheets into direct assets
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('BuergermeisterPWA')
          assets = root / 'assets'
          city_sheet = Image.open(assets / 'v23-city-stages.webp')
          market_sheet = Image.open(assets / 'v23-market-icons.webp')
          ui_sheet = Image.open(assets / 'v23-ui-icons.webp')

          stages = ['kuhdorf','dorf','grosses-dorf','kleinstadt','stadt','grossstadt','moderne-stadt','metropole']
          for i, name in enumerate(stages):
              frame = city_sheet.crop((0, i*500, city_sheet.width, (i+1)*500))
              frame.save(assets / f'city-{name}.webp', 'WEBP', quality=90, method=6)

          market_boxes = {
              'land': (0,0,300,300), 'houses': (300,0,600,300), 'towers': (600,0,900,300),
              'schools': (0,300,300,600), 'universities': (300,300,600,600), 'shops': (600,300,900,600),
              'supermarkets': (150,600,450,900), 'food': (450,600,750,900)
          }
          for name, box in market_boxes.items():
              market_sheet.crop(box).save(assets / f'market-{name}.webp', 'WEBP', quality=92, method=6)

          ui_rows = [
              ['date','cash','population','approval'],
              ['housing','food','jobs','plan'],
              ['actions','city','finance','reports']
          ]
          for r, row in enumerate(ui_rows):
              for c, name in enumerate(row):
                  ui_sheet.crop((c*225,r*225,(c+1)*225,(r+1)*225)).save(assets / f'ui-{name}.webp','WEBP',quality=92,method=6)
          for name, cx in [('menu',225),('confirm',450),('document',675)]:
              x0 = int(cx - 112.5)
              ui_sheet.crop((x0,675,x0+225,900)).save(assets / f'ui-{name}.webp','WEBP',quality=92,method=6)

          engine = root / 'game-engine.js'
          text = engine.read_text(encoding='utf-8')
          mapping = {
              "assets/stage-kuhdorf.svg":"assets/city-kuhdorf.webp",
              "assets/stage-dorf.svg":"assets/city-dorf.webp",
              "assets/stage-grosses-dorf.svg":"assets/city-grosses-dorf.webp",
              "assets/stage-kleinstadt.svg":"assets/city-kleinstadt.webp",
              "assets/stage-stadt.svg":"assets/city-stadt.webp",
              "assets/stage-grossstadt.svg":"assets/city-grossstadt.webp",
              "assets/stage-moderne-stadt.svg":"assets/city-moderne-stadt.webp",
              "assets/stage-metropole.svg":"assets/city-metropole.webp",
          }
          for old,new in mapping.items():
              text = text.replace(old,new)
          engine.write_text(text,encoding='utf-8')

          css = r'''/* Bürgermeister v26 — direct images only, no sprite cropping */
.city-scene{aspect-ratio:2.05!important;background:none!important;overflow:hidden!important;border:1px solid rgba(83,202,222,.72)!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.025),0 16px 36px rgba(0,0,0,.32)!important;filter:none!important}
.city-scene-image{display:block!important;opacity:1!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;pointer-events:none!important;filter:saturate(1.04) contrast(1.025)!important}
.city-scene-shade{background:linear-gradient(180deg,rgba(3,15,22,.01),transparent 76%,rgba(2,10,16,.08))!important}

.compact-city-identity::before{content:""!important;width:58px!important;height:58px!important;background:url("assets/ui-city.webp") center/cover no-repeat!important;border:2px solid rgba(244,200,92,.86)!important;box-shadow:0 0 19px rgba(244,200,92,.15),inset 0 0 0 3px rgba(244,200,92,.06)!important}
.compact-metric::before,.city-quick-strip>div::before,.game-tab::before,.sticky-menu-btn::before,.sticky-month-btn::before,.sticky-plan::before,.city-panel-title::before{content:""!important;background-position:center!important;background-size:contain!important;background-repeat:no-repeat!important;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))!important}
.compact-metric::before{width:30px!important;height:30px!important}.compact-metric:nth-child(1)::before{background-image:url("assets/ui-date.webp")!important}.compact-metric:nth-child(2)::before{background-image:url("assets/ui-cash.webp")!important}.compact-metric:nth-child(3)::before{background-image:url("assets/ui-population.webp")!important}.compact-metric:nth-child(4)::before{background-image:url("assets/ui-approval.webp")!important}
.city-panel-title::before{background-image:url("assets/ui-city.webp")!important;border-color:rgba(244,200,92,.48)!important;box-shadow:0 0 18px rgba(244,200,92,.15)!important}
.city-quick-strip>div::before{width:28px!important;height:28px!important}.city-quick-strip>div:nth-child(1)::before{background-image:url("assets/ui-housing.webp")!important}.city-quick-strip>div:nth-child(2)::before{background-image:url("assets/ui-food.webp")!important}.city-quick-strip>div:nth-child(3)::before{background-image:url("assets/ui-jobs.webp")!important}.city-quick-strip>div:nth-child(4)::before{background-image:url("assets/ui-plan.webp")!important}
.game-tab::before{display:inline-block!important;width:25px!important;height:25px!important;vertical-align:middle!important}.game-tab:nth-child(1)::before{background-image:url("assets/ui-actions.webp")!important}.game-tab:nth-child(2)::before{background-image:url("assets/ui-city.webp")!important}.game-tab:nth-child(3)::before{background-image:url("assets/ui-finance.webp")!important}.game-tab:nth-child(4)::before{background-image:url("assets/ui-reports.webp")!important}

.market-icon-button,.market-icon-button .market-icon{width:78px!important;height:78px!important}.market-icon-frame{width:72px!important;height:72px!important;border-radius:50%!important;overflow:hidden!important;background-position:center!important;background-size:cover!important;background-repeat:no-repeat!important;background-color:#06131e!important;border:1px solid rgba(75,224,238,.95)!important;box-shadow:0 0 0 3px rgba(31,105,129,.34),0 0 23px rgba(52,221,236,.38),0 11px 20px rgba(0,0,0,.40)!important}.market-icon-frame::before,.market-icon-frame svg{display:none!important}.market-icon-land .market-icon-frame{background-image:url("assets/market-land.webp")!important}.market-icon-houses .market-icon-frame{background-image:url("assets/market-houses.webp")!important}.market-icon-towers .market-icon-frame{background-image:url("assets/market-towers.webp")!important}.market-icon-schools .market-icon-frame{background-image:url("assets/market-schools.webp")!important}.market-icon-universities .market-icon-frame{background-image:url("assets/market-universities.webp")!important}.market-icon-shops .market-icon-frame{background-image:url("assets/market-shops.webp")!important}.market-icon-supermarkets .market-icon-frame{background-image:url("assets/market-supermarkets.webp")!important}.market-icon-food .market-icon-frame{background-image:url("assets/market-food.webp")!important}.market-info-dot{z-index:9!important;border-color:#59d7e2!important;background:#0a3850!important}

.sticky-menu-btn,.sticky-month-btn{display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important}.sticky-menu-btn::before{width:29px!important;height:29px!important;background-image:url("assets/ui-menu.webp")!important}.sticky-month-btn::before{width:31px!important;height:31px!important;background-image:url("assets/ui-confirm.webp")!important}.sticky-plan{position:relative!important;padding-left:30px!important}.sticky-plan::before{position:absolute!important;left:8px!important;top:50%!important;transform:translateY(-50%)!important;width:22px!important;height:22px!important;background-image:url("assets/ui-plan.webp")!important}
@media(max-width:520px){.market-icon-button,.market-icon-button .market-icon{width:70px!important;height:70px!important}.market-icon-frame{width:66px!important;height:66px!important}.compact-metric::before{width:27px!important;height:27px!important}.sticky-menu-btn::before{width:25px!important;height:25px!important}.sticky-month-btn::before{width:27px!important;height:27px!important}}
'''
          (root / 'real-art-v22.css').write_text(css,encoding='utf-8')

          index = root / 'index.html'
          t = index.read_text(encoding='utf-8')
          t = re.sub(r'\?v=\d+', '?v=26', t)
          index.write_text(t,encoding='utf-8')

          assets_list = [
              './','index.html','styles.css?v=26','modern-theme.css?v=26','modern-art.css?v=26','real-art-v22.css?v=26','game-engine.js?v=26','app.js?v=26','manifest.webmanifest','icons/icon.svg','icons/icon-192.png','icons/icon-512.png'
          ]
          assets_list += [f'assets/city-{s}.webp' for s in stages]
          assets_list += [f'assets/market-{k}.webp' for k in market_boxes]
          assets_list += [f'assets/ui-{n}.webp' for row in ui_rows for n in row]
          assets_list += ['assets/ui-menu.webp','assets/ui-confirm.webp','assets/ui-document.webp']
          sw = "const CACHE='buergermeister-1992-plus-v26';\nconst ASSETS=" + repr(assets_list).replace('\\\\','/') + ";\n" + "self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(ASSETS)).then(()=>self.skipWaiting()));});\nself.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))).then(()=>self.clients.claim()));});\nself.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(fetch(event.request).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response;}).catch(()=>caches.match(event.request).then(hit=>hit||caches.match('./'))));});\n"
          (root / 'sw.js').write_text(sw,encoding='utf-8')
          PY
      - name: Commit direct assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuergermeisterPWA/assets BuergermeisterPWA/game-engine.js BuergermeisterPWA/real-art-v22.css BuergermeisterPWA/index.html BuergermeisterPWA/sw.js
          git commit -m "Use direct individual Bürgermeister raster assets v26" || exit 0
          git push origin HEAD:main
