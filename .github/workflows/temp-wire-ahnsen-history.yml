name: Temporary complete Ahnsen history

on:
  push:
    branches:
      - agent/ahnsen-history-full

permissions:
  contents: write

jobs:
  complete-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ahnsen-history-full
      - name: Add remaining PDF details
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ahnsen_history.py')
          text = path.read_text(encoding='utf-8')

          old = '<div class="history-note">Der Bericht unterscheidet bewusst zwischen urkundlich oder archäologisch belegten Fakten und späteren heimatgeschichtlichen Rekonstruktionen. Zahlen in eckigen Klammern verweisen auf das Quellenverzeichnis am Ende.</div>'
          new = '<div class="history-note"><strong>Leseschlüssel:</strong> Der Bericht unterscheidet bewusst zwischen urkundlich oder archäologisch belegten Fakten und späteren heimatgeschichtlichen Rekonstruktionen. Zahlen in eckigen Klammern verweisen auf das Quellenverzeichnis am Ende.<br><br>Erstellt auf Grundlage der Ahnser Ortschronik, amtlicher Statistik und weiterer regionalhistorischer Quellen. Die Lagekarte der Originalausgabe zeigt Ahnsen im Landkreis Schaumburg; Karte: Wikimedia Commons, TUBS/Hagar66, CC BY bzw. Public-Domain-Freigaben – Details im Quellenverzeichnis.</div>'
          if old not in text:
              raise SystemExit('Leseschlüssel-Anker fehlt')
          text = text.replace(old, new, 1)

          old16 = "(16, 'Günter Doering: „Das Eilser Minchen“, Gemeinde Ahnsen, sowie Bad Eilsener Kleinbahn – historische Streckendaten.', 'https://www.ahnsen-schaumburg.de/historie/Chronik17h.pdf'),"
          new16 = "(16, 'Günter Doering: „Das Eilser Minchen“, Gemeinde Ahnsen, sowie Bad Eilsener Kleinbahn – historische Streckendaten. Weitere in der PDF genannte Quelle: https://de.wikipedia.org/wiki/Bad_Eilsener_Kleinbahn', 'https://www.ahnsen-schaumburg.de/historie/Chronik17h.pdf'),"
          if old16 not in text:
              raise SystemExit('Quelle 16 nicht gefunden')
          text = text.replace(old16, new16, 1)

          old20 = "(20, 'Landkreis Schaumburg: Geschichte des Landkreises; Portal Niedersachsen: Geschichte Schaumburgs.', 'https://www.schaumburg.de/Landkreis/'),"
          new20 = "(20, 'Landkreis Schaumburg: Geschichte des Landkreises; Portal Niedersachsen: Geschichte Schaumburgs. Weitere in der PDF genannte Quelle: https://www.niedersachsen.de/startseite/land_leute/die_geschichte/geschichte_der_regionen/schaumburg/-19605.html', 'https://www.schaumburg.de/Landkreis/'),"
          if old20 not in text:
              raise SystemExit('Quelle 20 nicht gefunden')
          text = text.replace(old20, new20, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate content
        run: |
          python -m py_compile ahnsen_history.py pwa_ui.py
          python - <<'PY'
          from ahnsen_history import history_content
          html = history_content()
          for item in ['Leseschlüssel:', 'Erstellt auf Grundlage der Ahnser Ortschronik', 'TUBS/Hagar66', 'de.wikipedia.org/wiki/Bad_Eilsener_Kleinbahn', 'niedersachsen.de/startseite/land_leute']:
              assert item in html, item
          assert html.count('class="history-chapter"') >= 20
          print('Complete PDF details validated')
          PY
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahnsen_history.py
          git commit -m "Ortsgeschichte um vollständige PDF-Angaben ergänzen"
          git push origin HEAD:agent/ahnsen-history-full
