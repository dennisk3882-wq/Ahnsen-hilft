name: Temporary wire Ahnsen history

on:
  push:
    branches:
      - agent/ahnsen-history-full

permissions:
  contents: write

jobs:
  wire-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ahnsen-history-full
      - name: Wire history page and smoke checks
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('pwa_ui.py')
          text = ui.read_text(encoding='utf-8')
          import_anchor = 'from fastapi.responses import HTMLResponse\n'
          if 'from ahnsen_history import history_content\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('Import-Anker in pwa_ui.py fehlt')
              text = text.replace(import_anchor, import_anchor + '\nfrom ahnsen_history import history_content\n', 1)

          func_anchor = 'def info_page(kind: str, settings: dict) -> HTMLResponse:\n    config = '
          func_replacement = (
              'def info_page(kind: str, settings: dict) -> HTMLResponse:\n'
              '    if kind == "ueber-ahnsen":\n'
              '        return page(\n'
              '            "Über Ahnsen",\n'
              '            history_content(),\n'
              '            active="home",\n'
              '            description="Ahnsen von den Anfängen bis heute – vollständige Ortsgeschichte bis 2026",\n'
              '            body_class="history-view",\n'
              '        )\n'
              '    config = '
          )
          if 'history_content()' not in text:
              if func_anchor not in text:
                  raise SystemExit('info_page-Anker in pwa_ui.py fehlt')
              text = text.replace(func_anchor, func_replacement, 1)
          ui.write_text(text, encoding='utf-8')

          smoke = Path('.github/workflows/pwa-smoke.yml')
          test = smoke.read_text(encoding='utf-8')
          test = test.replace('from pwa_ui import home_page\n', 'from pwa_ui import home_page, info_page\n', 1)
          anchor = '          assert "Ahnsen" in html and "Mängel melden" in html\n'
          extra = (
              '          history_html = info_page("ueber-ahnsen", {}).body.decode()\n'
              '          assert "Ahnsens Geschichte beginnt nicht 1256" in history_html\n'
              '          assert "Der Dreißigjährige Krieg" in history_html\n'
              '          assert "Bevölkerungsentwicklung im Langzeitblick" in history_html\n'
              '          assert "Quellen und Literatur" in history_html\n'
              '          assert "1.455 Einwohner" in history_html\n'
          )
          if 'history_html = info_page("ueber-ahnsen", {})' not in test:
              if anchor not in test:
                  raise SystemExit('Smoke-Test-Anker fehlt')
              test = test.replace(anchor, anchor + extra, 1)
          smoke.write_text(test, encoding='utf-8')
          PY
      - name: Validate implementation
        run: |
          python -m py_compile ahnsen_history.py pwa_ui.py
          python - <<'PY'
          from pwa_ui import info_page
          html = info_page('ueber-ahnsen', {}).body.decode()
          checks = [
              'Vorbemerkung: Was wir sicher wissen',
              '1256: Adenhusen',
              'Schelenbroick',
              'Zwangsarbeit',
              'Ahnsen heute – Stand 2026',
              'Bevölkerungsentwicklung im Langzeitblick',
              'Zeitleiste',
              'Quellen und Literatur',
              'Ahnsens Geschichte beginnt nicht 1256',
          ]
          missing = [item for item in checks if item not in html]
          assert not missing, missing
          assert html.count('class="history-chapter"') >= 20
          print('History page validation passed')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/temp-wire-ahnsen-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py ahnsen_history.py .github/workflows/pwa-smoke.yml .github/workflows/temp-wire-ahnsen-history.yml
          git commit -m "Vollständige Ortsgeschichte im Über-Ahnsen-Bereich anzeigen"
          git push origin HEAD:agent/ahnsen-history-full
