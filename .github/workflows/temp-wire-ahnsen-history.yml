name: Temporary wire Ahnsen history

on:
  push:
    branches:
      - agent/ahnsen-history-full

permissions:
  contents: write

jobs:
  wire-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ahnsen-history-full
      - name: Wire history page
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('pwa_ui.py')
          text = ui.read_text(encoding='utf-8')
          import_anchor = 'from fastapi.responses import HTMLResponse\n'
          if 'from ahnsen_history import history_content\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('Import-Anker in pwa_ui.py fehlt')
              text = text.replace(import_anchor, import_anchor + '\nfrom ahnsen_history import history_content\n', 1)

          func_anchor = 'def info_page(kind: str, settings: dict) -> HTMLResponse:\n    config = '
          func_replacement = (
              'def info_page(kind: str, settings: dict) -> HTMLResponse:\n'
              '    if kind == "ueber-ahnsen":\n'
              '        return page(\n'
              '            "Über Ahnsen",\n'
              '            history_content(),\n'
              '            active="home",\n'
              '            description="Ahnsen von den Anfängen bis heute – vollständige Ortsgeschichte bis 2026",\n'
              '            body_class="history-view",\n'
              '        )\n'
              '    config = '
          )
          if 'history_content()' not in text:
              if func_anchor not in text:
                  raise SystemExit('info_page-Anker in pwa_ui.py fehlt')
              text = text.replace(func_anchor, func_replacement, 1)
          ui.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax and history content
        run: |
          python -m py_compile ahnsen_history.py pwa_ui.py
          python - <<'PY'
          from ahnsen_history import history_content
          html = history_content()
          checks = [
              'Vorbemerkung: Was wir sicher wissen',
              '1256: Adenhusen',
              'Schelenbroick',
              'Zwangsarbeit',
              'Ahnsen heute – Stand 2026',
              'Bevölkerungsentwicklung im Langzeitblick',
              'Zeitleiste',
              'Quellen und Literatur',
              'Ahnsens Geschichte beginnt nicht 1256',
          ]
          missing = [item for item in checks if item not in html]
          assert not missing, missing
          assert html.count('class="history-chapter"') >= 20
          print('History page validation passed')
          PY
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa_ui.py
          git commit -m "Vollständige Ortsgeschichte im Über-Ahnsen-Bereich anzeigen"
          git push origin HEAD:agent/ahnsen-history-full
