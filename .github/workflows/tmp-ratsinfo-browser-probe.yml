name: Temporary Ratsinfo browser probe
on:
  push:
    branches: [agent/ahnsen-protokolle-direkt]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official SD.NET public webservices
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://samtgemeinde-eilsen.ratsinfomanagement.net'
          paths=[
            '/webservice/',
            '/webservice/portalsuche',
            '/webservice/portalsuche/',
            '/webservice/portalsearch',
            '/webservice/portalsearch/',
            '/webservice/portalSearch',
            '/webservice/recherche',
            '/webservice/search',
            '/webservice/suche',
            '/webservice/oparl/v1.1/body/1',
          ]
          headers={'User-Agent':'Ahnsen-hilft/1.0','Accept':'application/json,application/xml,text/xml,text/plain,*/*'}
          for p in paths:
              try:
                  r=requests.get(base+p,headers=headers,timeout=12,allow_redirects=False)
                  print('\nPATH',p)
                  print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LOC',r.headers.get('location'))
                  print('BODY',r.text.replace('\n',' ')[:1800])
              except Exception as e:
                  print('\nPATH',p,'ERROR',repr(e))
          PY
