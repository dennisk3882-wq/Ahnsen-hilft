name: Cleanup quiz node_modules

on:
  pull_request:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - '.github/workflows/cleanup-quiz-node-modules.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Prüf-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: quiz-build-cleanup
          fetch-depth: 0

      - name: node_modules entfernen und dauerhaft ignorieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-files --error-unmatch quiz-app/node_modules >/dev/null 2>&1; then
            git rm -r -f quiz-app/node_modules
          else
            git rm -r -f --ignore-unmatch quiz-app/node_modules
          fi

          cat > quiz-app/.gitignore <<'EOF'
          node_modules/
          .env
          .env.*
          npm-debug.log*
          EOF

          git rm -f .github/workflows/cleanup-quiz-node-modules.yml
          git add quiz-app/.gitignore
          git commit -m 'Entferne node_modules und nutze reproduzierbare Installation'
          git push origin HEAD:quiz-build-cleanup
