name: Temporary probe Eilsen SD.NET public routes
on:
  push:
    branches: [agent/import-current-2026-ris-protokoll]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-current-2026-ris-protokoll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe normal public RIM routes
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          base='https://samtgemeinde-eilsen.ratsinfomanagement.net/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'de-DE,de;q=0.9'})
          paths=['','recherche','recherche?terms=Ahnsen','termine','termine?__=','gremien','tops','vorlagen']
          report=[]
          discovered=[]
          for path in paths:
              url=urljoin(base,path)
              try:
                  r=s.get(url,timeout=30,allow_redirects=True)
                  text=r.text[:500000]
                  soup=BeautifulSoup(text,'html.parser')
                  links=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href'])
                      label=' '.join(a.stripped_strings)
                      if 'ratsinfomanagement.net' in href and (re.search(r'ahnsen|niederschrift|protokoll|2026',label,re.I) or re.search(r'pdf|tops|recherche',href,re.I)):
                          links.append({'label':label[:250],'url':href})
                  discovered.extend(links)
                  report.append({'requested':url,'status':r.status_code,'final':r.url,'length':len(r.content),'title':(soup.title.string.strip() if soup.title and soup.title.string else ''),'blocked':('temporarily blocked' in text.lower() or 'access denied' in text.lower()),'links':links[:100],'preview':' '.join(soup.stripped_strings)[:3000]})
              except Exception as e:
                  report.append({'requested':url,'error':str(e)})
          Path=None
          with open('ris_public_route_probe.json','w',encoding='utf-8') as f: json.dump({'report':report,'discovered':discovered},f,ensure_ascii=False,indent=2)
          print(json.dumps({'routes':[(x.get('requested'),x.get('status'),x.get('blocked'),x.get('title')) for x in report],'links':len(discovered)},ensure_ascii=False,indent=2))
          PY
      - run: cat ris_public_route_probe.json
      - name: Remove temporary workflow and commit report
        if: always()
        run: |
          rm -f .github/workflows/tmp-probe-ris-public-routes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Öffentliche Eilsen-RIS-Routen geprüft' || true
          git push origin HEAD:agent/import-current-2026-ris-protokoll
