name: Mobility trip stop buttons smoke tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: mobility-trip-buttons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./mobility-trip-buttons-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate stop-list actions
        run: |
          python -m py_compile mobility_trip_buttons_patch.py mobility_compact_patch.py mobility_journey_patch.py feature_routes.py
          python - <<'PY'
          import asyncio
          import mobility_trip_buttons_patch as patch

          html = patch.content()
          assert "Alle Haltestellen anzeigen" in html
          assert "/api/mobilitaet/fahrt-id" in html
          assert "journey-stops-btn" in html
          assert "trip-sheet-backdrop" in html

          paths = {getattr(route, "path", "") for route in patch.router.routes}
          assert "/api/mobilitaet/fahrt-id" in paths
          assert "/api/mobilitaet/verbindungen" in paths

          original = patch.journey._trip_stops
          patch.journey._trip_stops = lambda trip_id: {
              "status": "ok",
              "line": "2132",
              "direction": "Bückeburg Bahnhof",
              "stops": [
                  {"name": "Ahnsen, Theodor-Heuss-Str.", "departure": "20:08", "arrival": "20:08"},
                  {"name": "Klinikum Schaumburg", "departure": "20:13", "arrival": "20:13"},
                  {"name": "Bückeburg Bahnhof", "departure": "", "arrival": "20:32"},
              ],
          }
          try:
              response = asyncio.run(patch.journey_trip_details_by_id("trip-2132-test"))
              body = response.body.decode("utf-8")
              assert '"line":"2132"' in body
              assert "Bückeburg Bahnhof" in body
              assert "Theodor-Heuss" in body
          finally:
              patch.journey._trip_stops = original

          print("Mobility trip stop buttons smoke tests passed")
          PY
