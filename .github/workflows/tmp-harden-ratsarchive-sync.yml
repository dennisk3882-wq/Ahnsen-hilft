name: Temporary harden ratsarchive daily sync
on:
  push:
    branches: [agent/harden-ratsarchive-daily-sync]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-ratsarchive-daily-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        run: python scripts/tmp_harden_ratsarchive_sync.py
      - name: Install sync dependencies
        run: |
          pip install playwright==1.62.0 pypdf==6.15.0
          python -m playwright install --with-deps chromium
      - name: First official RIS sync
        run: xvfb-run -a python scripts/sync_ratsarchive_from_ris.py --years 6
      - name: Snapshot archive after first sync
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('static/ratsarchive-seed')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(base.iterdir()) if p.is_file()}
          Path('/tmp/archive_hashes.json').write_text(json.dumps(hashes,sort_keys=True),encoding='utf-8')
          data=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          assert len(data['meetings']) == 18
          assert {int(x['session_number']) for x in data['meetings']} == set(range(1,19))
          assert all('text_sha256' in x for x in data['meetings'])
          PY
      - name: Second official RIS sync must be semantic no-op
        run: |
          xvfb-run -a python scripts/sync_ratsarchive_from_ris.py --years 6
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('static/ratsarchive-seed')
          before=json.loads(Path('/tmp/archive_hashes.json').read_text(encoding='utf-8'))
          after={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(base.iterdir()) if p.is_file()}
          changed={k:(before.get(k),after.get(k)) for k in set(before)|set(after) if before.get(k)!=after.get(k)}
          print('semantic second-run changes=',changed)
          assert not changed, changed
          PY
      - name: Validate permanent workflow logic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('static/ratsarchive-seed')
          meetings=json.loads((base/'manifest.json').read_text(encoding='utf-8'))['meetings']
          seen=set(); pdf_count=0
          for item in meetings:
              assert item.get('organization')=='Gemeinderat Ahnsen'
              key=(item.get('date'),item.get('session_number'))
              assert key not in seen; seen.add(key)
              filename=str(item.get('filename') or '').strip()
              if not filename: continue
              path=base/filename
              assert path.is_file() and path.read_bytes().startswith(b'%PDF-')
              pdf_count += 1
          print('meetings=',len(meetings),'pdfs=',pdf_count)
          assert len(meetings)==18 and pdf_count==4
          PY
      - name: Compile Python
        run: python -m py_compile scripts/sync_ratsarchive_from_ris.py ratsarchive_seed.py
      - name: Commit only non-workflow hardening files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync_ratsarchive_from_ris.py static/ratsarchive-seed/manifest.json
          git commit -m 'Täglichen Ratsarchiv-Sync robust gegen PDF-Metadaten machen' || true
          git push origin HEAD:agent/harden-ratsarchive-daily-sync
