name: Bürgermeister Live Month Forecast Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-month-live-forecast-release.yml'

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply live forecast patch
        run: python .github/scripts/bgm_month_live_forecast_patch.py

      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          grep -Fq 'const liveProjection = () =>' BuergermeisterPWA/app.js
          grep -Fq 'liveTaxDelta' BuergermeisterPWA/app.js
          grep -Fq 'liveFoodCoverage' BuergermeisterPWA/app.js
          grep -Fq 'Bürgermeister live month forecast v1' BuergermeisterPWA/styles.css
          grep -Fq 'buergermeister-1992-plus-v9' BuergermeisterPWA/sw.js

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested live forecast and promote production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/app.js BuergermeisterPWA/styles.css BuergermeisterPWA/sw.js
          git rm .github/scripts/bgm_month_live_forecast_patch.py .github/workflows/bgm-month-live-forecast-release.yml
          git commit -m 'Make monthly tax forecast update live'
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git fetch origin buergermeister-production
          PROD_SHA="$(git rev-parse origin/buergermeister-production)"
          if ! git merge-base --is-ancestor "$PROD_SHA" "$RELEASE_SHA"; then
            echo 'Production branch is not an ancestor of tested release; refusing unsafe promotion.'
            exit 1
          fi
          git push origin "$RELEASE_SHA":refs/heads/buergermeister-production
          echo "Promoted tested live forecast release $RELEASE_SHA"
