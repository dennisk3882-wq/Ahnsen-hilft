name: Homepage weather dashboard smoke tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: home-weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./home-weather-smoke.db
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: test-password
      DASHBOARD_SESSION_SECRET: dashboard-test-secret
      PWA_SESSION_SECRET: pwa-test-secret-with-enough-entropy
      COOKIE_SECURE: "false"
      WARNING_BACKGROUND_ENABLED: "false"
      WEATHER_API_BASE: https://api.open-meteo.com/v1/forecast
      WEATHER_API_KEY: test-weather-key
      WEATHER_CACHE_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate compact homepage and weather forecast
        run: |
          python -m py_compile weather_service.py home_weather_center.py runtime_extensions.py
          python - <<'PY'
          import asyncio
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from database import SessionLocal
          from muelltermine_models import Muelltermin
          from pwa_core import startup
          from veranstaltungen_crud import save_veranstaltung

          startup()

          now = datetime.now(ZoneInfo('Europe/Berlin'))
          today = now.date()
          future = today + timedelta(days=30)
          save_veranstaltung(
              'winterfest', future.strftime('%d.%m.%Y'), '17:00 Uhr', 'DGH',
              'Veranstaltung', 'Testtermin für die Startseite.', '',
          )
          db = SessionLocal()
          waste_day = today + timedelta(days=1)
          db.add(Muelltermin(
              datum=waste_day, jahr=waste_day.year, wochentag='Donnerstag',
              abfuhrarten='Bioabfall, Leichtverpackungen', quelle='Smoke', adresse='Ahnsen',
          ))
          db.commit(); db.close()

          import weather_service

          class FakeResponse:
              status_code = 200
              def raise_for_status(self):
                  return None
              def json(self):
                  base = today.isoformat()
                  hourly_times = [f'{base}T{hour:02d}:00' for hour in range(24)]
                  daily_dates = [(today + timedelta(days=i)).isoformat() for i in range(6)]
                  return {
                      'timezone':'Europe/Berlin',
                      'current':{
                          'time':f'{base}T08:15','temperature_2m':21.4,'apparent_temperature':21.0,
                          'relative_humidity_2m':61,'precipitation':0.0,'weather_code':1,
                          'wind_speed_10m':11.2,'is_day':1,
                      },
                      'hourly':{
                          'time':hourly_times,
                          'temperature_2m':[18 + h/4 for h in range(24)],
                          'apparent_temperature':[18 + h/4 for h in range(24)],
                          'precipitation_probability':[10 for _ in range(24)],
                          'precipitation':[0 for _ in range(24)],
                          'weather_code':[1 for _ in range(24)],
                          'wind_speed_10m':[10 for _ in range(24)],
                      },
                      'daily':{
                          'time':daily_dates,
                          'weather_code':[1,2,3,61,1,0],
                          'temperature_2m_max':[25,24,22,20,23,26],
                          'temperature_2m_min':[14,15,13,12,13,15],
                          'precipitation_probability_max':[10,20,30,70,15,5],
                          'sunrise':[f'{d}T06:10' for d in daily_dates],
                          'sunset':[f'{d}T20:45' for d in daily_dates],
                      },
                  }

          calls = []
          def fake_get(url, *, params, headers, timeout):
              calls.append((url, dict(params), timeout))
              return FakeResponse()

          weather_service.requests.get = fake_get
          snapshot = weather_service.get_weather_snapshot(force=True)
          assert snapshot['available'] is True
          assert snapshot['current']['temperature'] == 21
          assert snapshot['current']['label'] == 'Überwiegend klar'
          assert len(snapshot['hourly']) == 24
          assert len(snapshot['daily']) == 6
          assert calls and calls[0][1]['forecast_days'] == 6
          assert calls[0][1]['timezone'] == 'Europe/Berlin'
          assert calls[0][1]['apikey'] == 'test-weather-key'

          import pwa_main
          from runtime_extensions import install_runtime_extensions
          install_runtime_extensions()
          assert pwa_main.app.state.home_weather_dashboard_installed is True

          def first_route(path, method):
              rows = [r for r in pwa_main.app.router.routes if getattr(r,'path','') == path and method in (getattr(r,'methods',set()) or set())]
              assert rows, (path, method)
              return rows[0]

          assert first_route('/', 'GET').endpoint.__module__ == 'home_weather_center'
          assert first_route('/wetter', 'GET').endpoint.__module__ == 'home_weather_center'
          assert first_route('/api/wetter', 'GET').endpoint.__module__ == 'home_weather_center'

          from home_weather_center import compact_home_with_weather, weather_page
          home = asyncio.run(compact_home_with_weather())
          html = home.body.decode('utf-8')
          assert 'home-weather-dashboard-style' in html
          assert 'hero-weather-chip' in html and 'href="/wetter"' in html
          assert 'Nächster Termin' in html
          assert 'Winterfest' in html
          assert 'Müllabfuhr · morgen' in html
          assert 'Bioabfall, Leichtverpackungen' in html
          assert '<section class="notice-card"' not in html
          assert '<section class="notice-card empty-notice"' not in html
          assert 'Aktuelles &amp; Termine' in html
          assert '<h3>Aktuelles</h3>' not in html

          weather_html = asyncio.run(weather_page()).body.decode('utf-8')
          assert 'Wetter in Ahnsen' in weather_html
          assert 'Tagesverlauf' in weather_html
          assert 'Die nächsten 5 Tage' in weather_html
          assert '/api/wetter' in weather_html
          assert 'Open-Meteo' in weather_html
          assert '00–23 Uhr' in weather_html

          print('Homepage weather dashboard smoke tests passed')
          PY
