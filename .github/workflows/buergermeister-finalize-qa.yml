name: Finalize Bürgermeister QA

on:
  push:
    branches: [main]
    paths:
      - 'BuergermeisterPWA/tools/finalize-qa.mjs'
      - '.github/workflows/buergermeister-finalize-qa.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize QA scripts
        working-directory: BuergermeisterPWA
        run: node tools/finalize-qa.mjs
      - name: Verify test JavaScript
        working-directory: BuergermeisterPWA
        run: node --check tests/autotest.mjs && node --check tests/planner-search.mjs
      - name: Commit final QA wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuergermeisterPWA/tests/autotest.mjs BuergermeisterPWA/tests/planner-search.mjs
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Make multi-strategy planner authoritative QA gate'
          git push origin main
