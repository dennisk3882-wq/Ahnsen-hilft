name: Temporary professional defect map patch
on:
  push:
    branches:
      - agent/professional-defect-map
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-defect-map
      - name: Apply patch
        run: python tmp_patch_map.py
      - name: Validate Python
        run: python -m py_compile community_routes.py community_ui.py pwa_main.py
      - name: Commit patch
        run: |
          rm tmp_patch_map.py .github/workflows/tmp-professional-defect-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_routes.py community_ui.py tmp_patch_map.py .github/workflows/tmp-professional-defect-map.yml
          git commit -m "Mängelkarte professionell überarbeiten"
          git push
