name: Add Bürgermeister PWA Install Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgm-install-button-release.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply install experience
        run: python .github/scripts/bgm_install_patch.py

      - name: Verify PWA install implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check BuergermeisterPWA/app.js
          python -m json.tool BuergermeisterPWA/manifest.webmanifest >/dev/null
          test -s BuergermeisterPWA/icons/icon-192.png
          test -s BuergermeisterPWA/icons/icon-512.png
          grep -Fq 'beforeinstallprompt' BuergermeisterPWA/app.js
          grep -Fq 'id="installBtn"' BuergermeisterPWA/app.js
          grep -Fq 'buergermeister-1992-plus-v6' BuergermeisterPWA/sw.js

      - name: Reachability diagnostics
        working-directory: BuergermeisterPWA
        run: node tests/reachability-diagnostic.mjs

      - name: Multi-strategy win planner
        working-directory: BuergermeisterPWA
        run: node tests/planner-search.mjs

      - name: Autonomous simulation QA
        working-directory: BuergermeisterPWA
        run: node tests/autotest.mjs

      - name: Commit tested install experience
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bgm-install-button-release.yml
          rm -f .github/scripts/bgm_install_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Bürgermeister PWA install experience"
          git push origin HEAD:main
