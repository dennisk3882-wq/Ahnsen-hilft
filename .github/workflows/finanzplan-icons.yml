name: Finanzplan PWA icons

on:
  push:
    branches: [finanzplan-v3-hardening, finanzplan]
    paths:
      - 'finanzplan/scripts/generate-icons.mjs'
      - '.github/workflows/finanzplan-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate PNG icons
        run: node finanzplan/scripts/generate-icons.mjs
      - name: Commit generated icons when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finanzplan/icon-192.png finanzplan/icon-512.png finanzplan/icon-maskable-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Finanzplan PWA PNG icons"
          git push origin HEAD:${GITHUB_REF_NAME}
