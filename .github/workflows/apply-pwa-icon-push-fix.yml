name: Apply PWA icon and push permission fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pwa-icon-push-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch PWA files
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Header install icon and cache-busting links.
          p = root / 'pwa_ui.py'
          s = p.read_text(encoding='utf-8')
          old = '''def icon(name: str) -> str:\n    return f'<span class="glyph" aria-hidden="true">{ICONS.get(name, "•")}</span>'\n'''
          new = '''def icon(name: str) -> str:\n    return f'<span class="glyph" aria-hidden="true">{ICONS.get(name, "•")}</span>'\n\n\ndef install_icon() -> str:\n    return """<svg class="install-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M12 6v8m0 0-3-3m3 3 3-3M10 18h4"/></svg>"""\n'''
          if 'def install_icon()' not in s and old in s:
              s = s.replace(old, new, 1)
          old_header = 'header = f\'<header class="topbar">{_brand()}<button class="install-button" id="install-app" type="button" hidden>{icon("download")}<span>Installieren</span></button></header>\' if show_header else ""'
          new_header = 'header = f\'<header class="topbar">{_brand()}<button class="install-button" id="install-app" type="button" hidden aria-label="Ahnsen hilft installieren" title="App installieren">{install_icon()}<span>Installieren</span></button></header>\' if show_header else ""'
          s = s.replace(old_header, new_header)
          s = s.replace('<link rel="apple-touch-icon" href="/pwa/icon-192.png"><link rel="icon" href="/pwa/icon-192.png"><link rel="stylesheet" href="/pwa.css?v=1">', '<link rel="apple-touch-icon" href="/pwa/icon-192.png"><link rel="icon" href="/pwa/icon.svg?v=2" type="image/svg+xml"><link rel="alternate icon" href="/pwa/icon-192.png"><link rel="stylesheet" href="/pwa.css?v=2">')
          s = s.replace('<script src="/pwa.js?v=1" defer></script>', '<script src="/pwa.js?v=2" defer></script>')
          p.write_text(s, encoding='utf-8')

          # Install button SVG styling.
          p = root / 'static' / 'pwa.css'
          s = p.read_text(encoding='utf-8')
          needle = '.install-button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--forest);background:rgba(255,255,255,.82);font-weight:800;cursor:pointer}'
          addition = '.install-icon{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}'
          if addition not in s and needle in s:
              s = s.replace(needle, needle + addition, 1)
          p.write_text(s, encoding='utf-8')

          # Service-worker icon caching and clear push permission guidance.
          p = root / 'static' / 'pwa.js'
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE = 'ahnsen-hilft-public-v3';", "const CACHE = 'ahnsen-hilft-public-v4';")
          if "'/pwa/icon.svg?v=2'" not in s:
              s = s.replace("'/pwa/icon-512.png',\n    '/assets/ahnsen-startseite.png',", "'/pwa/icon-512.png',\n    '/pwa/icon.svg?v=2',\n    '/assets/ahnsen-startseite.png',", 1)
          if "'/pwa/icon.svg'," not in s:
              second = s.find("'/pwa/icon-512.png',", s.find('const CACHEABLE'))
              if second >= 0:
                  end = s.find('\n', second)
                  s = s[:end+1] + "    '/pwa/icon.svg',\n" + s[end+1:]
          s = s.replace("navigator.serviceWorker.register('/pwa.js?worker=3'", "navigator.serviceWorker.register('/pwa.js?worker=4'")
          old_try = '''        try {\n          enablePush.disabled = true;\n          setPushStatus('Benachrichtigungen werden eingerichtet …');\n          const keyResponse = await fetch('/api/push/public-key', { credentials: 'same-origin' });'''
          new_try = '''        try {\n          enablePush.disabled = true;\n          if (!('Notification' in window)) {\n            throw new Error('Dieses Gerät unterstützt keine Benachrichtigungen.');\n          }\n          if (Notification.permission === 'denied') {\n            throw new Error('Benachrichtigungen sind für diese Website blockiert. Öffne im Browser die Website-Einstellungen, erlaube Benachrichtigungen, lade die Seite neu und versuche es erneut.');\n          }\n          setPushStatus('Benachrichtigungen werden eingerichtet …');\n          if (Notification.permission !== 'granted') {\n            const permission = await Notification.requestPermission();\n            if (permission !== 'granted') {\n              throw new Error('Benachrichtigungen wurden nicht erlaubt. Bitte erlaube sie in den Website-Einstellungen des Browsers.');\n            }\n          }\n          const keyResponse = await fetch('/api/push/public-key', { credentials: 'same-origin' });'''
          if old_try in s:
              s = s.replace(old_try, new_try, 1)
          old_catch = '''        } catch (error) {\n          setPushStatus(error.message || 'Push konnte nicht aktiviert werden.');\n        } finally {'''
          new_catch = '''        } catch (error) {\n          const rawMessage = String(error && error.message ? error.message : '');\n          const blocked = (error && error.name === 'NotAllowedError')\n            || /permission denied|registration failed/i.test(rawMessage);\n          setPushStatus(blocked\n            ? 'Benachrichtigungen sind im Browser blockiert. Tippe oben auf das Website-Symbol neben der Adresse, öffne Berechtigungen oder Website-Einstellungen, stelle Benachrichtigungen auf Zulassen und lade die Seite neu.'\n            : (rawMessage || 'Push konnte nicht aktiviert werden.'));\n        } finally {'''
          if old_catch in s:
              s = s.replace(old_catch, new_catch, 1)
          p.write_text(s, encoding='utf-8')

          # Serve the vector icon and prefer it in the install manifest.
          p = root / 'pwa_main.py'
          s = p.read_text(encoding='utf-8')
          route = '''\n\n@app.get("/pwa/icon.svg")\nasync def pwa_vector_icon():\n    return FileResponse(\n        STATIC_DIR / "icon-ahnsen.svg",\n        media_type="image/svg+xml",\n        headers={"Cache-Control": "public, max-age=604800"},\n    )\n'''
          anchor = '''@app.get("/manifest.webmanifest")\nasync def manifest():'''
          if '@app.get("/pwa/icon.svg")' not in s and anchor in s:
              s = s.replace(anchor, route + '\n\n' + anchor, 1)
          old_icons = '''            "icons": [\n                {"src": "/pwa/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},\n                {"src": "/pwa/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"},\n            ],'''
          new_icons = '''            "icons": [\n                {"src": "/pwa/icon.svg?v=2", "sizes": "any", "type": "image/svg+xml", "purpose": "any maskable"},\n                {"src": "/pwa/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},\n                {"src": "/pwa/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},\n            ],'''
          if old_icons in s:
              s = s.replace(old_icons, new_icons, 1)
          s = s.replace("icon: data.icon || '/pwa/icon-192.png',", "icon: data.icon || '/pwa/icon.svg?v=2',")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile pwa_ui.py pwa_main.py
          node --check static/pwa.js
          test -s static/icon-ahnsen.svg
      - name: Commit changes
        run: |
          git config user.name "Ahnsen PWA automation"
          git config user.email "actions@users.noreply.github.com"
          git add pwa_ui.py pwa_main.py static/pwa.css static/pwa.js static/icon-ahnsen.svg
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Use professional Ahnsen app icon and improve push permission errors"
            git push
          fi
