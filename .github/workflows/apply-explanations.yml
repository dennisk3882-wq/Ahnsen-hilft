name: Apply 500 Learning Explanations

on:
  pull_request:
    branches:
      - ahnsen-live-quiz-online
    paths:
      - '.github/workflows/apply-explanations.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'quiz-explanations-500'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: quiz-explanations-500

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: quiz-app/package-lock.json

      - name: Erklärungs-Patcher zusammensetzen und ausführen
        shell: bash
        run: |
          mkdir -p quiz-app/tools
          cat quiz-app/tools/.apply-explanations.part* | base64 --decode | gzip --decompress > quiz-app/tools/apply-learning-explanations.js
          python - <<'PY'
          from pathlib import Path
          target = Path('quiz-app/tools/apply-learning-explanations.js')
          content = target.read_text(encoding='utf-8')
          for token in (
              '${i + 1}',
              '${escapeHtml(question.explanation)}',
              '${file}',
              '${question.id}',
              '${label}',
          ):
              content = content.replace(token, '\\' + token)
          marker = "\nreplaceExact(\n  'quiz-app/tests/catalog-quality.test.js',\n  `- gültiger correctIndex von 0 bis 3"
          start = content.find(marker)
          end = content.find("\n\nfor (const relativePath", start)
          if start < 0 or end < 0:
              raise SystemExit('Optionaler Berichtsschritt konnte im Patcher nicht entfernt werden.')
          content = content[:start] + content[end:]
          target.write_text(content, encoding='utf-8')
          PY
          node --check quiz-app/tools/apply-learning-explanations.js
          node quiz-app/tools/apply-learning-explanations.js
          rm -f quiz-app/tools/.apply-explanations.part*
          python - <<'PY'
          from pathlib import Path
          target = Path('quiz-app/tests/catalog-quality.test.js')
          content = target.read_text(encoding='utf-8')
          old = "  '- gültiger correctIndex von 0 bis 3',\n  '- exakte Duplikate und auffällig ähnliche Fragen',"
          new = "  '- gültiger correctIndex von 0 bis 3',\n  '- vollständige, verständliche Lern-Erklärungen ohne Standardfloskeln',\n  '- exakte Duplikate und auffällig ähnliche Fragen',"
          if old not in content:
              raise SystemExit('Qualitätsbericht konnte nicht ergänzt werden.')
          target.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Abhängigkeiten installieren und alle Prüfungen ausführen
        working-directory: quiz-app
        run: |
          npm ci
          npm run test:all

      - name: Fertige Änderungen übernehmen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "500 hochwertige Lern-Erklärungen vollständig einbauen"
          git push origin HEAD:quiz-explanations-500
