name: Temporary local ratsarchive apply
on:
  push:
    branches: [agent/local-ratsarchiv]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-ratsarchiv
      - name: Apply local ratsarchive patch
        run: python .github/apply_ratsarchive.py
      - name: Validate modules
        run: |
          python -m py_compile ratsarchive_models.py ratsarchive_service.py ratsinfo_service.py community_routes.py community_dashboard.py community_ui.py community_search.py pwa_core.py
          python - <<'PY'
          from pathlib import Path
          service=Path('ratsarchive_service.py').read_text()
          routes=Path('community_routes.py').read_text()
          ui=Path('community_ui.py').read_text()
          dash=Path('community_dashboard.py').read_text()
          assert 'CouncilMeeting' in service
          assert '/politik-rat/dokument/{document_id}' in routes
          assert '/intern/politik/archiv' in routes
          assert 'Lokales Ratsarchiv' in dash
          assert 'lokalen Ratsarchiv' in ui or 'Lokales Ratsarchiv' in ui
          print('ratsarchive validation ok')
          PY
      - name: Remove temporary helpers and commit
        run: |
          rm -f .github/apply_ratsarchive.py .github/workflows/tmp-ratsarchive-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lokales Ratsarchiv mit PDF-Import einbauen'
          git push origin HEAD:agent/local-ratsarchiv
