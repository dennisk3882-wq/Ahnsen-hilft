name: Temporary fix council fstrings
on:
  push:
    branches: [agent/admin-automations-council-fire]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-automations-council-fire
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix anwenden
        run: python scripts/tmp_fix_council_fstrings.py
      - name: Kompilieren
        run: python -m py_compile *.py
      - name: Nur Codefix committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community_ui.py
          git commit -m 'Ratsmitgliederkarten Python-3.11-kompatibel rendern' || true
          git push origin HEAD:agent/admin-automations-council-fire
